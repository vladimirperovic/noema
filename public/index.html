  <div class="tp-backdrop" id="tpBackdrop"></div>
  <div class="tp-modal" id="tpModal" role="dialog" aria-modal="true" aria-label="Select time">
    <div class="tp-header">Set time</div>
    <div class="tp-drums">
      <!-- Hours drum -->
      <div class="tp-drum" id="tpDrumH">
        <button class="tp-arrow tp-up" data-drum="h" aria-label="Hour +1">&#9650;</button>
        <div class="tp-scroll-wrap">
          <div class="tp-highlight"></div>
          <div class="tp-scroll" id="tpScrollH"></div>
          <input class="tp-edit" id="tpEditH" type="text" inputmode="numeric" maxlength="2" aria-label="Enter hour">
        </div>
        <button class="tp-arrow tp-down" data-drum="h" aria-label="Hour -1">&#9660;</button>
      </div>
      <span class="tp-separator">:</span>
      <!-- Minutes drum -->
      <div class="tp-drum" id="tpDrumM">
        <button class="tp-arrow tp-up" data-drum="m" aria-label="Minute +1">&#9650;</button>
        <div class="tp-scroll-wrap">
          <div class="tp-highlight"></div>
          <div class="tp-scroll" id="tpScrollM"></div>
          <input class="tp-edit" id="tpEditM" type="text" inputmode="numeric" maxlength="2" aria-label="Enter minute">
        </div>
        <button class="tp-arrow tp-down" data-drum="m" aria-label="Minute -1">&#9660;</button>
      </div>
    </div>
    <div class="tp-footer">
      <button class="tp-btn" id="tpClear">Clear</button>
      <button class="tp-btn primary" id="tpSave">Save</button>
    </div>
  </div>

  <main class="board">
    <div class="board-inner" id="boardInner"><!-- kolone iz JS-a --></div>
  </main>

  <footer class="footer">
    <span class="footer-left">
      Noema · <em>misao na dohvat ruke</em>
      <span class="sys-sep">|</span>
      <span class="sys-stats" id="sysStats" title="Resursi servera">CPU: <b>—</b> · RAM: <b>—</b> · Disk: <b>—</b></span>
      <span class="sys-sep">|</span>
      <a href="/help" class="sys-stats" style="text-decoration: none; cursor: pointer;">help</a>
      <span class="sys-sep">|</span>
      <a href="/logout" class="sys-stats" style="text-decoration: none; cursor: pointer;">logout</a>
    </span>
    <div style="display:inline-flex; gap:0.5rem; align-items:center;">
      <button class="footer-theme" id="pageWidth" type="button" title="Promijeni širinu stranice (90% ili normalno)" aria-label="Širina stranice" style="width:auto; padding: 0 8px; font-weight:600; font-size:0.75rem;">WIDTH</button>
      <button class="footer-theme" id="fontDec" type="button" title="Smanji tekst" aria-label="Smanji tekst">
        <span style="font-size: 0.85em; font-family: var(--font-sans); font-weight:600;">A</span>
      </button>
      <button class="footer-theme" id="fontReset" type="button" title="Vrati na original" aria-label="Vrati na original" style="width:auto; padding: 0 8px;">
        <span style="font-size: 0.85em; font-family: var(--font-sans); font-weight:600;">100%</span>
      </button>
      <button class="footer-theme" id="fontInc" type="button" title="Povećaj tekst" aria-label="Povećaj tekst">
        <span style="font-size: 1.25em; font-family: var(--font-sans); font-weight:600;">A</span>
      </button>
      <span class="sys-sep" style="margin: 0 20px;">|</span>
      <button class="footer-theme" id="footerTheme" type="button" title="Change theme" aria-label="Change theme">
        <span class="theme-icon" id="ftIcon">☾</span>
      </button>
    </div>
  </footer>

  <script>
    "use strict";

    const DAYS = [
      { key: "yesterday", label: "Juče", cls: "is-yesterday", sub: "prošli dan", offset: -1 },
      { key: "today", label: "Danas", cls: "is-today", sub: "danas", offset: 0 },
      { key: "tomorrow", label: "Sjutra", cls: "is-tomorrow", sub: "naredni dan", offset: 1 },
    ];

    let state = { yesterday: [], today: [], tomorrow: [] };
    let calendarState = {
      configured: false,
      connected: false,
      yesterday: { events: [], loading: false },
      today: { events: [], loading: false },
      tomorrow: { events: [], loading: false }
    };
    // Na mobilnom je "Juče" skupljeno (samo header + dugme) da ne zakloni "Danas".
    // Na desktopu je ovo bez efekta (vidi CSS). Pamti se kroz re-render-e.
    let yesterdayOpen = false;

    function dateFor(offset) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d;
    }
    function fmtDate(d) {
      const days = ["nedelja", "ponedeljak", "utorak", "sreda", "četvrtak", "petak", "subota"];
      const months = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "avg", "sep", "okt", "nov", "dec"];
      return `${days[d.getDay()]} · ${d.getDate()}. ${months[d.getMonth()]}`;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch { /* not json */ }
      if (!res.ok) throw new Error((json && json.error) || `HTTP ${res.status}`);
      return json;
    }

    function render() {
      const board = document.getElementById("boardInner");
      board.innerHTML = "";
      for (const day of DAYS) board.appendChild(renderColumn(day));
    }

    function renderColumn(day) {
      const tasks = state[day.key] || [];
      const open = tasks.filter((t) => !t.done).length;
      const col = document.createElement("section");
      col.className = `column ${day.cls}`;
      col.dataset.day = day.key; // za drag & drop drop-zone detekciju

      // "Juče" se na mobilnom može skupiti — skriva listu, ostaje header + dugme.
      const collapsible = day.key === "yesterday" && tasks.length > 0;
      if (collapsible && !yesterdayOpen) col.classList.add("collapsed");

      const head = document.createElement("div");
      head.className = "column-head";
      head.innerHTML = `
        <div class="day-title">${day.label}</div>
        <div class="day-date">${fmtDate(dateFor(day.offset))}</div>
        <div class="day-count"><span class="num">${open}</span> otvorenih · ${tasks.length} total</div>
      `;
      if (collapsible) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "day-toggle";
        toggle.setAttribute("aria-expanded", String(yesterdayOpen));
        toggle.innerHTML = `<span class="dt-label">${yesterdayOpen ? "Sakrij" : "Otvori"}</span><span class="chev">›</span>`;
        toggle.addEventListener("click", () => {
          const opening = !yesterdayOpen;
          yesterdayOpen = opening;
          toggle.setAttribute("aria-expanded", String(opening));
          toggle.querySelector(".dt-label").textContent = opening ? "Sakrij" : "Otvori";

          const list = col.querySelector(".col-body");
          // Animiraj samo na mobilnom (gdje je dugme vidljivo i transition definisan).
          const animate = list && getComputedStyle(toggle).display !== "none";
          if (!animate) { col.classList.toggle("collapsed", !opening); return; }

          const onMaxHeightEnd = (cb) => {
            const te = (e) => {
              if (e.propertyName !== "max-height") return;
              list.removeEventListener("transitionend", te);
              cb();
            };
            list.addEventListener("transitionend", te);
          };
          if (opening) {
            col.classList.remove("collapsed");         // padding/opacity → puni (animira)
            const h = list.scrollHeight;               // puna visina sadržaja
            list.style.maxHeight = "0px";
            void list.offsetHeight;                    // commit početnog stanja (inače skok)
            list.style.maxHeight = h + "px";
            onMaxHeightEnd(() => { list.style.maxHeight = "none"; }); // pusti da raste dinamički
          } else {
            list.style.maxHeight = list.scrollHeight + "px";
            void list.offsetHeight;                    // commit pune visine prije skupljanja
            col.classList.add("collapsed");            // padding/opacity → 0 (animira uz visinu)
            list.style.maxHeight = "0px";
            onMaxHeightEnd(() => { list.style.maxHeight = ""; }); // CSS (collapsed) preuzme = 0
          }
        });
        head.appendChild(toggle);
      }
      col.appendChild(head);

      const colBody = document.createElement("div");
      colBody.className = "col-body";

      // Calendar sekcija
      colBody.appendChild(renderCalendar(day.key));

      // "Juče" je read-only za dodavanje — nema add-row (ne mogu se praviti
      // obaveze u prošlosti; tamo stižu samo preostali/zakasneli taskovi).
      let addRow = null;
      if (day.key !== "yesterday") {
        addRow = document.createElement("div");
        addRow.className = "add-row";
        addRow.innerHTML = `
          <input class="add-input" type="text" placeholder="Dodaj u ${day.label.toLowerCase()}…" maxlength="280" />
          <button class="add-btn" title="Dodaj (Enter)">+ Dodaj</button>
        `;
        const input = addRow.querySelector(".add-input");
        const btn = addRow.querySelector(".add-btn");
        const submit = async () => {
          const title = input.value.trim();
          if (!title) return;
          btn.disabled = true;
          try {
            const res = await api("/api/todos", {
              method: "POST",
              body: JSON.stringify({ title, day: day.key, priority: "normal" }),
            });
            state[day.key].unshift(res.todo);
            input.value = "";
            render();
          } catch (err) {
            alert("Greška: " + err.message);
          } finally {
            btn.disabled = false;
          }
        };
        btn.addEventListener("click", submit);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      }

      const list = document.createElement("ul");
      list.className = "task-list";
      if (tasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = day.key === "yesterday"
          ? "Ništa nije preostalo."
          : day.key === "today" ? "Čisto. Dodaj prvi task iznad." : "Još prazno za sjutra.";
        list.appendChild(empty);
      } else {
        for (const t of tasks) list.appendChild(renderTask(t, day.key));
      }
      colBody.appendChild(list);
      if (addRow) colBody.appendChild(addRow); // input + dugme na dnu kolone (osim "Juče")
      col.appendChild(colBody);
      return col;
    }

    function renderTask(task, dayKey) {
      const li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");
      li.dataset.id = task.id;
      


      const check = document.createElement("div");
      check.className = "task-check";
      check.setAttribute("role", "checkbox");
      check.setAttribute("aria-checked", String(task.done));
      check.innerHTML = `<svg viewBox="0 0 14 14"><polyline points="2,7 6,11 12,3"/></svg>`;
      check.addEventListener("click", () => toggleDone(task, dayKey, li, check));

      const body = document.createElement("div");
      body.className = "task-body";
      body.innerHTML = `
        <div class="task-title" title="Klikni ili dvoklikni za izmjenu">${escapeHtml(task.title)} <span class="edit-icon" title="Izmijeni naslov">✎</span></div>
      `;
      const titleEl = body.querySelector(".task-title");
      titleEl.addEventListener("click", (e) => {
        e.stopPropagation();
        editTaskTitle(task, titleEl);
      });
      titleEl.addEventListener("dblclick", (e) => {
        e.stopPropagation();
        editTaskTitle(task, titleEl);
      });

      const topRow = document.createElement("div");
      topRow.className = "task-top";
      topRow.appendChild(check);
      topRow.appendChild(body);
      // del se dodaje na kraj topRow-a (gornji desni ugao) — vidi ispod.

      const prio = document.createElement("span");
      prio.className = `prio ${task.priority}`;
      prio.setAttribute("role", "button");
      prio.setAttribute("tabindex", "0");
      prio.setAttribute("title", "Promijeni prioritet");
      prio.textContent = task.priority;

      // Tap-to-cycle prioritet: normal → high → low → normal.
      const cyclePrio = () => cyclePriority(task, prio);
      prio.addEventListener("click", cyclePrio);
      prio.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cyclePrio(); }
      });

      const time = document.createElement("div");
      time.className = "task-time" + (task.time ? " set" : "");
      time.setAttribute("title", "Set time");
      time.innerHTML = `
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tt-text">${task.time || ""}</span>
      `;
      time.addEventListener("pointerdown", (e) => { e.stopPropagation(); });
      time.addEventListener("click", (e) => {
        e.stopPropagation();
        openCustomTimePicker(task, time);
      });

      const del = document.createElement("button");
      del.className = "task-delete";
      del.setAttribute("title", "Obriši");
      del.setAttribute("aria-label", "Obriši task");
      del.innerHTML = "×";
      del.addEventListener("click", () => removeTask(task, dayKey, li));
      topRow.appendChild(del); // gornji desni ugao

      const bottomChips = document.createElement("div");
      bottomChips.className = "task-chips";
      bottomChips.appendChild(prio); // prioritet lijevo

      // Subtasks prikaz
      if (task.subtasks && task.subtasks.length > 0) {
        const subList = document.createElement("div");
        subList.className = "subtask-list";
        subList.style.marginTop = "0.5rem";
        subList.style.marginBottom = "0.5rem";
        subList.style.display = "flex";
        subList.style.flexDirection = "column";
        subList.style.gap = "0.3rem";
        
        task.subtasks.forEach((st, idx) => {
          const sub = document.createElement("div");
          sub.className = "subtask" + (st.done ? " done" : "");
          sub.style.display = "flex";
          sub.style.alignItems = "center";
          sub.style.gap = "0.5rem";
          sub.style.fontSize = "0.85rem";
          sub.style.opacity = st.done ? "0.5" : "1";
          
          // Border like label but different color (using a subtle purple/indigo theme)
          sub.style.border = "1px solid rgba(138, 43, 226, 0.25)";
          sub.style.backgroundColor = "rgba(138, 43, 226, 0.04)";
          sub.style.borderRadius = "6px";
          sub.style.padding = "4px 8px";
          
          const sCheck = document.createElement("div");
          sCheck.className = "task-check";
          sCheck.style.width = "18px";
          sCheck.style.height = "18px";
          sCheck.style.flexShrink = "0";
          sCheck.setAttribute("role", "checkbox");
          sCheck.setAttribute("aria-checked", String(st.done));
          sCheck.innerHTML = `<svg viewBox="0 0 14 14" style="width:10px;height:10px;"><polyline points="2,7 6,11 12,3"/></svg>`;
          sCheck.addEventListener("click", async (e) => {
            e.stopPropagation();
            st.done = !st.done;
            try {
              await api(`/api/todos/${task.id}`, { method: "PATCH", body: JSON.stringify({ subtasks: task.subtasks }) });
              render();
            } catch (err) {
              st.done = !st.done;
              alert("Greška: " + err.message);
            }
          });
          
          const sTitle = document.createElement("div");
          sTitle.textContent = st.title;
          sTitle.style.flex = "1";
          sTitle.style.textDecoration = st.done ? "line-through" : "none";
          
          const sDel = document.createElement("button");
          sDel.className = "task-delete";
          sDel.style.width = "20px";
          sDel.style.height = "20px";
          sDel.style.fontSize = "0.9rem";
          sDel.innerHTML = "×";
          sDel.addEventListener("click", async (e) => {
            e.stopPropagation();
            const prev = [...task.subtasks];
            task.subtasks.splice(idx, 1);
            sub.remove();
            try {
              await api(`/api/todos/${task.id}`, { method: "PATCH", body: JSON.stringify({ subtasks: task.subtasks }) });
              render();
            } catch (err) {
              task.subtasks = prev;
              alert("Greška: " + err.message);
            }
          });
          
          sub.appendChild(sCheck);
          sub.appendChild(sTitle);
          sub.appendChild(sDel);
          subList.appendChild(sub);
        });
        body.appendChild(subList);
      }

      const addSubBtn = document.createElement("button");
      addSubBtn.className = "prio subtask-add";
      addSubBtn.title = "Dodaj subtask";
      addSubBtn.innerHTML = "+ Subtask";
      addSubBtn.style.marginRight = "auto";
      addSubBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const title = prompt("Unesi subtask:");
        if (!title) return;
        task.subtasks = task.subtasks || [];
        task.subtasks.push({ id: Math.random().toString(36).substr(2, 9), title, done: false });
        try {
          await api(`/api/todos/${task.id}`, { method: "PATCH", body: JSON.stringify({ subtasks: task.subtasks }) });
          render();
        } catch (err) {
          task.subtasks.pop();
          alert("Greška: " + err.message);
        }
      });
      bottomChips.appendChild(addSubBtn);

      // Repeat
      const REPEAT_OPTIONS = [
        { value: "daily", label: "Daily" },
        { value: "weekdays", label: "Weekdays" },
        { value: "weekends", label: "Weekends" },
        { value: "mon", label: "Mon" },
        { value: "tue", label: "Tue" },
        { value: "wed", label: "Wed" },
        { value: "thu", label: "Thu" },
        { value: "fri", label: "Fri" },
        { value: "sat", label: "Sat" },
        { value: "sun", label: "Sun" },
      ];
      function addRepeatButton() {
        const btn = document.createElement("button");
        btn.className = "repeat-add";
        btn.setAttribute("title", "Ponavljaj");
        btn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          task.repeat = "daily";
          btn.replaceWith(buildRepeatSelect("daily"));
          fetch(`/api/todos/${task.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ repeat: "daily" })
          }).catch(() => {});
        });
        btn.addEventListener("pointerdown", (e) => e.stopPropagation());
        return btn;
      }
      function buildRepeatSelect(val) {
        const rs = document.createElement("select");
        rs.className = "repeat-select has-repeat";
        rs.innerHTML = `<option value="">✕</option>` +
          REPEAT_OPTIONS.map(o => `<option value="${o.value}"${o.value === val ? ' selected' : ''}>${o.label}</option>`).join("");
        rs.addEventListener("change", (e) => {
          e.stopPropagation();
          const v = rs.value;
          task.repeat = v;
          if (!v) {
            rs.replaceWith(addRepeatButton());
          }
          fetch(`/api/todos/${task.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ repeat: v })
          }).catch(() => {});
        });
        rs.addEventListener("pointerdown", (e) => e.stopPropagation());
        return rs;
      }
      const repeatEl = task.repeat ? buildRepeatSelect(task.repeat) : addRepeatButton();
      bottomChips.appendChild(repeatEl);
      // Move-to-next-day dugme
      if (dayKey !== "tomorrow") {
        const nextDay = dayKey === "yesterday" ? "today" : "tomorrow";
        const btnTitle = dayKey === "yesterday" ? "Prebaci za danas" : "Prebaci za sjutra";
        const moveBtn = document.createElement("button");
        moveBtn.className = "prio move-tomorrow";
        moveBtn.setAttribute("title", btnTitle);
        moveBtn.innerHTML = "&raquo;";
        moveBtn.addEventListener("click", () => moveTaskToDay(task, dayKey, nextDay));
        bottomChips.appendChild(moveBtn);
      }

      const bottomRow = document.createElement("div");
      bottomRow.className = "task-bottom";
      bottomRow.appendChild(bottomChips);
      bottomRow.appendChild(time); // sat skroz desno (space-between)

      li.appendChild(topRow);
      li.appendChild(bottomRow);
      attachDrag(li, task, dayKey);
      return li;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function renderCalendar(dayKey) {
      const calDay = calendarState[dayKey];
      const sec = document.createElement("div");
      sec.className = "cal-section";
      sec.innerHTML = `
        <div class="cal-head">
          <span class="cal-label">Kalendar</span>
          <button class="cal-refresh ${calDay.loading ? "spinning" : ""}" title="Osveži">↻</button>
        </div>
        <div class="cal-list"></div>
      `;
      const list = sec.querySelector(".cal-list");
      const refreshBtn = sec.querySelector(".cal-refresh");

      if (!calendarState.configured) {
        list.innerHTML = `<div class="cal-stub">Nije podešeno. Dodaj <code>GOOGLE_CLIENT_ID</code> i <code>GOOGLE_CLIENT_SECRET</code> u <code>.env</code>.</div>`;
        refreshBtn.style.display = "none";
        return sec;
      }
      if (!calendarState.connected) {
        refreshBtn.style.display = "none";
        list.innerHTML = `<div class="cal-stub">Kalendar nije povezan.</div>`;
        if (dayKey === "today") {
          const btn = document.createElement("a");
          btn.className = "cal-connect";
          btn.href = "/auth/google";
          btn.innerHTML = "🔗 Poveži Google kalendar";
          list.appendChild(btn);
        }
        return sec;
      }
      if (calDay.loading) {
        list.innerHTML = `<div class="cal-empty">Učitavanje…</div>`;
      } else if (calDay.events.length === 0) {
        const text = dayKey === "yesterday" ? "Nema događaja." : (dayKey === "today" ? "Nema događaja danas." : "Nema događaja sjutra.");
        list.innerHTML = `<div class="cal-empty">${text}</div>`;
      } else {
        for (const e of calDay.events) {
          const el = document.createElement("div");
          el.className = "cal-event";
          const titleStyle = dayKey === "today" ? ' style="color: var(--ember);"' : '';
          el.innerHTML = `
            <span class="cal-time">${fmtTime(e.start)}</span>
            <div class="cal-title"${titleStyle}>${escapeHtml(e.title)}${e.location ? `<div class="cal-loc">${escapeHtml(e.location)}</div>` : ""}</div>
          `;
          list.appendChild(el);
        }
      }
      refreshBtn.addEventListener("click", () => loadCalendar(dayKey));
      return sec;
    }

    function fmtTime(iso) {
      if (!iso) return "celi dan";
      if (iso.length === 10) return "celi dan"; // YYYY-MM-DD = all-day
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "—";
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    async function loadCalendar(dayKey) {
      if (!calendarState.connected) { render(); return; }
      const keys = dayKey ? [dayKey] : ["yesterday", "today", "tomorrow"];
      keys.forEach(k => { calendarState[k].loading = true; });
      render();
      await Promise.all(keys.map(async (k) => {
        try {
          const res = await api(`/api/calendar?day=${k}`);
          calendarState.configured = res.configured !== false;
          calendarState.connected = res.connected !== false && !res.notConnected;
          calendarState[k].events = res.events || [];
        } catch (err) {
          calendarState[k].events = [];
        } finally {
          calendarState[k].loading = false;
        }
      }));
      render();
    }

    async function toggleDone(task, dayKey, li, check) {
      const next = !task.done;
      task.done = next; // optimistic
      // In-place promjena klase (bez full re-render) da CSS animacije odsviraju.
      if (li) li.classList.toggle("done", next);
      if (check) {
        check.setAttribute("aria-checked", String(next));
        if (next) {
          check.classList.remove("pop");
          void check.offsetWidth; // restart animacije
          check.classList.add("pop");
          check.addEventListener("animationend", () => check.classList.remove("pop"), { once: true });
        }
      }
      try {
        const res = await api(`/api/todos/${task.id}`, { method: "PATCH", body: JSON.stringify({ done: next }) });
        Object.assign(task, res.todo);
      } catch (err) {
        task.done = !next; // rollback
        if (li) li.classList.toggle("done", !next);
        if (check) check.setAttribute("aria-checked", String(!next));
        alert("Greška: " + err.message);
      }
    }



    // Sačuvaj/obriši vrijeme taska (HH:MM ili "" za brisanje). In-place update chipa.
    async function setTaskTime(task, value, chip) {
      const next = value || null;
      const prev = task.time || null;
      if (next === prev) return;
      task.time = next; // optimistic
      const txt = chip.querySelector(".tt-text");
      if (txt) txt.textContent = next || "";
      chip.classList.toggle("set", !!next);
      try {
        const res = await api(`/api/todos/${task.id}`, {
          method: "PATCH",
          body: JSON.stringify({ time: next }),
        });
        Object.assign(task, res.todo);
        // Server može normalizovati (npr. odbiti nevalidno) → sinhronizuj prikaz.
        if (txt) txt.textContent = task.time || "";
        chip.classList.toggle("set", !!task.time);
        const inp = chip.querySelector("input");
        if (inp) inp.value = task.time || "";
      } catch (err) {
        task.time = prev; // rollback
        if (txt) txt.textContent = prev || "";
        chip.classList.toggle("set", !!prev);
        alert("Greška: " + err.message);
      }
    }

    // Tap-to-cycle prioritet: normal → high → low → normal. In-place update bedža.
    // (legacy "medium" se prvim tapom uklopi u krug → high.)
    async function cyclePriority(task, badge) {
      const order = { normal: "high", high: "low", low: "normal", medium: "high" };
      const next = order[task.priority] || "high";
      const prev = task.priority;
      task.priority = next; // optimistic
      badge.className = `prio ${next}`;
      badge.textContent = next;
      try {
        const res = await api(`/api/todos/${task.id}`, {
          method: "PATCH",
          body: JSON.stringify({ priority: next }),
        });
        Object.assign(task, res.todo);
        badge.className = `prio ${task.priority}`;
        badge.textContent = task.priority;
      } catch (err) {
        task.priority = prev; // rollback
        badge.className = `prio ${prev}`;
        badge.textContent = prev;
        alert("Greška: " + err.message);
      }
    }

    async function removeTask(task, dayKey, el) {
      el.classList.add("removing");
      try {
        await api(`/api/todos/${task.id}`, { method: "DELETE" });
        state[dayKey] = state[dayKey].filter((t) => t.id !== task.id);
        setTimeout(render, 180);
      } catch (err) {
        el.classList.remove("removing");
        alert("Greška: " + err.message);
      }
    }

    function editTaskTitle(task, titleEl) {
      if (titleEl.isContentEditable) return;

      const editIcon = titleEl.querySelector(".edit-icon");
      if (editIcon) editIcon.style.display = "none";

      titleEl.contentEditable = "true";
      titleEl.focus();
      
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(titleEl);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
      
      const prevTitle = task.title;

      const finishEdit = async () => {
        titleEl.contentEditable = "false";
        titleEl.removeEventListener("blur", finishEdit);
        titleEl.removeEventListener("keydown", onKeyDown);
        
        const newTitle = titleEl.textContent.replace("✎", "").trim() || prevTitle;
        titleEl.innerHTML = `${escapeHtml(newTitle)} <span class="edit-icon" title="Izmijeni naslov">✎</span>`;
        
        if (newTitle === prevTitle) return;
        
        task.title = newTitle;
        try {
          const res = await api(`/api/todos/${task.id}`, { method: "PATCH", body: JSON.stringify({ title: newTitle }) });
          Object.assign(task, res.todo);
          titleEl.innerHTML = `${escapeHtml(task.title)} <span class="edit-icon" title="Izmijeni naslov">✎</span>`;
        } catch (err) {
          task.title = prevTitle;
          titleEl.innerHTML = `${escapeHtml(prevTitle)} <span class="edit-icon" title="Izmijeni naslov">✎</span>`;
          alert("Greška: " + err.message);
        }
      };

      const onKeyDown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          titleEl.blur();
        } else if (e.key === "Escape") {
          e.preventDefault();
          titleEl.innerHTML = `${escapeHtml(prevTitle)} <span class="edit-icon" title="Izmijeni naslov">✎</span>`;
          titleEl.blur();
        }
      };
      
      titleEl.addEventListener("blur", finishEdit);
      titleEl.addEventListener("keydown", onKeyDown);
    }

    async function loadAll() {
      const [todosRes, statusRes] = await Promise.all([
        api("/api/todos"),
        api("/api/status").catch(() => null),
      ]);
      state = todosRes.todos;
      if (statusRes) {
        calendarState.configured = !!statusRes.calendarConfigured;
        calendarState.connected = !!statusRes.calendarConnected;
        renderAuthStatus(statusRes);
      }
      render();
      if (calendarState.connected) loadCalendar();
    }

    function renderAuthStatus(status) {
      // Footer više ne prikazuje auth status — ostavljeno bez-op (API i dalje radi).
      void status;
    }

    // ── Sistemski resursi servera (CPU/RAM/Disk) u futeru ──
    function fmtGB(bytes) { return (bytes / 1073741824).toFixed(1); }
    async function loadSystem() {
      const el = document.getElementById("sysStats");
      if (!el) return;
      try {
        const res = await api("/api/system");
        const cpu = res.cpu ? `${res.cpu.percent}%` : "—";
        const ram = res.mem ? `${res.mem.percent}%` : "—";
        const disk = res.disk ? `${res.disk.percent}%` : "—";
        el.innerHTML = `CPU: <b>${cpu}</b> · RAM: <b>${ram}</b> · Disk: <b>${disk}</b>`;
        // Detalji (GB) u tooltip-u.
        const parts = [];
        if (res.cpu) parts.push(`CPU ${res.cpu.cores} jezgara`);
        if (res.mem) parts.push(`RAM ${fmtGB(res.mem.used)}/${fmtGB(res.mem.total)} GB`);
        if (res.disk) parts.push(`Disk ${fmtGB(res.disk.used)}/${fmtGB(res.disk.total)} GB`);
        el.title = parts.join(" · ") || "Resursi servera";
      } catch (err) {
        el.innerHTML = `<span style="font-style:italic">sistem nedostupan</span>`;
      }
    }

    // ── Theme switcher (keryx tamna ↔ svijetla) u footeru, pamti se u localStorage ──
    function applyTheme(theme) {
      if (window.applyNoemaTheme) return window.applyNoemaTheme(theme);
      const dark = theme === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.querySelectorAll(".theme-icon, #ftIcon, #topThemeIcon").forEach(el => { el.textContent = dark ? "☀" : "☾"; });
    }
    function initTheme() {
      const saved = localStorage.getItem("noema-theme") || "dark";
      applyTheme(saved);
      const toggle = (e) => {
        if (window.toggleNoemaTheme) return window.toggleNoemaTheme(e);
        if (e && e.preventDefault) { e.preventDefault(); e.stopPropagation(); }
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem("noema-theme", next);
        applyTheme(next);
      };
      const btn = document.getElementById("footerTheme");
      if (btn && !btn._themeBound) { btn.addEventListener("click", toggle); btn._themeBound = true; }
      const fab = document.getElementById("topTheme");
      if (fab && !fab._themeBound) { fab.addEventListener("click", toggle); fab._themeBound = true; }
    }

    // ── Font Scale ──
    let fontScale = Number(localStorage.getItem("noema-font-scale")) || 1;
    function applyFontScale(scale) {
      document.documentElement.style.fontSize = (16 * scale) + "px";
      document.body.style.fontSize = (16 * scale) + "px";
    }
    function initFontScale() {
      applyFontScale(fontScale);
      const decBtn = document.getElementById("fontDec");
      const incBtn = document.getElementById("fontInc");
      const resBtn = document.getElementById("fontReset");
      if (decBtn) decBtn.addEventListener("click", () => {
        fontScale = Math.max(0.4, fontScale - 0.3);
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
      if (incBtn) incBtn.addEventListener("click", () => {
        fontScale = Math.min(2.5, fontScale + 0.3);
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
      if (resBtn) resBtn.addEventListener("click", () => {
        fontScale = 1;
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
    }

    // ── Drag & drop: premjesti task između kolona (pointer events → radi i na dodir) ──
    let dragHL = null; // trenutno istaknuta drop-kolona
    function columnUnder(x, y) {
      const el = document.elementFromPoint(x, y);
      return el ? el.closest(".column") : null;
    }
    function highlightColumn(col) {
      const next = col && col.dataset.day ? col : null;
      if (dragHL === next) return;
      if (dragHL) dragHL.classList.remove("drop-target");
      dragHL = next;
      if (dragHL) dragHL.classList.add("drop-target");
    }
    function attachDrag(li, task, fromDay) {
      li.addEventListener("pointerdown", (e) => {
        if (e.button != null && e.button > 0) return; // samo primarno dugme
        if (e.target.closest(".task-check") || e.target.closest(".task-delete") || e.target.closest(".task-time") || e.target.closest(".prio") || e.target.closest(".repeat-select") || e.target.closest(".repeat-add") || e.target.isContentEditable) return;
        const touch = e.pointerType === "touch";
        const sx = e.clientX, sy = e.clientY;
        let started = false, ghost = null, ox = 0, oy = 0, lpTimer = null;
        let lastX = sx, lastY = sy, scrollRAF = null;

        const begin = () => {
          started = true;
          const r = li.getBoundingClientRect();
          ox = sx - r.left; oy = sy - r.top;
          ghost = li.cloneNode(true);
          ghost.classList.add("task-ghost");
          ghost.style.width = r.width + "px";
          ghost.style.left = r.left + "px";
          ghost.style.top = r.top + "px";
          document.body.appendChild(ghost);
          li.classList.add("task-dragging");
          document.body.classList.add("dragging-active");
          document.documentElement.style.touchAction = "none";
          scrollRAF = requestAnimationFrame(edgeScroll);
        };
        // Auto-scroll kad je prst blizu vrha/dna — da dohvatiš kolonu van ekrana.
        const edgeScroll = () => {
          const margin = 90, max = 16, vh = window.innerHeight;
          let dy = 0;
          if (lastY < margin) dy = -max * (1 - lastY / margin);
          else if (lastY > vh - margin) dy = max * (1 - (vh - lastY) / margin);
          if (dy) {
            window.scrollBy(0, dy);
            highlightColumn(columnUnder(lastX, lastY)); // kolona se mijenja dok skrolujemo
          }
          scrollRAF = requestAnimationFrame(edgeScroll);
        };
        const onMove = (ev) => {
          const dist = Math.hypot(ev.clientX - sx, ev.clientY - sy);
          if (!started) {
            if (touch) { if (dist > 12) cleanup(); return; } // pokret prije long-press = skrol
            if (dist > 6) begin(); else return;
          }
          ev.preventDefault();
          lastX = ev.clientX; lastY = ev.clientY;
          ghost.style.left = (lastX - ox) + "px";
          ghost.style.top = (lastY - oy) + "px";
          highlightColumn(columnUnder(lastX, lastY));
        };
        const onUp = () => {
          if (started) {
            ghost.style.display = "none"; // Sakrij duha da elementFromPoint ispod njega prođe
            const elUnder = document.elementFromPoint(lastX, lastY);
            ghost.style.display = "";
            const col = elUnder ? elUnder.closest(".column") : columnUnder(lastX, lastY);
            const toDay = col && col.dataset.day;
            const targetEl = elUnder ? elUnder.closest(".task:not(.task-dragging)") : null;
            const targetId = targetEl ? targetEl.dataset.id : null;
            
            if (toDay && (toDay !== fromDay || targetId)) {
              moveTaskToDay(task, fromDay, toDay, targetId);
            }
          }
          cleanup();
        };
        const cleanup = () => {
          if (lpTimer) clearTimeout(lpTimer);
          if (scrollRAF) cancelAnimationFrame(scrollRAF);
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          window.removeEventListener("pointercancel", onUp);
          if (ghost) ghost.remove();
          li.classList.remove("task-dragging");
          document.body.classList.remove("dragging-active");
          document.documentElement.style.touchAction = "";
          highlightColumn(null);
        };

        if (touch) lpTimer = setTimeout(begin, 200); // dugi pritisak pokreće drag
        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });
    }
    async function moveTaskToDay(task, fromDay, toDay, targetId) {
      const prevOrder = task.order || task.createdAt;
      const prevDay = fromDay;

      let targetTask = null;
      let targetPrevOrder = null;

      if (targetId) {
        targetTask = state[toDay]?.find(t => t.id === targetId);
        if (targetTask) {
          targetPrevOrder = targetTask.order || targetTask.createdAt;
          // Swap orders
          task.order = targetPrevOrder;
          targetTask.order = prevOrder;
        }
      } else if (fromDay !== toDay) {
        // Ako se samo premješta u drugu kolonu na vrh
        task.order = Date.now();
      }

      // Optimistično: prebaci u state pa potvrdi na serveru.
      state[fromDay] = (state[fromDay] || []).filter((t) => t.id !== task.id);
      task.day = toDay;
      (state[toDay] = state[toDay] || []).unshift(task);
      render();
      
      try {
        const promises = [
          api(`/api/todos/${task.id}`, { method: "PATCH", body: JSON.stringify({ day: toDay, order: task.order }) })
        ];
        if (targetTask) {
          promises.push(api(`/api/todos/${targetTask.id}`, { method: "PATCH", body: JSON.stringify({ order: targetTask.order }) }));
        }
        await Promise.all(promises);
      } catch (err) {
        state[toDay] = state[toDay].filter((t) => t.id !== task.id); // rollback
        task.day = prevDay;
        task.order = prevOrder;
        if (targetTask) targetTask.order = targetPrevOrder;
        (state[fromDay] = state[fromDay] || []).unshift(task);
        render();
        alert("Greška: " + err.message);
      }
    }

    // ── Push-meni (port "Salient reveal" iz the original portfolio) ──
    function initMenu() {
      const burger = document.getElementById("mobileBurger");
      const overlay = document.getElementById("mobileMenu");
      const closeBtn = document.getElementById("closeMobile");
      if (!burger || !overlay) return;

      // Umotaj cijelu stranicu u #shell (karticu); meni izvuci IZA kartice.
      const shell = document.createElement("div");
      shell.id = "shell";
      const inner = document.createElement("div");
      inner.id = "shell-inner";
      while (document.body.firstChild) inner.appendChild(document.body.firstChild);
      shell.appendChild(inner);
      const scrim = document.createElement("div");
      scrim.className = "shell-scrim";
      scrim.setAttribute("aria-hidden", "true");
      shell.appendChild(scrim);
      document.body.appendChild(shell);
      document.body.appendChild(overlay); // meni iza kartice (niži z-index)
      document.body.appendChild(document.getElementById("tpBackdrop"));
      document.body.appendChild(document.getElementById("tpModal"));

      let sy = 0, unfixTimer = null;
      const setExpanded = (o) => burger.setAttribute("aria-expanded", o ? "true" : "false");

      function open() {
        if (unfixTimer) { clearTimeout(unfixTimer); unfixTimer = null; }
        if (!document.body.classList.contains("menu-fixed")) {
          sy = window.scrollY || window.pageYOffset || 0;
          inner.style.transform = "translateY(" + (-sy) + "px)";
          document.body.classList.add("menu-fixed");
          void shell.offsetWidth; // reflow da se .8s transform animira iz mira
        }
        requestAnimationFrame(() => {
          document.body.classList.add("menu-pushed");
          overlay.classList.add("is-open");
        });
        setExpanded(true);
      }
      function close() {
        overlay.classList.remove("is-open");
        document.body.classList.remove("menu-pushed");
        setExpanded(false);
        if (unfixTimer) clearTimeout(unfixTimer);
        unfixTimer = setTimeout(() => {
          document.body.classList.remove("menu-fixed");
          inner.style.transform = "";
          window.scrollTo(0, sy);
          unfixTimer = null;
        }, 850);
      }

      burger.addEventListener("click", open);
      closeBtn.addEventListener("click", close);
      scrim.addEventListener("click", close);
      overlay.querySelectorAll("a").forEach((l) => {
        l.addEventListener("click", (e) => {
          const href = l.getAttribute("href");
          const target = l.getAttribute("target");
          if (!href || href === "#" || target === "_blank") {
            close();
            return;
          }
          e.preventDefault();
          close();
          setTimeout(() => {
            window.location.href = href;
          }, 850);
        });
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.body.classList.contains("menu-pushed")) close();
      });
    }

    function handleCalendarRedirect() {
      const params = new URLSearchParams(location.search);
      const cal = params.get("calendar");
      if (!cal) return;
      const msg = {
        connected: "✓ Google kalendar je povezan.",
        error: "Povezivanje kalendara nije uspelo. Pokušaj ponovo.",
        denied: "Pristup kalendaru je odbijen.",
      }[cal];
      if (msg) setTimeout(() => alert(msg), 100);
      // Očisti query param iz URL-a.
      history.replaceState(null, "", location.pathname);
    }

    /* ═══════════ DRUM TIME PICKER LOGIC ═══════════ */
    let activeTaskForTime = null;
    let activeTimeDiv = null;
    const tpBackdrop = document.getElementById("tpBackdrop");
    const tpModal = document.getElementById("tpModal");
    const CELL_H = 42; // px – must match CSS .tp-cell height
    const VISIBLE_CELLS = 5; // cells visible in scroll window (210 / 42)
    const CENTER_IDX = Math.floor(VISIBLE_CELLS / 2); // index 2 = middle

    // Build a drum: creates cells 0..max, stores state on the wrapper
    function buildDrum(scrollEl, max) {
      scrollEl.innerHTML = '';
      for (let i = 0; i <= max; i++) {
        const cell = document.createElement('div');
        cell.className = 'tp-cell';
        cell.dataset.value = i;
        cell.textContent = String(i).padStart(2, '0');
        scrollEl.appendChild(cell);
      }
      scrollEl._max = max;
      scrollEl._value = 0;
    }

    function setDrumValue(scrollEl, val, animate) {
      const max = scrollEl._max;
      val = ((val % (max + 1)) + (max + 1)) % (max + 1); // wrap
      scrollEl._value = val;
      const offset = -(val * CELL_H) + (CENTER_IDX * CELL_H);
      scrollEl.style.transition = animate ? 'transform 0.25s cubic-bezier(0.22,0.68,0,1)' : 'none';
      scrollEl.style.transform = `translateY(${offset}px)`;
      // Update cell classes for styling
      const cells = scrollEl.children;
      for (let i = 0; i < cells.length; i++) {
        const dist = Math.abs(i - val);
        cells[i].classList.remove('sel', 'near1', 'near2');
        if (dist === 0) cells[i].classList.add('sel');
        else if (dist === 1) cells[i].classList.add('near2');
        else if (dist === 2) cells[i].classList.add('near1');
      }
    }

    const scrollH = document.getElementById('tpScrollH');
    const scrollM = document.getElementById('tpScrollM');
    const editH = document.getElementById('tpEditH');
    const editM = document.getElementById('tpEditM');
    buildDrum(scrollH, 23);
    buildDrum(scrollM, 59);

    // Arrow buttons
    document.querySelectorAll('.tp-arrow').forEach(btn => {
      btn.addEventListener('click', () => {
        const isHour = btn.dataset.drum === 'h';
        const scr = isHour ? scrollH : scrollM;
        const dir = btn.classList.contains('tp-up') ? -1 : 1;
        setDrumValue(scr, scr._value + dir, true);
      });
    });

    // Click on a cell to jump to it
    [scrollH, scrollM].forEach(scr => {
      scr.addEventListener('click', (e) => {
        const cell = e.target.closest('.tp-cell');
        if (!cell) return;
        const v = parseInt(cell.dataset.value);
        if (cell.classList.contains('sel')) {
          // Click on selected = open edit input
          const ed = scr === scrollH ? editH : editM;
          ed.value = String(v).padStart(2, '0');
          ed.style.display = 'block';
          ed.focus();
          ed.select();
        } else {
          setDrumValue(scr, v, true);
        }
      });
    });

    // Touch/scroll drag on drums
    [scrollH, scrollM].forEach(scr => {
      const wrap = scr.parentElement;
      let startY = 0, startVal = 0, dragging = false;
      wrap.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.tp-edit') || e.target.closest('.tp-arrow')) return;
        e.preventDefault();
        dragging = true; startY = e.clientY; startVal = scr._value;
        if (wrap.setPointerCapture) wrap.setPointerCapture(e.pointerId);
      });
      wrap.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        e.preventDefault();
        const dy = startY - e.clientY;
        const steps = Math.round(dy / (CELL_H * 0.6));
        if (steps !== 0) {
          setDrumValue(scr, startVal + steps, false);
        }
      });
      wrap.addEventListener('pointerup', (e) => {
        dragging = false;
        if (wrap.hasPointerCapture && wrap.hasPointerCapture(e.pointerId)) {
          wrap.releasePointerCapture(e.pointerId);
        }
      });
      wrap.addEventListener('pointercancel', () => { dragging = false; });
      // Mouse wheel
      wrap.addEventListener('wheel', (e) => {
        e.preventDefault();
        const dir = e.deltaY > 0 ? 1 : -1;
        setDrumValue(scr, scr._value + dir, true);
      }, { passive: false });
    });

    // Edit input commit
    function commitEdit(ed, scr) {
      const v = parseInt(ed.value) || 0;
      const clamped = Math.max(0, Math.min(scr._max, v));
      setDrumValue(scr, clamped, true);
      ed.style.display = 'none';
    }
    [editH, editM].forEach((ed, i) => {
      const scr = i === 0 ? scrollH : scrollM;
      ed.addEventListener('blur', () => commitEdit(ed, scr));
      ed.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commitEdit(ed, scr); }
        if (e.key === 'Escape') { ed.style.display = 'none'; }
      });
    });

    function openCustomTimePicker(task, timeDiv) {
      activeTaskForTime = task;
      activeTimeDiv = timeDiv;
      let h, m;
      if (task.time) {
        [h, m] = task.time.split(':').map(Number);
      } else {
        const now = new Date();
        h = now.getHours();
        m = now.getMinutes();
      }
      setDrumValue(scrollH, h, false);
      setDrumValue(scrollM, m, false);
      editH.style.display = 'none';
      editM.style.display = 'none';
      tpBackdrop.classList.add('open');
      tpModal.classList.add('open');
    }

    function closeCustomTimePicker() {
      tpBackdrop.classList.remove('open');
      tpModal.classList.remove('open');
      activeTaskForTime = null;
      activeTimeDiv = null;
    }

    tpBackdrop.addEventListener('click', closeCustomTimePicker);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && tpModal.classList.contains('open')) {
        closeCustomTimePicker();
      }
    });
    document.getElementById('tpClear').addEventListener('click', () => {
      if (activeTaskForTime) setTaskTime(activeTaskForTime, '', activeTimeDiv);
      closeCustomTimePicker();
    });
    document.getElementById('tpSave').addEventListener('click', () => {
      if (activeTaskForTime) {
        const hh = String(scrollH._value).padStart(2, '0');
        const mm = String(scrollM._value).padStart(2, '0');
        setTaskTime(activeTaskForTime, `${hh}:${mm}`, activeTimeDiv);
      }
      closeCustomTimePicker();
    });

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      initFontScale();
      initMenu();
      handleCalendarRedirect();
      loadAll().catch((err) => {
        console.error(err);
        alert("Ne mogu da učitam taskove: " + err.message);
      });
      loadSystem();
      setInterval(loadSystem, 5000); // osvježi resurse svakih 5s
    });
  </script>
