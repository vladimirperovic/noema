<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noema — juče · danas · sjutra</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Noema — minimalna todo lista sa pogledom na juče, danas i sjutra. MCP/OpenAPI gateway u pozadini.">

  <!-- Postavi temu prije paint-a da ne bljesne svijetla (FOUC zaštita). -->
  <script>
    (function () {
      try {
        var manual = localStorage.getItem("noema-theme-manual");
        var hour = new Date().getHours();
        var autoTheme = (hour >= 19 || hour < 7) ? "dark" : "light";
        var t = (manual === "dark" || manual === "light") ? manual : autoTheme;
        document.documentElement.setAttribute("data-theme", t);
        var w = localStorage.getItem("noema-page-width");
        if (w === "wide") document.documentElement.setAttribute("data-width", "wide");
      } catch (e) {}
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").then(function (reg) {
            reg.update();
          }).catch(function () {});
        });
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* NOEMA — light "herald" tema: topli papir, amber beacon, editorial serif. */
    :root {
      --paper:      #f7f3ec;
      --paper-2:    #fbf8f2;
      --paper-3:    #ffffff;
      --ink-line:   rgba(26, 26, 31, 0.10);
      --ink-line-2: rgba(26, 26, 31, 0.18);
      --ink:        #1a1a1f;
      --ink-2:      #3d3d44;
      --ink-3:      #6b6b73;
      --ink-4:      #9b958a;
      --beacon:     #b87333;
      --beacon-2:   #9c6029;
      --beacon-glow:rgba(184, 115, 51, 0.16);
      --beacon-soft:rgba(184, 115, 51, 0.08);
      --signal:     #4a7a5e;
      --ember:      #c0563b;
      --azure:      #3a6ea5;
      --azure-soft: rgba(58, 110, 165, 0.05);
      --font-display: 'Fraunces', Georgia, serif;
      --font-sans:    'Geist', -apple-system, system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', 'IBM Plex Mono', monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ocm-ease: cubic-bezier(.15, .2, .1, 1);
      --maxw: 1400px;
      --gut: clamp(1.25rem, 4vw, 2.5rem);
      --yesterday: #8a7a6b;
      --today: var(--beacon);
      --tomorrow: #5a7a8a;
      
      /* Drum Time Picker - Light Theme variables */
      --tp-bg: #ffffff;
      --tp-border: var(--ink-line-2);
      --tp-text-dim: rgba(26, 26, 31, 0.28);
      --tp-text-near1: rgba(26, 26, 31, 0.50);
      --tp-text-near2: rgba(26, 26, 31, 0.70);
      --tp-text-sel: var(--ink);
      --tp-highlight-bg: rgba(26, 26, 31, 0.06);
      --tp-btn-bg: rgba(26, 26, 31, 0.04);
      --tp-btn-border: var(--ink-line);
      --tp-btn-text: var(--ink-2);
    }

    /* DARK — keryx "obsidian" tema (isti font/brand, tamne površine). */
    html[data-theme="dark"] {
      --paper:      #0a0a0c;
      --paper-2:    #0f0f12;
      --paper-3:    #16161b;
      --ink-line:   rgba(244, 239, 230, 0.08);
      --ink-line-2: rgba(244, 239, 230, 0.14);
      --ink:        #f4efe6;
      --ink-2:      #d8d2c4;
      --ink-3:      #9b958a;
      --ink-4:      #5c574f;
      --beacon:     #e8b07d;
      --beacon-2:   #d4a574;
      --beacon-glow:rgba(232, 176, 125, 0.22);
      --beacon-soft:rgba(232, 176, 125, 0.10);
      --signal:     #8ab4a1;
      --ember:      #d97757;
      --azure:      #7fa7d9;
      --azure-soft: rgba(127, 167, 217, 0.08);
      --yesterday:  #b0a392;
      --tomorrow:   var(--azure);
      
      /* Drum Time Picker - Dark Theme variables */
      --tp-bg: #1e1e22;
      --tp-border: rgba(255, 255, 255, 0.08);
      --tp-text-dim: rgba(255, 255, 255, 0.22);
      --tp-text-near1: rgba(255, 255, 255, 0.40);
      --tp-text-near2: rgba(255, 255, 255, 0.55);
      --tp-text-sel: rgba(255, 255, 255, 0.92);
      --tp-highlight-bg: rgba(255, 255, 255, 0.08);
      --tp-btn-bg: rgba(255, 255, 255, 0.05);
      --tp-btn-border: rgba(255, 255, 255, 0.1);
      --tp-btn-text: rgba(255, 255, 255, 0.6);
    }
    :root { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; } /* nativni time picker u tamnoj temi */
    html { background: var(--paper); }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink-2);
      background: var(--paper);
      min-height: 100vh;
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
      opacity: 0;
      animation: pageFadeIn 0.6s var(--ocm-ease) forwards;
    }
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::selection { background: var(--beacon); color: var(--paper); }

    /* HAMBURGER — plutajući taster gore desno (otvara push-meni). */
    .burger {
      position: fixed; top: 1rem; right: 1rem; z-index: 1001;
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px;
      width: 46px; height: 46px; padding: 11px 9px;
      background: var(--paper-3); border: 1px solid var(--ink-line-2); border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 18px -8px rgba(0,0,0,0.30);
      transition: border-color 0.2s var(--ease), background 0.3s var(--ease);
    }
    .burger:hover { border-color: var(--beacon); }
    .burger span { display: block; width: 24px; height: 2px; background: var(--ink); border-radius: 2px; transition: all 0.3s var(--ocm-ease); }
    .burger span:last-child { width: 16px; }

    /* Theme FAB — isti izgled kao burger (samostalan, ne dijeli .burger span pravila), ispod njega. */
    .theme-fab {
      position: fixed; top: calc(1rem + 46px + 10px); right: 1rem; z-index: 1001;
      display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; padding: 0;
      background: var(--paper-3); border: 1px solid var(--ink-line-2); border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 18px -8px rgba(0,0,0,0.30);
      font-family: var(--font-mono); font-size: 1.15rem; line-height: 1; color: var(--ink-4);
      transition: border-color 0.2s var(--ease), background 0.3s var(--ease), color 0.2s var(--ease);
    }
    .theme-fab:hover { border-color: var(--beacon); color: var(--beacon); }

    /* PUSH MENU — page card se gurne lijevo + 3D rotira, otkriva tamni meni
       (port iz the original portfolio "Salient reveal"). */
    #shell {
      position: relative; z-index: 2; min-height: 100vh; background: var(--paper);
      transform-origin: center center;
      transition: transform .8s var(--ocm-ease), border-radius .8s var(--ocm-ease), box-shadow .8s var(--ocm-ease);
    }
    body.menu-fixed { overflow: hidden; }
    body.menu-fixed #shell {
      position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100dvh;
      overflow: hidden; border-radius: 18px;
    }
    body.menu-pushed #shell {
      transform: perspective(1400px) translateX(-50vw) rotateY(11deg) scale(.84);
      box-shadow: 0 0 90px rgba(0,0,0,.55), 0 30px 60px rgba(0,0,0,.4);
      will-change: transform;
    }
    .shell-scrim {
      position: absolute; inset: 0; background: rgba(14,14,16,.30);
      opacity: 0; visibility: hidden;
      transition: opacity .8s var(--ocm-ease), visibility .8s var(--ocm-ease);
      z-index: 50000; cursor: pointer;
    }
    body.menu-pushed .shell-scrim { opacity: 1; visibility: visible; }

    .menu-overlay {
      box-sizing: border-box; position: fixed; inset: 0; z-index: 1;
      background: #0e0e10; color: #f5f1ea;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
      text-align: right; padding: clamp(70px,11vh,110px) clamp(24px,7vw,48px);
    }
    .menu-close {
      position: absolute; top: 30px; right: 26px; background: none; border: none;
      color: #f5f1ea; cursor: pointer; padding: 10px; opacity: 0;
      transform: translateX(20px) rotate(-90deg);
      transition: opacity .8s var(--ocm-ease) .15s, transform .8s var(--ocm-ease) .15s;
    }
    .menu-overlay.is-open .menu-close { opacity: .6; transform: translateX(0) rotate(0); }
    .menu-close:hover { opacity: 1 !important; transform: rotate(90deg); }
    .menu-close svg { width: 28px; height: 28px; stroke-width: 1.5; }

    .menu-eyebrow {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .38em; text-transform: uppercase;
      color: #d7b584; margin-bottom: clamp(16px,3.5vh,26px);
      opacity: 0; transform: translateX(40px);
      transition: opacity .8s var(--ocm-ease), transform .8s var(--ocm-ease);
    }
    .menu-overlay.is-open .menu-eyebrow { opacity: 1; transform: translateX(0); }

    .menu-nav { display: flex; flex-direction: column; align-items: flex-end; gap: clamp(3px,1.1vh,10px); }
    .menu-link {
      font-family: var(--font-display); font-size: clamp(16px,3vw,20px); font-weight: 300; line-height: 1.1;
      color: #f5f1ea; text-decoration: none; opacity: 0; transform: translateX(40px);
      transition: opacity .8s var(--ocm-ease), transform .8s var(--ocm-ease), color .25s;
    }
    .menu-link .ml-tag { color: #6f6a62; font-family: var(--font-mono); font-size: 0.55em; letter-spacing: 0.1em; text-transform: uppercase; margin-left: 0.5em; }
    .menu-link:hover { color: #d7b584; }
    .menu-overlay.is-open .menu-link { opacity: 1; transform: translateX(0); }
    .menu-link:nth-child(1){transition-delay:.10s}
    .menu-link:nth-child(2){transition-delay:.14s}
    .menu-link:nth-child(3){transition-delay:.18s}
    .menu-link:nth-child(4){transition-delay:.22s}
    .menu-link:nth-child(5){transition-delay:.26s}
    .menu-link:nth-child(6){transition-delay:.30s}
    .menu-link:nth-child(7){transition-delay:.34s}
    .menu-link:nth-child(8){transition-delay:.38s}
    .menu-link:nth-child(9){transition-delay:.42s}
    .menu-link:nth-child(10){transition-delay:.46s}
    .menu-archive {
      margin-top: clamp(14px,3.5vh,26px); display: inline-flex; align-items: center; gap: 0.55em;
      align-self: flex-end; font-family: var(--font-display); font-size: clamp(15px,2.5vw,17px);
      font-weight: 300; color: #d7b584; text-decoration: none; padding-bottom: 4px;
      border-bottom: 1px solid rgba(215,181,132,.3);
      opacity: 0; transform: translateX(40px);
      transition: opacity .8s var(--ocm-ease) .46s, transform .8s var(--ocm-ease) .46s, color .25s;
    }
    .menu-archive svg { width: 0.85em; height: 0.85em; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .menu-archive:hover { color: #ecc998; }
    .menu-overlay.is-open .menu-archive { opacity: 1; transform: translateX(0); }
    .menu-notes { margin-top: clamp(8px,1.6vh,12px);
      transition: opacity .8s var(--ocm-ease) .5s, transform .8s var(--ocm-ease) .5s, color .25s; }
    .menu-documents { margin-top: clamp(8px,1.6vh,12px);
      transition: opacity .8s var(--ocm-ease) .54s, transform .8s var(--ocm-ease) .54s, color .25s; }
    .menu-links-item { margin-top: clamp(8px,1.6vh,12px);
      transition: opacity .8s var(--ocm-ease) .55s, transform .8s var(--ocm-ease) .55s, color .25s; }
    .menu-foot {
      margin-top: clamp(20px,5vh,38px); font-family: var(--font-mono);
      letter-spacing: .22em; text-transform: uppercase; color: #6f6a62;
      opacity: 0; transform: translateX(40px);
      transition: opacity .8s var(--ocm-ease) .58s, transform .8s var(--ocm-ease) .58s;
    }
    .menu-overlay.is-open .menu-foot { opacity: 1; transform: translateX(0); }
    .menu-foot-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .menu-foot-tagline { font-size: 9px; opacity: .7; }

    /* Footer theme switch — samo ikona (diskretno, rijetko se koristi). */
    .footer-theme {
      background: none; border: 1px solid var(--ink-line); cursor: pointer; color: var(--ink-4);
      font-family: var(--font-mono); font-size: 1rem; line-height: 1;
      display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 8px;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease);
    }
    .footer-theme:hover { color: var(--beacon); border-color: var(--beacon); background: var(--beacon-soft); }

    /* BOARD */
    .board { padding: clamp(1.75rem, 4vw, 2.75rem) var(--gut) clamp(3rem, 6vw, 5rem); }
    .board-inner {
      max-width: var(--maxw); margin: 0 auto;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem;
    }
    @media (max-width: 980px) { .board-inner { grid-template-columns: 1fr; } }

    .column {
      display: flex; flex-direction: column;
      background: var(--paper-2); border: 1px solid var(--ink-line);
      border-radius: 18px; overflow: hidden; min-width: 0;
    }
    .column.is-today { border-color: var(--ink-line-2); box-shadow: 0 8px 32px -16px var(--beacon-glow); }
    .column.is-today::before {
      content: ''; display: block; height: 3px;
      background: linear-gradient(90deg, var(--beacon-2), var(--beacon), var(--beacon-2));
    }
    .column-head { padding: 1.2rem 1.5rem 0.85rem; border-bottom: 1px solid var(--ink-line); }
    .day-title {
      font-family: var(--font-display); font-weight: 500; font-size: 1.5rem;
      color: var(--ink); letter-spacing: -0.01em; line-height: 1;
    }
    .column.is-yesterday .day-title { color: var(--yesterday); }
    .column.is-today .day-title { color: var(--today); }
    .column.is-tomorrow .day-title { color: var(--tomorrow); }
    .day-date { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-3); margin-top: 0.35rem; }
    .column.is-today .day-date { font-size: 1.14rem; color: var(--beacon-2); letter-spacing: -0.01em; }
    .day-count {
      margin-top: 0.6rem; display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-3);
      background: rgba(26,26,31,0.04); padding: 0.25rem 0.6rem; border-radius: 100px;
    }
    .day-count .num { color: var(--ink); font-weight: 600; }
    /* "Otvori/Sakrij" dugme za Juče — skriveno na desktopu, vidljivo na mobilnom. */
    .day-toggle {
      display: none; margin-top: 0.85rem; width: 100%;
      align-items: center; justify-content: center; gap: 0.45rem;
      padding: 0.6rem 0.8rem; cursor: pointer;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--ink-3); background: var(--paper-3);
      border: 1px solid var(--ink-line-2); border-radius: 9px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .day-toggle:hover { color: var(--beacon-2); border-color: var(--beacon); background: var(--beacon-soft); }
    .day-toggle .chev { font-size: 1rem; line-height: 1; transition: transform 0.25s var(--ease); }
    .column:not(.collapsed) .day-toggle .chev { transform: rotate(90deg); } /* otvoreno → strelica nadole */
    @media (max-width: 980px) {
      .board { padding: 0.6rem 0.85rem 3.5rem; }
      .board-inner { grid-template-columns: 1fr; gap: 0.75rem; }
      .column { border-radius: 14px; }
      .column-head { padding: 0.55rem 0.65rem 0.35rem; }
      .day-title { font-size: 1.3rem; }
      .day-date { margin-top: 0.1rem; font-size: 0.76rem; }
      .column.is-today .day-date { font-size: 0.9rem; }
      .day-count { margin-top: 0.2rem; padding: 0.12rem 0.45rem; font-size: 0.65rem; }
      .column.is-yesterday .day-toggle { display: inline-flex; margin-top: 0.35rem; padding: 0.35rem 0.55rem; }
      /* Glatko otvaranje/skupljanje: visina se animira preko JS-izmjerene max-height. */
      .column.is-yesterday .col-body {
        overflow: hidden; min-height: 0;
        transition: max-height 0.4s var(--ease), opacity 0.32s var(--ease);
      }
      .column.is-yesterday.collapsed .col-body { max-height: 0; opacity: 0; }

      .cal-section { padding: 0.25rem 0.65rem; }
      .cal-head { margin-bottom: 0.1rem; }
      .cal-event { padding: 0.1rem 0; font-size: 0.8rem; }
      .cal-empty { padding: 0; font-size: 0.72rem; opacity: 0.7; }
      .cal-section:has(.cal-empty) { padding: 0.15rem 0.65rem; }
      .cal-section:has(.cal-empty) .cal-empty { font-size: 0.7rem; }

      .task-list { padding: 0.3rem 0.3rem 0.45rem; gap: 0.25rem; }
      .task { padding: 0.35rem 0.5rem !important; gap: 0.15rem; border-radius: 8px; margin-left: 0 !important; border-left: 1px solid var(--ink-line) !important; }
      .task-timeline-marker, .task-timeline-label { display: none !important; }
      .task-top { gap: 0.4rem; align-items: flex-start; }
      .task-check { width: 17px !important; height: 17px !important; border-radius: 4px !important; margin-top: 2px !important; flex-shrink: 0 !important; }
      .task-check svg { width: 9px !important; height: 9px !important; }
      .task-title { font-size: 0.96rem !important; line-height: 1.25 !important; }
      .task-delete { width: 20px !important; height: 20px !important; font-size: 0.85rem !important; border-radius: 4px !important; opacity: 0.7 !important; }
      .task-bottom { padding-left: 0; margin-top: 0.15rem; gap: 0.2rem; }
      .task-chips { gap: 0.2rem; flex-wrap: wrap; align-items: center; }
      .prio { height: 21px !important; padding: 0 0.35rem !important; font-size: 0.62rem !important; border-radius: 4px !important; }
      .prio.move-tomorrow { padding: 0 0.7rem !important; min-width: 30px !important; }
      .task-time { height: 21px !important; font-size: 0.68rem !important; border-radius: 4px !important; }
      .task-time:not(.set) { width: 21px !important; }
      .repeat-select { height: 21px !important; padding: 0 0.25rem !important; font-size: 0.6rem !important; border-radius: 4px !important; }
      .repeat-add { width: 21px !important; height: 21px !important; }
      .repeat-add svg { width: 12px !important; height: 12px !important; }
      .subtask-list { margin-top: 0.15rem !important; margin-bottom: 0.15rem !important; gap: 0.15rem !important; }
      .subtask { padding: 2px 5px !important; font-size: 0.78rem !important; gap: 0.3rem !important; border-radius: 4px !important; }
      .subtask .task-check { width: 13px !important; height: 13px !important; margin-top: 0 !important; border-radius: 3px !important; }
      .subtask .task-check svg { width: 7px !important; height: 7px !important; }
      .subtask .task-delete { width: 16px !important; height: 16px !important; font-size: 0.75rem !important; }
      .add-row { padding: 0.4rem 0.55rem; gap: 0.3rem; }
      .add-input { padding: 0.4rem 0.55rem; font-size: 0.88rem; border-radius: 7px; }
      .add-btn { padding: 0 0.65rem; font-size: 0.82rem; border-radius: 7px; }
      .burger { top: 0.75rem; right: 0.75rem; width: 42px; height: 42px; padding: 9px 8px; }
      .theme-fab { top: calc(0.75rem + 42px + 8px); right: 0.75rem; width: 42px; height: 42px; }
    }


    .add-row {
      display: flex; gap: 0.5rem; padding: 0.85rem 1.5rem;
      border-top: 1px solid var(--ink-line); background: var(--paper-3); margin-top: auto;
    }
    .add-input {
      flex: 1; min-width: 0; border: 1px solid var(--ink-line-2); border-radius: 9px;
      padding: 0.6rem 0.8rem; font-family: var(--font-sans); font-size: 0.9rem;
      color: var(--ink); background: var(--paper); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .add-input::placeholder { color: var(--ink-4); }
    .add-input:focus { border-color: var(--beacon); box-shadow: 0 0 0 3px var(--beacon-soft); }
    .add-btn {
      border: 1px solid var(--beacon); background: var(--beacon-soft); color: var(--beacon-2);
      border-radius: 9px; padding: 0 0.95rem; font-family: var(--font-sans); font-weight: 600;
      font-size: 0.85rem; cursor: pointer; white-space: nowrap;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.1s;
    }
    .add-btn:hover { background: var(--beacon); color: var(--paper); }
    .add-btn:active { transform: scale(0.96); }

    .task-list {
      list-style: none; padding: 0.6rem 0.75rem 1rem;
      display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; flex: 1; min-height: 100px;
    }
    .task {
      display: flex; flex-direction: column; gap: 0.5rem; padding: 0.6rem 0.8rem;
      background: var(--paper-3); border: 1px solid var(--ink-line); border-radius: 11px;
      transition: border-color 0.2s var(--ease), opacity 0.3s var(--ease), transform 0.2s var(--ease);
      animation: taskIn 0.3s var(--ease);
      touch-action: pan-y; cursor: grab; min-width: 0;
    }
    .task-top {
      display: flex; align-items: flex-start; gap: 0.7rem; width: 100%;
    }
    @keyframes taskIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .task:hover { border-color: var(--ink-line-2); }
    .task.done { opacity: 0.55; }
    .task.done .task-title { color: var(--ink-3); }
    .task.removing { opacity: 0; transform: translateX(20px); }

    /* DRAG & DROP (pointer-based, radi i na dodir) */
    .task.task-dragging { opacity: 0.32; }
    .task-ghost {
      position: fixed; z-index: 9000; margin: 0; list-style: none; pointer-events: none;
      background: var(--paper-3); border: 1px solid var(--beacon); border-radius: 11px;
      box-shadow: 0 18px 42px -12px rgba(0,0,0,0.55); transform: scale(1.03);
    }
    .column.drop-target { border-color: var(--beacon); box-shadow: 0 0 0 2px var(--beacon-glow), 0 8px 32px -16px var(--beacon-glow); }
    body.dragging-active { -webkit-user-select: none; user-select: none; }
    body.dragging-active .task { cursor: grabbing; }
    .task-check {
      flex-shrink: 0; width: 20px; height: 20px; border: 1.5px solid var(--ink-line-2);
      border-radius: 6px; cursor: pointer; display: grid; place-items: center;
      background: var(--paper); margin-top: 1px;
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
    }
    .task-check:hover { border-color: var(--beacon); }
    .task.done .task-check { background: var(--signal); border-color: var(--signal); }
    .task-check svg {
      width: 12px; height: 12px; stroke: var(--paper); stroke-width: 3; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 16; stroke-dashoffset: 16;
      transition: stroke-dashoffset 0.32s var(--ease) 0.05s;
    }
    .task.done .task-check svg { stroke-dashoffset: 0; }
    @keyframes checkPop { 0% { transform: scale(1); } 42% { transform: scale(1.22); } 100% { transform: scale(1); } }
    .task-check.pop { animation: checkPop 0.34s var(--ease); }
    .task-body { flex: 1; min-width: 0; }
    .task-title {
      /* Font kao "Kalendar" (mono — uža slova); boja/veličina ostaju kao prije. */
      font-family: var(--font-mono);
      font-size: 1.15rem; color: var(--ink); line-height: 1.4; word-break: break-word;
      display: inline; transition: color 0.35s var(--ease), background-size 0.4s var(--ease);
      background-image: linear-gradient(transparent calc(50% - 0.75px), currentColor 0, currentColor calc(50% + 0.75px), transparent 0);
      background-size: 0% 100%; background-repeat: no-repeat; background-position: left center;
    }
    .task.done .task-title { background-size: 100% 100%; opacity: 0.6; }
    .task-bottom {
      display: flex; align-items: center; justify-content: space-between; gap: 0.4rem;
      margin-top: 0.4rem; padding-left: 0; flex-wrap: nowrap; min-width: 0;
    }
    .task-chips {
      display: flex; align-items: center; gap: 0.35rem; flex-wrap: nowrap;
      flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none;
    }
    .task-chips::-webkit-scrollbar { display: none; }
    .repeat-select {
      height: 26px; font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; padding: 0 0.4rem; border-radius: 6px; border: 1px solid var(--ink-line);
      color: var(--ink-4); background: transparent; cursor: pointer; outline: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .repeat-select:hover { border-color: var(--ink-line-2); color: var(--ink-3); background: var(--paper-3); }
    .repeat-select.has-repeat { color: var(--beacon-2); border-color: rgba(184,115,51,0.25); background: var(--beacon-soft); }
    .repeat-select.has-repeat:hover { border-color: var(--beacon); }
    .repeat-add {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; padding: 0; border: none; background: none;
      cursor: pointer; color: var(--ink-4); opacity: 0.3; transition: opacity 0.2s;
    }
    .repeat-add svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    li:hover .repeat-add { opacity: 0.8; }
    .repeat-add:hover { opacity: 1 !important; color: var(--beacon-2); }
    /* Dvoklik na naslov → inline edit (contenteditable). */
    .task-title[contenteditable="true"] {
      outline: none; cursor: text;
      border-radius: 6px; padding: 0 0.2rem; margin: 0 -0.2rem;
      box-shadow: 0 0 0 2px var(--beacon-soft); border-bottom: 2px solid var(--beacon);
      transition: none; /* nema animacije strike kroz dok se uređuje */
    }
    .task-title[contenteditable="true"]::after { display: none; }
    .edit-icon {
      font-size: 0.75rem; color: var(--ink-4); opacity: 0.35; margin-left: 0.35rem; cursor: pointer;
      display: inline-block; transition: opacity 0.2s, color 0.2s;
    }
    .task:hover .edit-icon { opacity: 0.8; }
    .edit-icon:hover { opacity: 1; color: var(--beacon-2); }
    .task-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
    .prio {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px;
      font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0 0.5rem; border-radius: 6px; border: 1px solid;
    }
    .prio.high { color: var(--ember); background: rgba(192,86,59,0.06); border-color: rgba(192,86,59,0.25); }
    /* "normal" = podrazumevani srednji prioritet (plavkast). "medium" je legacy alias istog izgleda. */
    .prio.normal, .prio.medium { color: var(--azure); background: var(--azure-soft); border-color: rgba(58,110,165,0.30); }
    .prio.low { color: var(--ink-4); background: rgba(26,26,31,0.04); border-color: var(--ink-line); }
    .prio.move-tomorrow { color: var(--beacon-2); background: var(--beacon-soft); border-color: rgba(184,115,51,0.28); cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.1s; padding: 0 1rem; min-width: 44px; }
    .prio.move-tomorrow:hover { background: var(--beacon); color: var(--paper); }
    .prio.move-tomorrow:active { transform: scale(0.9); }
    
    .prio.subtask-add { 
      cursor: pointer; 
      color: rgba(138, 43, 226, 0.85); 
      background: rgba(138, 43, 226, 0.04); 
      border-color: rgba(138, 43, 226, 0.25);
      transition: background 0.2s, transform 0.1s;
    }
    .prio.subtask-add:hover { background: rgba(138, 43, 226, 0.12); }
    .prio.subtask-add:active { transform: scale(0.95); }
    /* Sat / vrijeme taska. */
    .task-time {
      position: relative; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      height: 28px; padding: 0 0.5rem; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--ink-line); color: var(--ink-3);
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.01em;
      transition: color 0.2s, background 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .task-time svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .task-time .tt-text:empty { display: none; }
    /* Prazan sat je uvijek vidljiv — na dodir nema :hover stanja. */
    .task-time:not(.set) { opacity: 0.6; width: 28px; padding: 0; }
    .task:hover .task-time:not(.set) { opacity: 0.85; }
    .task-time:not(.set):hover { opacity: 1; color: var(--beacon-2); border-color: var(--ink-line-2); }
    /* Kad je vrijeme postavljeno: sakrij sat, prikaži vrijeme. */
    .task-time.set {
      opacity: 1; color: var(--beacon-2); background: var(--beacon-soft);
      border-color: rgba(184,115,51,0.28);
      width: auto; padding: 0 0.55rem;
    }
    .task-time.set svg { display: none; }
    .task-time.set .tt-text { font-size: 0.8rem; font-weight: 600; line-height: 1; }
    .task-time.set:hover { border-color: var(--beacon); }
    
    /* ═══════════ DRUM TIME PICKER ═══════════ */
    .tp-backdrop {
      position: fixed; inset: 0; background: rgba(6,6,8,0.65);
      z-index: 10000; opacity: 0; visibility: hidden;
      transition: opacity 0.25s; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .tp-backdrop.open { opacity: 1; visibility: visible; }
    .tp-modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -42%);
      background: var(--tp-bg); border: 1px solid var(--tp-border); border-radius: 18px;
      padding: 1.4rem 1.2rem 1.2rem; z-index: 10001;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s, transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
      box-shadow: 0 24px 48px -12px rgba(0,0,0,0.5); width: 280px;
    }
    .tp-modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }

    /* Header */
    .tp-header {
      font-family: var(--font-display); font-size: 1rem; color: var(--tp-text-near2);
      text-align: center; margin-bottom: 1rem; letter-spacing: 0.03em;
    }

    /* Drum body */
    .tp-drums { display: flex; justify-content: center; align-items: center; gap: 0; position: relative; margin-bottom: 1.4rem; }
    .tp-separator {
      font-family: var(--font-mono); font-size: 2rem; font-weight: 700;
      color: var(--tp-text-sel); user-select: none; padding: 0 0.15rem; line-height: 1;
    }

    /* Single drum column */
    .tp-drum {
      display: flex; flex-direction: column; align-items: center; width: 100px; position: relative;
    }
    .tp-arrow {
      background: none; border: none; cursor: pointer; padding: 6px 14px;
      color: var(--tp-text-near1); font-size: 1.1rem; line-height: 1;
      transition: color 0.15s; user-select: none; z-index: 2;
    }
    .tp-arrow:hover { color: var(--tp-text-sel); }
    .tp-arrow:active { color: var(--beacon); }

    /* Scroll window */
    .tp-scroll-wrap {
      position: relative; height: 210px; overflow: hidden; width: 100%;
      touch-action: none; overscroll-behavior: contain;
    }
    /* Highlight band behind selected row */
    .tp-highlight {
      position: absolute; top: 50%; left: -8px; right: -8px; height: 42px;
      transform: translateY(-50%); border-radius: 10px;
      background: var(--tp-highlight-bg); pointer-events: none; z-index: 0;
    }
    /* Fade masks top & bottom */
    .tp-scroll-wrap::before, .tp-scroll-wrap::after {
      content: ''; position: absolute; left: 0; right: 0; height: 72px; z-index: 1; pointer-events: none;
    }
    .tp-scroll-wrap::before { top: 0; background: linear-gradient(to bottom, var(--tp-bg) 10%, transparent); }
    .tp-scroll-wrap::after  { bottom: 0; background: linear-gradient(to top, var(--tp-bg) 10%, transparent); }

    .tp-scroll {
      position: absolute; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.25s cubic-bezier(0.22,0.68,0,1);
    }
    .tp-cell {
      height: 42px; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 1.55rem; font-weight: 600;
      color: var(--tp-text-dim); transition: color 0.2s, font-size 0.2s;
      user-select: none; cursor: pointer; width: 100%;
    }
    .tp-cell.near1 { color: var(--tp-text-near1); font-size: 1.35rem; }
    .tp-cell.near2 { color: var(--tp-text-near2); font-size: 1.45rem; }
    .tp-cell.sel   { color: var(--tp-text-sel); font-size: 1.7rem; }

    /* Editable input overlaid on selected cell */
    .tp-edit {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 56px; height: 38px; z-index: 3;
      font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600;
      color: var(--tp-text-sel); background: var(--tp-highlight-bg); border: 1px solid var(--beacon);
      border-radius: 8px; text-align: center; outline: none;
      display: none; /* shown on click */
    }

    /* Footer */
    .tp-footer { display: flex; justify-content: space-between; gap: 0.8rem; }
    .tp-btn {
      flex: 1; padding: 0.65rem; border-radius: 10px; border: 1px solid var(--tp-btn-border);
      background: var(--tp-btn-bg); color: var(--tp-btn-text);
      font-weight: 500; cursor: pointer; transition: 0.15s; font-size: 0.85rem;
    }
    .tp-btn.primary { background: var(--beacon); color: #fff; border-color: var(--beacon); }
    .tp-btn:hover { filter: brightness(1.15); }
    .tp-btn:active { transform: scale(0.97); }

    /* × dugme u gornjem desnom uglu taska. */
    .task-delete {
      flex-shrink: 0; cursor: pointer;
      display: inline-grid; place-items: center;
      width: 28px; height: 28px; padding: 0;
      font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; line-height: 1;
      color: var(--ember); background: rgba(192,86,59,0.06); border: 1px solid rgba(192,86,59,0.25); border-radius: 6px;
      opacity: 0.6; transition: opacity 0.2s, color 0.2s, background 0.2s, border-color 0.2s, transform 0.1s;
    }
    .task:hover .task-delete { opacity: 1; }
    .task-delete:hover { background: rgba(192,86,59,0.16); border-color: rgba(192,86,59,0.45); }
    .task-delete:active { transform: scale(0.9); }
    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--ink-4); font-style: italic; font-size: 0.88rem; }

    /* CALENDAR (u "Danas" koloni) — azure akcenat #3a6ea5 */
    .cal-section {
      border-bottom: 1px solid var(--ink-line); padding: 0.85rem 1.5rem;
      background: linear-gradient(180deg, var(--azure-soft), transparent);
    }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
    .cal-label {
      font-family: var(--font-mono); font-size: 0.86rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--azure); display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .cal-refresh {
      background: none; border: none; color: var(--ink-4); cursor: pointer; font-size: 0.85rem;
      padding: 2px; transition: color 0.2s, transform 0.4s var(--ease);
    }
    .cal-refresh:hover { color: var(--azure); }
    .cal-refresh.spinning { transform: rotate(360deg); }
    .col-body { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; }
    .cal-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .cal-event { display: flex; gap: 0.65rem; align-items: flex-start; font-size: 0.86rem; color: var(--ink-2); padding: 0.3rem 0; }
    .cal-event .cal-time { font-family: var(--font-mono); font-size: 0.72rem; color: var(--azure); min-width: 3.2rem; padding-top: 1px; }
    .cal-event .cal-title { flex: 1; line-height: 1.4; }
    .cal-event .cal-loc { font-size: 0.72rem; color: var(--ink-4); margin-top: 1px; }
    .cal-empty, .cal-stub { font-size: 0.82rem; color: var(--ink-4); font-style: italic; }
    .cal-connect {
      display: inline-flex; align-items: center; gap: 0.45rem; margin-top: 0.2rem;
      border: 1px solid var(--ink-line-2); background: var(--paper-3); color: var(--ink);
      font-family: var(--font-sans); font-size: 0.82rem; font-weight: 500;
      padding: 0.5rem 0.8rem; border-radius: 9px; text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .cal-connect:hover { border-color: var(--azure); background: var(--azure-soft); }

    /* FOOTER (slim) */
    .footer {
      max-width: var(--maxw); margin: 0 auto; padding: 1.75rem var(--gut) 3rem;
      border-top: 1px solid var(--ink-line);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-4);
    }
    .footer code {
      color: var(--beacon-2); background: var(--beacon-soft);
      padding: 0.08rem 0.35rem; border-radius: 4px;
    }
    .footer em { font-family: var(--font-display); font-style: italic; color: var(--beacon); }
    .footer-left { display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .footer .sys-sep { color: var(--ink-line-2); }
    .footer .sys-stats { color: var(--ink-4); letter-spacing: 0.01em; }
    .footer .sys-stats b { color: var(--beacon-2); font-weight: 600; }
    .footer .gw-status { display: inline-flex; align-items: center; gap: 0.4rem; }
    .footer .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .footer .on { color: var(--signal); }
    .footer .off { color: var(--ink-4); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
