<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noema — AI Projects</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="AI projekti, alati i radni linkovi na jednom mjestu sa vizuelnim karticama i podrškom za naljepljivanje slika (Ctrl+V).">
  <script>
    (function () {
      try { document.documentElement.setAttribute("data-theme", localStorage.getItem("noema-theme") || "dark"); } catch (e) {}
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() { navigator.serviceWorker.register("/sw.js").catch(function(){}); });
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f3ec; --paper-2: #efebe2; --card: #ffffff;
      --ink: #1a1a1f; --ink-2: #3d3d44; --muted: #6b6b73; --faint: #9b958a;
      --line: rgba(26,26,31,.10); --line-2: rgba(26,26,31,.18);
      --beacon: #b87333; --beacon-2: #9c6029; --soft: rgba(184,115,51,.08);
      --display: 'Fraunces', Georgia, serif; --sans: 'Geist', system-ui, sans-serif; --mono: 'JetBrains Mono', monospace;
      --ease: cubic-bezier(.22,1,.36,1);
    }
    html[data-theme="dark"] {
      --paper: #0a0a0c; --paper-2: #0f0f12; --card: #141418;
      --ink: #f4efe6; --ink-2: #d8d2c4; --muted: #9b958a; --faint: #5c574f;
      --line: rgba(244,239,230,.09); --line-2: rgba(244,239,230,.16);
      --beacon: #e8b07d; --beacon-2: #d4a574; --soft: rgba(232,176,125,.11);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; color: var(--ink-2); background: var(--paper); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; } button { cursor: pointer; } ::selection { background: var(--beacon); color: var(--paper); }
    
    .wrap { width: min(1200px, calc(100% - 2.5rem)); margin: 0 auto; padding: 2rem 0 4rem; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
    .back { display: inline-flex; align-items: center; gap: .55rem; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; background: transparent; text-decoration: none; padding: .48rem .75rem; font: 500 .75rem var(--mono); transition: .2s; }
    .back:hover { border-color: var(--beacon); color: var(--beacon-2); }
    .back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    
    .hero { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 2rem; margin-bottom: 2rem; }
    .eyebrow { color: var(--beacon-2); font: 600 .68rem var(--mono); letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: .45rem 0 .55rem; color: var(--ink); font: 300 clamp(2.5rem,6vw,4.5rem)/.95 var(--display); letter-spacing: -.05em; }
    .intro { margin: 0; max-width: 42rem; color: var(--muted); font-size: 1.02rem; }
    .count { align-self: center; color: var(--faint); font: .72rem var(--mono); white-space: nowrap; }
    .count b { color: var(--beacon-2); font-weight: 600; }

    .search { position: relative; margin-bottom: 2rem; }
    .search svg { position: absolute; top: 50%; left: 1.1rem; width: 18px; height: 18px; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 1.7; pointer-events: none; }
    .search input { width: 100%; padding: .95rem 3rem; border: 1px solid var(--line-2); border-radius: 14px; color: var(--ink); background: var(--card); outline: none; transition: .2s; }
    .search input:focus { border-color: var(--beacon); box-shadow: 0 0 0 4px var(--soft); }
    .search input::placeholder { color: var(--faint); }
    .clear-search { position: absolute; top: 50%; right: .9rem; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: 50%; color: var(--muted); background: transparent; font-size: 1.2rem; }
    .clear-search:hover { color: var(--beacon-2); background: var(--soft); }

    /* 3-COLUMN GRID LAYOUT */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .project-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line-2);
      border-radius: 18px;
      overflow: hidden;
      transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
    }
    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--beacon);
      box-shadow: 0 10px 28px -6px rgba(184,115,51,0.16);
    }
    html[data-theme="dark"] .project-card:hover {
      box-shadow: 0 14px 36px -8px rgba(0,0,0,0.5);
    }
    .project-card.pinned {
      border-color: var(--beacon);
      box-shadow: 0 0 0 1px var(--beacon);
    }

    /* CARD TOP BANNER MATCHING BACKUP CARD HEADER */
    .card-top-banner {
      padding: 1.1rem 1.35rem 0.9rem;
      background: var(--paper-2);
      border-bottom: 1px solid var(--line);
    }
    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    .card-title-link {
      font-family: var(--display);
      font-size: 1.45rem;
      font-weight: 400;
      color: var(--beacon-2);
      text-decoration: none;
      line-height: 1.25;
      letter-spacing: -.01em;
      transition: color .2s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-title-link:hover { color: var(--beacon); }
    .pin-badge {
      color: var(--beacon);
      font-size: .85rem;
    }

    /* PREVIEW FRAME */
    .preview-frame {
      position: relative;
      width: 100%;
      height: 155px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
    }
    .frame-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 5px 12px;
      background: rgba(26,26,31,.04);
      border-bottom: 1px solid var(--line);
      transition: background .2s;
    }
    html[data-theme="dark"] .frame-bar {
      background: rgba(0,0,0,0.22);
    }
    .frame-url {
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--beacon-2);
      background: var(--card);
      border: 1px solid var(--line-2);
      padding: 2px 8px;
      border-radius: 5px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .frame-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--paper-2);
    }
    .frame-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .empty-frame-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      color: var(--faint);
      font-family: var(--mono);
      font-size: .72rem;
      text-align: center;
      padding: 1rem;
      transition: color .2s;
    }
    .project-card:hover .empty-frame-prompt {
      color: var(--beacon-2);
    }
    .empty-frame-prompt svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    /* CARD BODY INNER BOX MATCHING BACKUP CARD INNER CONTAINER */
    .card-body {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--paper-2);
    }
    .inner-box {
      background: var(--card);
      border: 1px solid var(--line-2);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .card-note {
      margin: 0 0 .8rem;
      font-size: .84rem;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-note-empty {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--faint);
      margin-bottom: .8rem;
    }

    .card-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }
    .label-tag {
      padding: .22rem .6rem;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      color: var(--beacon-2);
      background: var(--soft);
      font-family: var(--mono);
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: .35rem;
    }
    .action-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      background: var(--paper-2);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: .85rem;
      transition: .2s;
    }
    .action-btn:hover { border-color: var(--beacon); color: var(--beacon-2); background: var(--card); }
    .action-btn.danger:hover { border-color: #c0563b; color: #c0563b; }

    .add-card-btn {
      min-height: 280px;
      border: 2px dashed var(--line-2);
      border-radius: 16px;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      transition: .25s var(--ease);
      padding: 1.5rem;
      text-align: center;
    }
    .add-card-btn:hover {
      border-color: var(--beacon);
      color: var(--beacon-2);
      background: var(--soft);
    }
    .add-card-btn strong { font-size: 2.2rem; font-weight: 300; line-height: 1; }
    .add-card-btn span { font-size: .9rem; font-weight: 500; }

    .empty { grid-column: 1 / -1; min-height: 200px; display: grid; place-items: center; padding: 2rem; color: var(--faint); text-align: center; background: var(--card); border-radius: 16px; border: 1px solid var(--line); }
    .empty strong { display: block; color: var(--ink); font: 300 1.5rem var(--display); margin-bottom: .4rem; }

    /* Dialog Form with Image Paste & Upload Zone */
    dialog { width: min(560px, calc(100% - 2rem)); padding: 0; color: var(--ink-2); background: var(--card); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
    .form-head { padding: 1.25rem 1.4rem 1rem; border-bottom: 1px solid var(--line); }
    .form-head h2 { margin: 0; color: var(--ink); font: 400 1.55rem var(--display); }
    .form-head p { margin: .22rem 0 0; color: var(--muted); font-size: .8rem; }
    .edit-form { padding: 1.3rem 1.4rem 1.4rem; }
    .field { display: block; margin-bottom: .85rem; }
    .field span { display: block; margin-bottom: .35rem; color: var(--muted); font: 500 .62rem var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .field input, .field textarea { width: 100%; padding: .68rem .75rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line-2); border-radius: 8px; outline: 0; }
    .field input:focus, .field textarea:focus { border-color: var(--beacon); box-shadow: 0 0 0 3px var(--soft); }
    .field textarea { min-height: 75px; resize: vertical; }

    /* PASTE / UPLOAD IMAGE ZONE */
    .image-paste-zone {
      border: 2px dashed var(--line-2);
      border-radius: 10px;
      padding: .85rem;
      background: var(--paper);
      text-align: center;
      cursor: pointer;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    .image-paste-zone:focus, .image-paste-zone.dragover {
      border-color: var(--beacon);
      background: var(--soft);
    }
    .paste-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
      color: var(--muted);
      font-size: .8rem;
      padding: .4rem 0;
    }
    .paste-hint svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .paste-hint b { color: var(--beacon-2); font-family: var(--mono); font-weight: 600; }
    .image-preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
    }
    .image-preview-container img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 8px;
      object-fit: contain;
      border: 1px solid var(--line-2);
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }
    .image-zone-actions {
      display: flex;
      justify-content: center;
      gap: .5rem;
    }

    .form-actions { display: flex; justify-content: flex-end; gap: .55rem; margin-top: 1.1rem; }
    .button { padding: .62rem 1rem; color: var(--muted); background: transparent; border: 1px solid var(--line-2); border-radius: 8px; font-weight: 500; font-size: .82rem; }
    .button.primary { color: var(--paper); background: var(--beacon-2); border-color: var(--beacon-2); }
    .button.primary:hover { background: var(--beacon); }
    .button.danger:hover { color: #c0563b; border-color: #c0563b; }
    .hero-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .75rem;
    }
    .view-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem 1.25rem;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      color: var(--beacon-2);
      background: var(--card);
      font-family: var(--sans);
      font-size: .88rem;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      transition: all .2s var(--ease);
      cursor: pointer;
    }
    .view-toggle-btn:hover {
      border-color: var(--beacon);
      color: var(--beacon);
      background: var(--soft);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(184,115,51,0.15);
    }
    .view-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    /* TABLE VIEW STYLING */
    .projects-table-wrap {
      width: 100%;
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--line-2);
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      margin-bottom: 2rem;
    }
    .projects-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    .projects-table th {
      font-family: var(--mono);
      font-size: .66rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--paper-2);
      padding: .9rem 1.1rem;
      border-bottom: 1px solid var(--line-2);
      text-align: left;
    }
    .projects-table td {
      padding: .85rem 1.1rem;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      color: var(--ink-2);
    }
    .projects-table tr:last-child td { border-bottom: 0; }
    .projects-table tr:hover td { background: var(--paper-2); }
    .projects-table tr.pinned td { background: rgba(184,115,51,0.04); }
    .td-thumb { width: 75px; }
    .td-thumb img {
      width: 60px;
      height: 42px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line-2);
      display: block;
    }
    .table-empty-thumb {
      width: 60px;
      height: 42px;
      border-radius: 8px;
      border: 1px dashed var(--line-2);
      background: var(--paper-2);
      display: grid;
      place-items: center;
      font-size: .85rem;
      color: var(--faint);
    }
    .table-title {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-weight: 600;
      font-size: 1rem;
    }
    .table-title a { color: var(--ink); text-decoration: none; transition: color .2s; }
    .table-title a:hover { color: var(--beacon-2); }
    .table-domain {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--faint);
      margin-top: .15rem;
    }
    .td-desc {
      color: var(--muted);
      font-size: .83rem;
      max-width: 320px;
    }

    @media (max-width: 960px) {
      .projects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .projects-grid { grid-template-columns: 1fr; }
      .hero { display: flex; flex-direction: column; align-items: flex-start; gap: 1rem; }
      .hero-actions { align-items: flex-start; width: 100%; }
      .view-toggle-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a class="back" href="/"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg> Noema</a>
    </div>

    <section class="hero">
      <div>
        <div class="eyebrow">Noema workspace · collection 01</div>
        <h1>AI Projects</h1>
      </div>
      <div class="hero-actions">
        <button class="view-toggle-btn" id="viewToggle" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
          <span id="toggleText">Prikaz u tabeli</span>
        </button>
        <div class="count"><b id="count">0</b> projekta u kolekciji</div>
      </div>
    </section>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Pretraži projekte, adrese, oznake…" autocomplete="off" aria-label="Pretraži AI projekte">
      <button id="clear" class="clear-search" type="button" hidden aria-label="Očisti pretragu">×</button>
    </div>

    <section class="projects-grid" id="projects"></section>
  </main>

  <dialog id="editor">
    <div class="form-head">
      <h2 id="formTitle">Novi AI projekat</h2>
      <p>Nalijepi sliku sa <b>Ctrl+V</b> ili izaberi fajl za vizuelni printscreen sajta.</p>
    </div>
    <form class="edit-form" id="form">
      <label class="field"><span>Naslov</span><input id="title" maxlength="300" placeholder="npr. Telegram modeli"></label>
      <label class="field"><span>URL</span><input id="url" type="url" required placeholder="https://example.com"></label>
      
      <div class="field">
        <span>Printscreen slika</span>
        <div class="image-paste-zone" id="imagePasteZone" tabindex="0">
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          <div id="imagePreviewBox">
            <div class="paste-hint">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>Klikni za izbor slike ili nalijepi sa <b>Ctrl+V</b> / <b>Cmd+V</b></span>
            </div>
          </div>
          <div class="image-zone-actions" id="imageActions" style="display:none;">
            <button type="button" class="button" id="changeImageBtn">Promijeni sliku (ili Ctrl+V)</button>
            <button type="button" class="button danger" id="removeImageBtn">Ukloni sliku</button>
          </div>
        </div>
      </div>

      <label class="field"><span>Description / bilješka</span><textarea id="description" maxlength="1000" placeholder="Kratak opis ili namjena projekta"></textarea></label>
      <label class="field"><span>Oznaka (Label)</span><input id="label" maxlength="40" placeholder="npr. models, cloud, workspace"></label>
      <div class="form-error" id="formError"></div>
      <div class="form-actions">
        <button class="button" id="cancel" type="button">Otkaži</button>
        <button class="button primary" id="save" type="submit">Save projekat</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      let currentView = localStorage.getItem('noema-ai-view') || 'grid';

      const els = {
        projects: document.getElementById('projects'),
        count: document.getElementById('count'),
        viewToggle: document.getElementById('viewToggle'),
        toggleText: document.getElementById('toggleText'),
        search: document.getElementById('search'),
        clear: document.getElementById('clear'),
        editor: document.getElementById('editor'),
        form: document.getElementById('form'),
        formTitle: document.getElementById('formTitle'),
        error: document.getElementById('formError'),
        title: document.getElementById('title'),
        url: document.getElementById('url'),
        description: document.getElementById('description'),
        label: document.getElementById('label'),
        imageZone: document.getElementById('imagePasteZone'),
        fileInput: document.getElementById('fileInput'),
        previewBox: document.getElementById('imagePreviewBox'),
        imageActions: document.getElementById('imageActions'),
        changeBtn: document.getElementById('changeImageBtn'),
        removeBtn: document.getElementById('removeImageBtn')
      };

      els.viewToggle.addEventListener('click', () => {
        currentView = currentView === 'grid' ? 'table' : 'grid';
        localStorage.setItem('noema-ai-view', currentView);
        render();
      });

      let projects = [], editingId = null, currentImageDataUrl = '';
      const escape = (value) => String(value || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      const api = async (path, options = {}) => {
        const res = await fetch(path, { headers:{'Content-Type':'application/json'}, ...options });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || 'Nešto nije uspjelo.');
        return data;
      };

      // Image Compression & Processing (Max width 1100px for sharp previews)
      function processImageFile(file, callback) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1100;
            let w = img.width, h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            callback(dataUrl);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function setImagePreview(dataUrl) {
        currentImageDataUrl = dataUrl || '';
        if (currentImageDataUrl) {
          els.previewBox.innerHTML = `
            <div class="image-preview-container">
              <img src="${escape(currentImageDataUrl)}" alt="Printscreen preview">
            </div>
          `;
          els.imageActions.style.display = 'flex';
        } else {
          els.previewBox.innerHTML = `
            <div class="paste-hint">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <span>Klikni za izbor slike ili nalijepi sa <b>Ctrl+V</b> / <b>Cmd+V</b></span>
            </div>
          `;
          els.imageActions.style.display = 'none';
        }
      }

      // Handle Clipboard Paste (Ctrl+V / Cmd+V)
      function handlePaste(e) {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            e.preventDefault();
            const file = item.getAsFile();
            if (file) {
              processImageFile(file, (dataUrl) => {
                setImagePreview(dataUrl);
              });
            }
            break;
          }
        }
      }

      // Clipboard Paste anywhere on document or dialog
      document.addEventListener('paste', (e) => {
        if (els.editor.open) {
          handlePaste(e);
        }
      });

      // File input picker & drag & drop
      els.imageZone.addEventListener('click', (e) => {
        if (e.target.closest('#removeImageBtn') || e.target.closest('#changeImageBtn')) return;
        els.fileInput.click();
      });
      els.fileInput.addEventListener('change', () => {
        if (els.fileInput.files && els.fileInput.files[0]) {
          processImageFile(els.fileInput.files[0], (dataUrl) => setImagePreview(dataUrl));
        }
      });
      els.changeBtn.addEventListener('click', () => els.fileInput.click());
      els.removeBtn.addEventListener('click', () => setImagePreview(''));

      // Drag & Drop
      els.imageZone.addEventListener('dragover', (e) => { e.preventDefault(); els.imageZone.classList.add('dragover'); });
      els.imageZone.addEventListener('dragleave', () => els.imageZone.classList.remove('dragover'));
      els.imageZone.addEventListener('drop', (e) => {
        e.preventDefault();
        els.imageZone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          processImageFile(e.dataTransfer.files[0], (dataUrl) => setImagePreview(dataUrl));
        }
      });

      const filtered = () => {
        const q = els.search.value.trim().toLowerCase();
        return q ? projects.filter(p => [p.title, p.url, p.description, p.label, p.domain].join(' ').toLowerCase().includes(q)) : projects;
      };

      function render() {
        const visible = filtered();
        const q = els.search.value.trim();
        els.count.textContent = projects.length;
        els.clear.hidden = !q;

        if (currentView === 'table') {
          els.toggleText.textContent = 'Prikaz u karticama';
          els.projects.className = 'projects-table-container';
        } else {
          els.toggleText.textContent = 'Prikaz u tabeli';
          els.projects.className = 'projects-grid';
        }

        if (!visible.length) {
          els.projects.innerHTML = `
            <div class="empty">
              <div>
                <strong>${q ? 'Nema podudaranja.' : 'Kolekcija je spremna.'}</strong>
                ${q ? 'Pokušaj sa drugim pojmom.' : 'Dodaj prvi projekat u kolekciju.'}
              </div>
            </div>
            <button class="add-card-btn" id="addOpenEmpty" type="button">
              <strong>+</strong>
              <span>Dodaj novi AI projekat</span>
            </button>
          `;
          document.getElementById('addOpenEmpty')?.addEventListener('click', () => openEditor());
          return;
        }

        if (currentView === 'table') {
          const rowsHtml = visible.map(p => `
            <tr class="${p.pinned ? 'pinned' : ''}">
              <td class="td-thumb">
                <a href="${escape(p.url)}" target="_blank" rel="noopener">
                  ${p.image ? `<img src="${escape(p.image)}" alt="">` : `<div class="table-empty-thumb">🔗</div>`}
                </a>
              </td>
              <td class="td-main">
                <div class="table-title">
                  <a href="${escape(p.url)}" target="_blank" rel="noopener">${escape(p.title)}</a>
                  ${p.pinned ? '<span class="pin-badge" title="Istaknuto">◆</span>' : ''}
                </div>
                <div class="table-domain">${escape(p.domain || p.url)}</div>
              </td>
              <td class="td-desc">${escape(p.description || '—')}</td>
              <td>${p.label ? `<span class="label-tag">${escape(p.label)}</span>` : '—'}</td>
              <td class="td-actions" style="text-align: right;">
                <div class="card-actions" style="justify-content: flex-end;">
                  <button class="action-btn" data-pin="${p.id}" title="${p.pinned ? 'Ukloni isticanje' : 'Istakni projekat'}">◆</button>
                  <button class="action-btn" data-edit="${p.id}" title="Izmijeni">✎</button>
                  <button class="action-btn danger" data-delete="${p.id}" title="Delete">×</button>
                </div>
              </td>
            </tr>
          `).join('');

          els.projects.innerHTML = `
            <div class="projects-table-wrap">
              <table class="projects-table">
                <thead>
                  <tr>
                    <th>Slika</th>
                    <th>Projekat / URL</th>
                    <th>Description / Bilješka</th>
                    <th>Oznaka</th>
                    <th style="text-align: right;">Akcije</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
            <button class="add-card-btn" id="addOpenTable" type="button" style="min-height: 70px;">
              <strong>+</strong>
              <span>Dodaj novi AI projekat</span>
            </button>
          `;
          document.getElementById('addOpenTable')?.addEventListener('click', () => openEditor());
          return;
        }

        const cardsHtml = visible.map(p => {
          return `
            <article class="project-card ${p.pinned ? 'pinned' : ''}">
              <div class="card-top-banner">
                <div class="card-title-row">
                  <a class="card-title-link" href="${escape(p.url)}" target="_blank" rel="noopener">${escape(p.title)}</a>
                  ${p.pinned ? '<span class="pin-badge" title="Istaknuto">◆</span>' : ''}
                </div>
              </div>
              <a class="preview-frame" href="${escape(p.url)}" target="_blank" rel="noopener" title="Otvori ${escape(p.title)}">
                <div class="frame-bar">
                  <span class="frame-url">${escape(p.domain || p.url)}</span>
                </div>
                <div class="frame-body">
                  ${p.image ? `<img class="frame-img" src="${escape(p.image)}" alt="${escape(p.title)}">` : ''}
                </div>
              </a>
              <div class="card-body">
                <div class="inner-box">
                  ${p.description ? `<p class="card-note">${escape(p.description)}</p>` : `<div class="card-note-empty">${escape(p.domain || p.url)}</div>`}
                  
                  <div class="card-footer-row">
                    ${p.label ? `<span class="label-tag">${escape(p.label)}</span>` : '<span></span>'}
                    <div class="card-actions">
                      <button class="action-btn" data-pin="${p.id}" title="${p.pinned ? 'Ukloni isticanje' : 'Istakni projekat'}">◆</button>
                      <button class="action-btn" data-edit="${p.id}" title="Izmijeni / Ubaci sliku">✎</button>
                      <button class="action-btn danger" data-delete="${p.id}" title="Delete">×</button>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          `;
        }).join('');

        const addCardHtml = `
          <button class="add-card-btn" id="addOpen" type="button">
            <strong>+</strong>
            <span>Dodaj novi AI projekat</span>
          </button>
        `;

        els.projects.innerHTML = cardsHtml + addCardHtml;
        document.getElementById('addOpen')?.addEventListener('click', () => openEditor());
      }

      function openEditor(project) {
        editingId = project?.id || null;
        els.formTitle.textContent = editingId ? 'Izmijeni projekat' : 'Novi AI projekat';
        els.title.value = project?.title || '';
        els.url.value = project?.url || '';
        els.description.value = project?.description || '';
        els.label.value = project?.label || '';
        els.error.textContent = '';
        setImagePreview(project?.image || '');
        els.editor.showModal();
        setTimeout(() => (editingId ? els.title : els.url).focus(), 20);
      }

      async function load() {
        try {
          projects = (await api('/api/ai-projects')).links || [];
          render();
        } catch (err) {
          els.projects.innerHTML = `<div class="empty"><div><strong>Ne mogu učitati kolekciju.</strong>${escape(err.message)}</div></div>`;
        }
      }

      els.search.addEventListener('input', render);
      els.clear.addEventListener('click', () => { els.search.value = ''; render(); els.search.focus(); });
      document.getElementById('cancel').addEventListener('click', () => els.editor.close());

      els.form.addEventListener('submit', async event => {
        event.preventDefault();
        els.error.textContent = '';
        const payload = {
          title: els.title.value,
          url: els.url.value,
          description: els.description.value,
          label: els.label.value,
          image: currentImageDataUrl
        };
        try {
          const result = await api(editingId ? `/api/ai-projects/${editingId}` : '/api/ai-projects', {
            method: editingId ? 'PATCH' : 'POST',
            body: JSON.stringify(payload)
          });
          if (editingId) projects = projects.map(p => p.id === editingId ? result.link : p);
          else projects.unshift(result.link);
          els.editor.close();
          render();
        } catch (err) {
          els.error.textContent = err.message;
        }
      });

      els.projects.addEventListener('click', async event => {
        const button = event.target.closest('button');
        if (!button) return;
        const id = button.dataset.edit || button.dataset.delete || button.dataset.pin;
        const project = projects.find(p => p.id === id);
        if (!project) return;

        if (button.dataset.edit) return openEditor(project);
        if (button.dataset.delete) {
          if (!confirm(`Obrisati „${project.title}“?`)) return;
          try {
            await api(`/api/ai-projects/${id}`, { method: 'DELETE' });
            projects = projects.filter(p => p.id !== id);
            render();
          } catch(err) { alert(err.message); }
        }
        if (button.dataset.pin) {
          try {
            const result = await api(`/api/ai-projects/${id}`, { method: 'PATCH', body: JSON.stringify({ pinned: !project.pinned }) });
            projects = projects.map(p => p.id === id ? result.link : p);
            render();
          } catch(err) { alert(err.message); }
        }
      });

      load();
    })();
  </script>
  <script src="/noema-header-footer.js"></script>
</body>
</html>
