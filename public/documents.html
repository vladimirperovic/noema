<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noema — Documents</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Noema dokumenti — upravljanje dokumentima i fajlovima.">

  <!-- Tema prije paint-a (ista logika kao na početnoj). -->
  <script>
    (function () {
      try {
        var manual = localStorage.getItem("noema-theme-manual");
        var hour = new Date().getHours();
        var autoTheme = (hour >= 19 || hour < 7) ? "dark" : "light";
        var t = (manual === "dark" || manual === "light") ? manual : autoTheme;
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f7f3ec; --paper-2: #fbf8f2; --paper-3: #ffffff;
      --ink-line: rgba(26,26,31,0.10); --ink-line-2: rgba(26,26,31,0.18);
      --ink: #1a1a1f; --ink-2: #3d3d44; --ink-3: #6b6b73; --ink-4: #9b958a;
      --beacon: #b87333; --beacon-2: #9c6029; --beacon-glow: rgba(184,115,51,0.16); --beacon-soft: rgba(184,115,51,0.08);
      --signal: #4a7a5e; --ember: #c0563b; --azure: #3a6ea5;
      --font-display: 'Fraunces', Georgia, serif;
      --font-sans: 'Geist', -apple-system, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ocm-ease: cubic-bezier(.15, .2, .1, 1);
      --maxw: 1100px;
      --gut: clamp(1.25rem, 4vw, 2.5rem);
    }
    html[data-theme="dark"] {
      --paper: #0a0a0c; --paper-2: #0f0f12; --paper-3: #16161b;
      --ink-line: rgba(244,239,230,0.08); --ink-line-2: rgba(244,239,230,0.14);
      --ink: #f4efe6; --ink-2: #d8d2c4; --ink-3: #9b958a; --ink-4: #5c574f;
      --beacon: #e8b07d; --beacon-2: #d4a574; --beacon-glow: rgba(232,176,125,0.22); --beacon-soft: rgba(232,176,125,0.10);
      --signal: #8ab4a1; --ember: #d97757; --azure: #7fa7d9;
    }
    :root { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    html { background: var(--paper); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
      color: var(--ink-2); background: var(--paper); min-height: 100vh;
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
      opacity: 0;
      animation: pageFadeIn 0.6s var(--ocm-ease) forwards;
    }
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::selection { background: var(--beacon); color: var(--paper); }

    .wrap { max-width: var(--maxw); margin: 0 auto; padding: clamp(1.25rem,4vw,2.5rem); }

    /* Top bar */
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      margin-bottom: clamp(1.4rem,4vw,2.2rem);
    }
    .back {
      display: inline-flex; align-items: center; gap: 0.5em; text-decoration: none;
      color: var(--ink-3); font-family: var(--font-mono); font-size: 0.78rem;
      letter-spacing: 0.04em; padding: 0.4rem 0.7rem 0.4rem 0.5rem; border-radius: 8px;
      border: 1px solid var(--ink-line); transition: color 0.2s, border-color 0.2s;
    }
    .back:hover { color: var(--beacon-2); border-color: var(--ink-line-2); }
    .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .top-title { font-family: var(--font-display); font-weight: 300; font-size: clamp(1.4rem,4vw,2rem); color: var(--ink); }
    /* burger-clearance: reserve room for the fixed burger so the title never sits under it. */
    @media (max-width: 1160px) { .top { padding-right: 3.5rem; } }
    .theme-toggle {
      background: var(--paper-3); border: 1px solid var(--ink-line-2); color: var(--ink-3);
      width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 1.05rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .theme-toggle:hover { color: var(--beacon-2); border-color: var(--beacon); }
    
    .doc-fmt-btn {
      background: none; border: 1px solid var(--ink-line); border-radius: 6px; padding: 0.3rem 0.6rem;
      color: var(--ink-2); cursor: pointer; font-family: var(--font-sans); font-size: 0.85rem;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .doc-fmt-btn:hover { background: var(--paper-2); border-color: var(--ink-line-2); color: var(--beacon); }
    .doc-fmt-btn:active { background: var(--paper-3); border-color: var(--beacon); }

    /* Layout: lista naslova (1/3) | checklist (2/3) */
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .column {
      display: flex; flex-direction: column;
      background: var(--paper-2); border: 1px solid var(--ink-line);
      border-radius: 18px; overflow: hidden;
      min-height: 500px;
    }
    .column.is-feature { border-color: var(--ink-line-2); box-shadow: 0 8px 32px -16px var(--beacon-glow); }
    .column.is-feature::before {
      content: ''; display: block; height: 3px;
      background: linear-gradient(90deg, var(--beacon-2), var(--beacon), var(--beacon-2));
    }
    .column-head { padding: 1.2rem 1.5rem 0.85rem; border-bottom: 1px solid var(--ink-line); }
    .col-title {
      font-family: var(--font-display); font-weight: 500; font-size: 1.5rem;
      color: var(--ink); letter-spacing: -0.01em; line-height: 1; outline: none;
    }
    .col-sub { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-3); margin-top: 0.45rem; }
    .col-count {
      margin-top: 0.6rem; display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-3);
      background: rgba(26,26,31,0.04); padding: 0.25rem 0.6rem; border-radius: 100px;
    }
    html[data-theme="dark"] .col-count { background: rgba(244,239,230,0.05); }
    .col-count .num { color: var(--ink); font-weight: 600; }

    /* Dugmad i inputi */
    .field-label {
      font-family: var(--font-mono); font-size: 0.64rem; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 0.4rem;
    }
    .note-input {
      width: 100%; border: 1px solid var(--ink-line-2); border-radius: 9px;
      padding: 0.6rem 0.8rem; font-family: var(--font-sans); font-size: 0.95rem;
      color: var(--ink); background: var(--paper); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .note-input::placeholder { color: var(--ink-4); }
    .note-input:focus { border-color: var(--beacon); box-shadow: 0 0 0 3px var(--beacon-soft); }
    .note-submit {
      align-self: flex-start;
      border: 1px solid var(--beacon); background: var(--beacon-soft); color: var(--beacon-2);
      border-radius: 9px; padding: 0.6rem 1.1rem; font-family: var(--font-sans); font-weight: 600;
      font-size: 0.9rem; cursor: pointer; white-space: nowrap;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.1s;
    }
    .note-submit:hover { background: var(--beacon); color: var(--paper); }
    .note-submit:active { transform: scale(0.97); }
    .note-submit:disabled { opacity: 0.5; cursor: default; }

    /* Lista sa lijeve strane (Naslovi) */
    .sidebar-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--ink-line-2) transparent;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 5px; }
    .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--ink-line-2); border-radius: 3px; }
    .sidebar-scroll::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
    .sidebar-list { list-style: none; padding: 0.5rem 0.75rem 0.35rem; display: flex; flex-direction: column; gap: 0.1rem; }
    .sidebar-item {
      padding: 0.4rem 0.65rem; border-radius: 7px; cursor: pointer;
      font-family: var(--font-sans); font-size: 0.9rem; color: var(--ink-2);
      border: 1px solid transparent; transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: flex; align-items: center; gap: 0.35rem;
    }
    .sidebar-item:hover { background: var(--paper-3); border-color: var(--ink-line); color: var(--ink); }
    .sidebar-item.active { background: var(--beacon-soft); color: var(--beacon-2); border-color: rgba(184,115,51,0.2); font-weight: 500; }
    html[data-theme="dark"] .sidebar-item.active { border-color: rgba(232,176,125,0.2); }

    /* Upload dugmad */
    .upload-row {
      display: flex; gap: 0.35rem; padding: 0 1.5rem 0.5rem; flex-wrap: wrap;
    }
    .upload-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      height: 30px; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; padding: 0 0.75rem; border-radius: 7px; border: 1px solid; cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s; white-space: nowrap;
      color: var(--ink-3); border-color: var(--ink-line); background: transparent;
    }
    .upload-btn:hover { background: var(--paper-3); border-color: var(--ink-line-2); color: var(--ink); }
    .upload-btn:active { transform: scale(0.95); }
    .upload-btn svg { flex-shrink: 0; }
    .upload-btn.type-txt { color: var(--ember); border-color: rgba(192,86,59,0.3); background: rgba(192,86,59,0.06); }
    .upload-btn.type-txt:hover { background: rgba(192,86,59,0.14); border-color: var(--ember); }
    .upload-btn.type-pdf { color: var(--azure); border-color: rgba(58,110,165,0.3); background: rgba(58,110,165,0.06); }
    .upload-btn.type-pdf:hover { background: rgba(58,110,165,0.12); border-color: var(--azure); }
    .upload-btn.type-doc, .upload-btn.type-docx { color: var(--signal); border-color: rgba(74,122,94,0.3); background: rgba(74,122,94,0.06); }
    .upload-btn.type-doc:hover, .upload-btn.type-docx:hover { background: rgba(74,122,94,0.12); border-color: var(--signal); }
    .upload-btn.type-image { color: var(--beacon-2); border-color: rgba(184,115,51,0.3); background: var(--beacon-soft); }
    .upload-btn.type-image:hover { background: rgba(184,115,51,0.14); border-color: var(--beacon); }

    /* Checklist desno */
    .checklist-form { display: flex; gap: 0.6rem; padding: 1.1rem 1.5rem; }
    .checklist-list { list-style: none; padding: 0 1.5rem 1.4rem; display: flex; flex-direction: column; gap: 0.5rem; }
    
    .checklist-item {
      display: flex; gap: 0.8rem; align-items: flex-start;
      padding: 0.8rem 1rem; background: var(--paper-3);
      border: 1px solid var(--ink-line); border-radius: 9px;
      transition: border-color 0.2s;
    }
    .checklist-item:hover { border-color: var(--ink-line-2); }
    .checklist-item.completed { opacity: 0.6; }
    .checklist-item.completed .item-text { text-decoration: line-through; color: var(--ink-3); }
    
    .item-checkbox {
      margin-top: 0.25rem; width: 16px; height: 16px; cursor: pointer; accent-color: var(--beacon);
    }
    .item-content { flex: 1; display: flex; flex-direction: column; }
    .item-text { color: var(--ink); font-size: 0.95rem; outline: none; }
    .item-text[contenteditable="true"]:empty::before { content: "Stavka..."; color: var(--ink-4); }
    .item-subtext { color: var(--ink-3); font-size: 0.76rem; font-family: var(--font-mono); margin-top: 0.2rem; outline: none; }
    .item-subtext[contenteditable="true"]:empty::before { content: "Detalji..."; color: var(--ink-4); }
    
    .item-delete {
      background: none; border: none; color: var(--ink-line-2); cursor: pointer;
      font-size: 1.2rem; line-height: 1; padding: 0 0.2rem; transition: color 0.2s;
    }
    .checklist-item:hover .item-delete { color: var(--ember); opacity: 0.6; }
    .item-delete:hover { opacity: 1 !important; }

    /* Dugme za brisanje u sidebar-u */
    .sidebar-del {
      flex-shrink: 0; cursor: pointer;
      display: inline-grid; place-items: center;
      width: 28px; height: 28px; padding: 0;
      font-family: var(--font-mono); font-size: 1rem; font-weight: 600; line-height: 1;
      color: var(--ember); background: rgba(192,86,59,0.06); border: 1px solid rgba(192,86,59,0.25); border-radius: 6px;
      opacity: 0; transition: opacity 0.2s, color 0.2s, background 0.2s, border-color 0.2s, transform 0.1s;
    }
    .sidebar-item:hover .sidebar-del { opacity: 0.7; }
    .sidebar-del:hover { opacity: 1 !important; background: rgba(192,86,59,0.16); border-color: rgba(192,86,59,0.45); }
    .sidebar-del:active { transform: scale(0.85); }
    
    /* Label pill (isti stil kao priority pills na index stranici) */
    .doc-label {
      display: inline-flex; align-items: center; justify-content: center;
      height: 22px; font-family: var(--font-mono); font-size: 0.6rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0 0.45rem; border-radius: 5px; border: 1px solid;
      flex-shrink: 0; pointer-events: none;
    }
    .doc-chip {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0 0.6rem; border-radius: 6px; border: 1px solid var(--ink-line);
      color: var(--ink-4); background: transparent; cursor: pointer; user-select: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
    }
    .doc-chip:hover { background: var(--paper-3); border-color: var(--ink-line-2); color: var(--ink-3); }
    .doc-chip:active { transform: scale(0.95); }
    .doc-chip.homelab { color: var(--beacon-2); background: var(--beacon-soft); border-color: rgba(184,115,51,0.25); }
    .doc-chip.homelab:hover { background: rgba(184,115,51,0.14); border-color: var(--beacon); }
    .doc-chip.work { color: var(--azure); background: rgba(58,110,165,0.06); border-color: rgba(58,110,165,0.25); }
    .doc-chip.work:hover { background: rgba(58,110,165,0.12); border-color: var(--azure); }
    .doc-chip.personal { color: var(--signal); background: rgba(74,122,94,0.06); border-color: rgba(74,122,94,0.25); }
    .doc-chip.personal:hover { background: rgba(74,122,94,0.12); border-color: var(--signal); }
    .doc-label.homelab { color: var(--beacon-2); background: var(--beacon-soft); border-color: rgba(184,115,51,0.25); }
    .doc-label.work { color: var(--azure); background: rgba(58,110,165,0.06); border-color: rgba(58,110,165,0.25); }
    .doc-label.personal { color: var(--signal); background: rgba(74,122,94,0.06); border-color: rgba(74,122,94,0.25); }

    /* Filter bar — label pillovi za filtriranje */
    .filter-bar {
      display: flex; gap: 0.35rem; padding: 0 1.5rem 0.7rem; flex-wrap: wrap;
    }
    .filter-pill {
      display: inline-flex; align-items: center; justify-content: center;
      height: 26px; font-family: var(--font-mono); font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0 0.55rem; border-radius: 6px; border: 1px solid var(--ink-line);
      background: transparent; color: var(--ink-3); cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .filter-pill:hover { background: var(--paper-3); border-color: var(--ink-line-2); color: var(--ink); }
    .filter-pill.active { background: var(--beacon-soft); color: var(--beacon-2); border-color: var(--beacon); }
    .filter-pill.homelab { color: var(--beacon-2); }
    .filter-pill.homelab.active { background: var(--beacon-soft); border-color: var(--beacon); color: var(--beacon-2); }
    .filter-pill.work { color: var(--azure); }
    .filter-pill.work.active { background: rgba(58,110,165,0.1); border-color: var(--azure); color: var(--azure); }
    .filter-pill.personal { color: var(--signal); }
    .filter-pill.personal.active { background: rgba(74,122,94,0.1); border-color: var(--signal); color: var(--signal); }

    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--ink-4); font-style: italic; font-size: 0.9rem; }

    /* Search (pretraga) — uklapa se u note-input jezik, sa ikonom i clear dugmetom. */
    .search-wrap { position: relative; padding: 0 1.5rem; margin-top: 0.7rem; }
    .search-input {
      width: 100%; border: 1px solid var(--ink-line-2); border-radius: 9px;
      padding: 0.55rem 2rem 0.55rem 2.3rem;
      font-family: var(--font-sans); font-size: 0.9rem; color: var(--ink);
      background: var(--paper); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input::placeholder { color: var(--ink-4); }
    .search-input:focus { border-color: var(--beacon); box-shadow: 0 0 0 3px var(--beacon-soft); }
    .search-icon {
      position: absolute; left: calc(1.5rem + 0.7rem); top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 1.9;
      pointer-events: none; transition: stroke 0.2s;
    }
    .search-input:focus ~ .search-icon { stroke: var(--beacon-2); }
    .search-clear {
      position: absolute; right: calc(1.5rem + 0.55rem); top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; padding: 0;
      display: grid; place-items: center;
      background: var(--paper-3); border: 1px solid var(--ink-line); border-radius: 50%;
      color: var(--ink-3); font-size: 0.7rem; line-height: 1; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .search-clear:hover { color: var(--ember); border-color: var(--ember); }
    .search-clear[hidden] { display: none; }
    /* Meta: fiksna min-visina — rezerviše prostor da input/lista ne "skaču" pri kucanju. */
    .search-meta {
      padding: 0 1.5rem; min-height: 1.4rem;
      font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em;
      color: var(--ink-4); line-height: 1.4rem;
    }
    .sidebar-empty { padding: 1.4rem 1rem; text-align: center; color: var(--ink-4); font-style: italic; font-size: 0.86rem; }

    /* Sidebar item sa preview-om matching stavki. */
    .sidebar-item { display: block; }
    .si-top { display: flex; align-items: center; gap: 0.5rem; }
    .si-top > svg { flex: none; }
    .si-title { flex: 1; min-width: 0; }
    .si-badge {
      flex: none; font-family: var(--font-mono); font-size: 0.56rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.1rem 0.4rem; border-radius: 4px; border: 1px solid;
    }
    .si-badge.title { color: var(--azure); background: rgba(58,110,165,0.08); border-color: rgba(58,110,165,0.25); }
    .si-badge.item { color: var(--beacon-2); background: var(--beacon-soft); border-color: rgba(184,115,51,0.25); }
    html[data-theme="dark"] .si-badge.item { border-color: rgba(232,176,125,0.25); }
    .si-items { margin: 0.45rem 0 0.15rem 1.3rem; padding: 0; list-style: none;
      display: flex; flex-direction: column; gap: 0.15rem; }
    .si-item {
      font-family: var(--font-sans); font-size: 0.8rem; color: var(--ink-3); line-height: 1.4;
      padding-left: 0.75rem; position: relative;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .si-item::before {
      content: ''; position: absolute; left: 0; top: 0.55em;
      width: 4px; height: 1px; background: var(--ink-line-2);
    }
    .si-more { font-family: var(--font-mono); font-size: 0.66rem; color: var(--ink-4);
      margin: 0.1rem 0 0 2.05rem; }

    /* Highlight match-a u naslovu stavke. */
    mark.hl {
      background: var(--beacon-soft); color: var(--beacon-2); border-radius: 3px;
      padding: 0 1px; -webkit-user-select: none; user-select: none;
    }
    html[data-theme="dark"] mark.hl { color: var(--beacon); }

    /* HAMBURGER — plutajući taster gore desno (otvara push-meni). */
    .burger {
      position: fixed; top: 1rem; right: 1rem; z-index: 1001;
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px;
      width: 46px; height: 46px; padding: 11px 9px;
      background: var(--paper-3); border: 1px solid var(--ink-line-2); border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 18px -8px rgba(0,0,0,0.30);
      transition: border-color 0.2s var(--ease), background 0.3s var(--ease);
    }

  <script>
    "use strict";

    let Documents = [];
    let activeId = null;
    let query = "";
    let activeLabel = "";
    let saveTimeout = null;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    function escRe(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function copyDocument() {
      if (!activeId) return;
      const text = els.docBody.innerText || els.docBody.textContent || "";
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('button[title="Copy document"]');
        if (btn) {
          const old = btn.innerHTML;
          btn.innerHTML = "✓ Copied";
          setTimeout(() => btn.innerHTML = old, 2000);
        }
      }).catch(err => {
        alert("Greška pri kopiranju: " + err);
      });
    }

    function stripHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html || "";
      return tmp.textContent || tmp.innerText || "";
    }

    function hl(text, q) {
      const safe = esc(text || "");
      if (!q) return safe;
      try {
        const re = new RegExp(`(${escRe(q)})`, "gi");
        return safe.replace(re, '<mark class="hl">$1</mark>');
      } catch {
        return safe;
      }
    }

    function fmtDate(ts) {
      const d = new Date(ts);
      if (isNaN(d.getTime())) return "";
      const months = ["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${d.getDate()}. ${months[d.getMonth()]} ${d.getFullYear()} · ${hh}:${mm}`;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch {}
      if (!res.ok) throw new Error((json && json.error) || `HTTP ${res.status}`);
      return json;
    }

    const els = {
      sidebar: document.getElementById('sidebarList'),
      count: document.getElementById('noteCount'),
      newBtn: document.getElementById('newNoteBtn'),
      detailCol: document.getElementById('detailCol'),
      emptyCol: document.getElementById('emptyCol'),
      title: document.getElementById('detailTitle'),
      date: document.getElementById('detailDate'),
      docBody: document.getElementById('docBody'),
      searchInput: document.getElementById('searchInput'),
      searchClear: document.getElementById('searchClear'),
      searchMeta: document.getElementById('searchMeta')
    };

    function matchesSearch(doc, q) {
      if (!q) return true;
      const titleMatch = (doc.title || "").toLowerCase().includes(q);
      const bodyMatch = stripHtml(doc.body || "").toLowerCase().includes(q);
      return titleMatch || bodyMatch;
    }

    function renderSidebar() {
      const q = query;
      const labelFiltered = activeLabel ? Documents.filter(d => d.label === activeLabel) : Documents;
      const totalCount = Documents.length;
      const shownCount = labelFiltered.length;
      els.count.textContent = activeLabel ? `${shownCount} od ${totalCount}` : String(totalCount);
      els.searchMeta.textContent = q ? (Documents.length ? "Pretraga..." : "") : "";
      els.searchClear.hidden = !q;

      let visible = q ? labelFiltered.filter(d => matchesSearch(d, q)) : labelFiltered;
      els.sidebar.innerHTML = '';
      
      if (!visible.length) {
        const li = document.createElement('li');
        li.className = "sidebar-empty";
        li.textContent = q ? "Nema rezultata za „" + q + "“." : "No documents found.";
        els.sidebar.appendChild(li);
        if (q) els.searchMeta.textContent = "0 rezultata";
        return;
      }
      
      if (q) {
        els.searchMeta.textContent = `${visible.length} ${visible.length === 1 ? "rezultat" : "rezultata"}`;
      }
      
      visible.forEach(doc => {
        const li = document.createElement('li');
        li.className = `sidebar-item ${doc.id === activeId ? 'active' : ''}`;
        
        const docType = (doc.body || '').startsWith('<p>Uploaded file:') ? (doc.body.match(/\.(\w+)["']/)?.[1] || 'file') : 'note';
        const SIDEBAR_ICONS = {
          txt: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
          pdf: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="10" y1="13" x2="14" y2="13"/><path d="M8 18h8a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8v6z"/>',
          doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15h6M9 11h6M9 19h4"/>',
          image: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
          note: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
          file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
        };
        const iconSvg = SIDEBAR_ICONS[docType] || SIDEBAR_ICONS.file;
        const icon = `<svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2" style="flex-shrink: 0; opacity: 0.6;">${iconSvg}</svg>`;
        
        const labelHtml = doc.label ? `<span class="doc-label ${doc.label}">${doc.label}</span>` : '';
        
        li.innerHTML = `
          <div class="si-top" style="align-items: center; display: flex; gap: 0.4rem;">
            ${icon}
            <div style="flex:1; min-width:0;">
              <div class="si-title" style="font-weight:500;">${hl(doc.title || 'Nova bilješka', q)}</div>
            </div>
            ${labelHtml}
            <button class="sidebar-del" data-del-id="${doc.id}" title="Obriši dokument">×</button>
          </div>
        `;
        
        const delBtn = li.querySelector('.sidebar-del');
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm("Da li ste sigurni da želite obrisati ovaj dokument?")) return;
          try {
            await api(`/api/documents/${doc.id}`, { method: "DELETE" });
            Documents = Documents.filter(d => d.id !== doc.id);
            if (activeId === doc.id) {
              activeId = Documents.length ? Documents[0].id : null;
            }
            renderSidebar();
            renderDetail();
          } catch (e) {
            alert("Greška: " + e.message);
          }
        });
        
        li.onclick = () => selectDocument(doc.id);
        els.sidebar.appendChild(li);
      });
    }

    function selectDocument(id) {
      if (activeId === id) return;
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        saveTimeout = null;
        saveCurrentDocumentNow();
      }
      savedDocumentRange = null;
      activeId = id;
      renderSidebar();
      renderDetail();
    }

    async function saveCurrentDocumentNow() {
      const doc = Documents.find(d => d.id === activeId);
      if (!doc) return;
      
      const titleVal = els.title.textContent.trim() || "Untitled";
      const bodyVal = els.docBody.innerHTML;
      const labelVal = doc.label || '';
      
      if (doc.title === titleVal && doc.body === bodyVal && doc.label === labelVal) return;
      
      doc.title = titleVal;
      doc.body = bodyVal;
      doc.label = labelVal;
      doc.updatedAt = Date.now();
      
      try {
        const res = await api(`/api/documents/${doc.id}`, {
          method: "PATCH",
          body: JSON.stringify({ title: titleVal, body: bodyVal, label: labelVal })
        });
        Object.assign(doc, res.document);
        els.date.textContent = fmtDate(doc.updatedAt || doc.createdAt);
        renderSidebar();
      } catch (e) {
        console.error("Greška pri automatskom čuvanju:", e);
      }
    }

    function triggerAutoSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveCurrentDocumentNow, 1000);
    }

    function renderDetail() {
      const doc = Documents.find(d => d.id === activeId);
      if (!doc) {
        els.detailCol.style.display = 'none';
        els.emptyCol.style.display = 'flex';
        return;
      }
      els.detailCol.style.display = 'flex';
      els.emptyCol.style.display = 'none';
      
      if (els.title.textContent !== doc.title) {
        els.title.textContent = doc.title || "Untitled";
      }
      if (els.docBody.innerHTML !== doc.body) {
        els.docBody.innerHTML = doc.body || "";
      }
      els.date.textContent = fmtDate(doc.updatedAt || doc.createdAt);
      if (els.labelChip) updateLabelChip(doc.label || '');
    }

    function clearDefaultTitleIfNew() {
      const current = els.title.textContent.trim();
      if (current === "New document" || current === "Untitled") {
        els.title.textContent = "";
      }
    }

    els.title.addEventListener('focus', clearDefaultTitleIfNew);
    els.title.addEventListener('click', clearDefaultTitleIfNew);

    els.title.oninput = triggerAutoSave;
    els.docBody.oninput = triggerAutoSave;

    els.title.onblur = () => {
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        saveTimeout = null;
      }
      saveCurrentDocumentNow();
    };
    els.docBody.onblur = () => {
      if (saveTimeout) {
        clearTimeout(saveTimeout);
        saveTimeout = null;
      }
      saveCurrentDocumentNow();
    };

    // ── Upload fileova (jedno dugme, automatska detekcija tipa) ──
    const FILE_ICONS = {
      txt: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
      pdf: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="10" y1="13" x2="14" y2="13"/><path d="M8 18h8a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8v6z"/>',
      doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15h6M9 11h6M9 19h4"/>',
      image: '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
      code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
      archive: '<path d="M21 16v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      generic: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    };

    function fileTypeMeta(ext) {
      const map = {
        txt: 'txt', text: 'txt', md: 'txt', csv: 'txt', json: 'code', xml: 'code', js: 'code', ts: 'code', css: 'code', html: 'code',
        pdf: 'pdf',
        doc: 'doc', docx: 'doc', rtf: 'doc', odt: 'doc',
        jpg: 'image', jpeg: 'image', png: 'image', gif: 'image', webp: 'image', svg: 'image', bmp: 'image', ico: 'image',
        zip: 'archive', rar: 'archive', '7z': 'archive', tar: 'archive', gz: 'archive',
      };
      return map[ext] || 'generic';
    }

    function fileTypeColor(type) {
      const colors = { txt: 'type-txt', pdf: 'type-pdf', doc: 'type-doc', docx: 'type-doc', image: 'type-image', code: 'type-txt', archive: 'type-pdf', generic: '' };
      return colors[type] || '';
    }

    els.fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadIcon = document.getElementById('uploadIcon');
    const uploadLabel = document.getElementById('uploadLabel');

    uploadBtn.addEventListener('click', () => {
      els.fileInput.accept = '*/*';
      els.fileInput.value = '';
      els.fileInput.click();
    });

    els.fileInput.addEventListener('change', async () => {
      const file = els.fileInput.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();
      const type = fileTypeMeta(ext);
      const color = fileTypeColor(type);
      const icon = FILE_ICONS[type] || FILE_ICONS.generic;

      uploadBtn.className = 'upload-btn' + (color ? ' ' + color : '');
      uploadIcon.innerHTML = icon;
      uploadLabel.textContent = file.name;
      uploadBtn.style.width = '100%';

      try {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        const data = btoa(binary);

        const res = await api("/api/upload", {
          method: "POST",
          body: JSON.stringify({ name: file.name, data, type: file.type })
        });
        Documents.unshift(res.document);
        if (query) { els.searchInput.value = ''; query = ''; }
        selectDocument(res.document.id);

        // Reset button
        uploadBtn.className = 'upload-btn';
        uploadIcon.innerHTML = '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>';
        uploadLabel.textContent = 'Upload';
      } catch (e) {
        alert("Greška pri uploadu: " + e.message);
        uploadBtn.className = 'upload-btn';
        uploadIcon.innerHTML = '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>';
        uploadLabel.textContent = 'Upload';
      }
    });

    els.newBtn.onclick = async () => {
      try {
        const res = await api("/api/documents", {
          method: "POST",
          body: JSON.stringify({ title: "New document", body: "" })
        });
        Documents.unshift(res.document);
        if (query) {
          els.searchInput.value = '';
          query = '';
        }
        selectDocument(res.document.id);
        setTimeout(() => {
          els.title.focus();
          clearDefaultTitleIfNew();
        }, 50);
      } catch (e) {
        alert("Greška: " + e.message);
      }
    };

    const LABEL_CYCLE = ["", "homelab", "work", "personal"];
    els.labelChip = document.getElementById('docLabelChip');
    
    function updateLabelChip(label) {
      const chip = els.labelChip;
      chip.textContent = label ? label.toUpperCase() : "LABEL";
      chip.className = "doc-chip" + (label ? " " + label : "");
    }
    
    els.labelChip.addEventListener('click', () => {
      const doc = Documents.find(d => d.id === activeId);
      if (!doc) return;
      const idx = LABEL_CYCLE.indexOf(doc.label);
      const next = LABEL_CYCLE[(idx + 1) % LABEL_CYCLE.length];
      doc.label = next;
      updateLabelChip(next);
      renderSidebar();
      triggerAutoSave();
    });

    const textColorPicker = document.getElementById('textColorPicker');
    const textColorSwatch = document.getElementById('textColorSwatch');
    let savedDocumentRange = null;

    function saveDocumentSelection() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      let node = range.commonAncestorContainer;
      if (node && node.nodeType !== 1) node = node.parentNode;
      if (node && els.docBody && els.docBody.contains(node)) {
        savedDocumentRange = range.cloneRange();
      }
    }

    function restoreDocumentSelection() {
      const selection = window.getSelection();
      if (savedDocumentRange) {
        try {
          els.docBody.focus();
          selection.removeAllRanges();
          selection.addRange(savedDocumentRange);
          return true;
        } catch (e) {
          console.warn("Could not restore selection range:", e);
        }
      }
      if (selection && selection.rangeCount > 0) {
        let node = selection.getRangeAt(0).commonAncestorContainer;
        if (node && node.nodeType !== 1) node = node.parentNode;
        if (node && els.docBody && els.docBody.contains(node)) {
          return true;
        }
      }
      if (els.docBody) els.docBody.focus();
      return false;
    }

    function formatDocument(command, value = null) {
      restoreDocumentSelection();
      try {
        document.execCommand('styleWithCSS', false, true);
      } catch (e) {}
      document.execCommand(command, false, value);
      saveDocumentSelection();
      triggerAutoSave();
    }

    document.addEventListener('selectionchange', saveDocumentSelection);
    document.querySelectorAll('[data-format]').forEach((button) => {
      button.addEventListener('mousedown', (event) => event.preventDefault());
      button.addEventListener('click', () => formatDocument(button.dataset.format));
    });

    function colorToHex(color) {
      if (!color) return '#f4efe6';
      color = color.trim();
      if (color.startsWith('#')) {
        if (color.length === 4) {
          return '#' + color[1] + color[1] + color[2] + color[2] + color[3] + color[3];
        }
        return color;
      }
      const rgb = color.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
      if (rgb) {
        const r = parseInt(rgb[1], 10).toString(16).padStart(2, '0');
        const g = parseInt(rgb[2], 10).toString(16).padStart(2, '0');
        const b = parseInt(rgb[3], 10).toString(16).padStart(2, '0');
        return `#${r}${g}${b}`;
      }
      return '#f4efe6';
    }

    if (textColorPicker) {
      const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
      textColorPicker.value = colorToHex(inkColor);
      textColorSwatch.style.background = textColorPicker.value;

      textColorPicker.addEventListener('mousedown', () => {
        saveDocumentSelection();
      });

      const applyTextColor = () => {
        const color = textColorPicker.value;
        textColorSwatch.style.background = color;
        restoreDocumentSelection();
        try {
          document.execCommand('styleWithCSS', false, true);
        } catch (e) {}
        const ok = document.execCommand('foreColor', false, color);
        if (!ok && savedDocumentRange && !savedDocumentRange.collapsed) {
          try {
            const span = document.createElement('span');
            span.style.color = color;
            savedDocumentRange.surroundContents(span);
          } catch (e) {}
        }
        saveDocumentSelection();
        triggerAutoSave();
      };

      textColorPicker.addEventListener('input', applyTextColor);
      textColorPicker.addEventListener('change', applyTextColor);
    }

    function applyDefaultTextColor() {
      restoreDocumentSelection();
      try {
        document.execCommand('styleWithCSS', false, true);
      } catch (e) {}
      document.execCommand('removeFormat', false, 'foreColor');
      document.execCommand('foreColor', false, 'inherit');

      const selection = window.getSelection();
      if (selection && selection.rangeCount > 0) {
        const range = selection.getRangeAt(0);
        let node = range.commonAncestorContainer;
        if (node && node.nodeType !== 1) node = node.parentNode;
        if (node && els.docBody && els.docBody.contains(node)) {
          const styledElements = node.querySelectorAll ? node.querySelectorAll('span[style*="color"], font[color]') : [];
          styledElements.forEach(el => {
            el.style.color = '';
            el.removeAttribute('color');
          });
        }
      }

      const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
      if (textColorPicker) {
        textColorPicker.value = colorToHex(inkColor);
        textColorSwatch.style.background = textColorPicker.value;
      }
      saveDocumentSelection();
      triggerAutoSave();
    }

    const defaultColorBtn = document.getElementById('defaultColorBtn');
    if (defaultColorBtn) {
      defaultColorBtn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        saveDocumentSelection();
      });
      defaultColorBtn.addEventListener('click', () => {
        applyDefaultTextColor();
      });
    }

    window.addEventListener('noema-theme-change', () => {
      const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
      if (textColorPicker) {
        textColorPicker.value = colorToHex(inkColor);
        textColorSwatch.style.background = textColorPicker.value;
      }
    });

    els.searchInput.addEventListener('input', () => {
      query = els.searchInput.value.trim().toLowerCase();
      renderSidebar();
    });
    els.searchClear.addEventListener('click', () => {
      els.searchInput.value = '';
      query = '';
      renderSidebar();
      els.searchInput.focus();
    });
    els.searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && query) {
        els.searchInput.value = '';
        query = '';
        renderSidebar();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' &&
          document.activeElement.isContentEditable !== true) {
        e.preventDefault();
        els.searchInput.focus();
      }
    });

    // ── Filter po labeli ──
    els.filterBar = document.getElementById('filterBar');
    els.filterBar.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const label = btn.dataset.label;
        activeLabel = activeLabel === label ? '' : label;
        els.filterBar.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        if (activeLabel) {
          els.filterBar.querySelector(`.filter-pill[data-label="${activeLabel}"]`).classList.add('active');
        } else {
          els.filterBar.querySelector('.filter-pill[data-label=""]').classList.add('active');
        }
        renderSidebar();
      });
    });

    function getStoredTheme() {
      try { return localStorage.getItem("noema-theme"); } catch (e) { return null; }
    }
    function storeTheme(t) {
      try { localStorage.setItem("noema-theme", t); } catch (e) {}
    }
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      const icon = document.getElementById("ftIcon");
      if (icon) icon.textContent = t === "dark" ? "☀" : "☾";
    }
    applyTheme(getStoredTheme() || "dark");
    const themeBtn = document.getElementById("footerTheme");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
        storeTheme(next);
      });
    }

    let fontScale = Number(localStorage.getItem("noema-font-scale")) || 1;
    function applyFontScale(scale) {
      document.documentElement.style.fontSize = (16 * scale) + "px";
      document.body.style.fontSize = (16 * scale) + "px";
    }
    function initFontScale() {
      applyFontScale(fontScale);
      const decBtn = document.getElementById("fontDec");
      const incBtn = document.getElementById("fontInc");
      const resBtn = document.getElementById("fontReset");
      if (decBtn) decBtn.addEventListener("click", () => {
        fontScale = Math.max(0.4, fontScale - 0.3);
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
      if (incBtn) incBtn.addEventListener("click", () => {
        fontScale = Math.min(2.5, fontScale + 0.3);
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
      if (resBtn) resBtn.addEventListener("click", () => {
        fontScale = 1;
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
    }
    initFontScale();

    function fmtGB(bytes) { return (bytes / 1073741824).toFixed(1); }
    async function loadSystem() {
      const el = document.getElementById("sysStats");
      if (!el) return;
      try {
        const res = await fetch("/api/system");
        if (!res.ok) throw new Error();
        const data = await res.json();
        const cpu = data.cpu ? `${data.cpu.percent}%` : "—";
        const ram = data.mem ? `${data.mem.percent}%` : "—";
        const disk = data.disk ? `${data.disk.percent}%` : "—";
        el.innerHTML = `CPU: <b>${cpu}</b> · RAM: <b>${ram}</b> · Disk: <b>${disk}</b>`;
        const parts = [];
        if (data.cpu) parts.push(`CPU ${data.cpu.cores} jezgara`);
        if (data.mem) parts.push(`RAM ${fmtGB(data.mem.used)}/${fmtGB(data.mem.total)} GB`);
        if (data.disk) parts.push(`Disk ${fmtGB(data.disk.used)}/${fmtGB(data.disk.total)} GB`);
        el.title = parts.join(" · ") || "Resursi servera";
      } catch (err) {
        el.innerHTML = `<span style="font-style:italic">sistem nedostupan</span>`;
      }
    }
    loadSystem();
    setInterval(loadSystem, 5000);

    async function load() {
      try {
        const res = await api("/api/documents");
        Documents = (res && res.documents) || [];
        renderSidebar();
        if (Documents.length > 0) {
          selectDocument(Documents[0].id);
        } else {
          renderDetail();
        }
      } catch (err) {
        Documents = [];
        renderSidebar();
        renderDetail();
      }
    }

    load();

    // ── Push-meni (port "Salient reveal" iz the original portfolio) ──
    function initMenu() {
      const burger = document.getElementById("mobileBurger");
      const overlay = document.getElementById("mobileMenu");
      const closeBtn = document.getElementById("closeMobile");
      if (!burger || !overlay) return;

      // Umotaj cijelu stranicu u #shell (karticu); meni izvuci IZA kartice.
      const shell = document.createElement("div");
      shell.id = "shell";
      const inner = document.createElement("div");
      inner.id = "shell-inner";
      while (document.body.firstChild) inner.appendChild(document.body.firstChild);
      shell.appendChild(inner);
      const scrim = document.createElement("div");
      scrim.className = "shell-scrim";
      scrim.setAttribute("aria-hidden", "true");
      shell.appendChild(scrim);
      document.body.appendChild(shell);
      document.body.appendChild(overlay); // meni iza kartice (niži z-index)

      let sy = 0, unfixTimer = null;
      const setExpanded = (o) => burger.setAttribute("aria-expanded", o ? "true" : "false");

      function open() {
        if (unfixTimer) { clearTimeout(unfixTimer); unfixTimer = null; }
        if (!document.body.classList.contains("menu-fixed")) {
          sy = window.scrollY || window.pageYOffset || 0;
          inner.style.transform = "translateY(" + (-sy) + "px)";
          document.body.classList.add("menu-fixed");
          void shell.offsetWidth; // reflow da se .8s transform animira iz mira
        }
        requestAnimationFrame(() => {
          document.body.classList.add("menu-pushed");
          overlay.classList.add("is-open");
        });
        setExpanded(true);
      }
      function close() {
        overlay.classList.remove("is-open");
        document.body.classList.remove("menu-pushed");
        setExpanded(false);
        if (unfixTimer) clearTimeout(unfixTimer);
        unfixTimer = setTimeout(() => {
          document.body.classList.remove("menu-fixed");
          inner.style.transform = "";
          window.scrollTo(0, sy);
          unfixTimer = null;
        }, 850);
      }

      burger.addEventListener("click", open);
      closeBtn.addEventListener("click", close);
      scrim.addEventListener("click", close);
      overlay.querySelectorAll("a").forEach((l) => {
        l.addEventListener("click", (e) => {
          const href = l.getAttribute("href");
          const target = l.getAttribute("target");
          if (!href || href === "#" || target === "_blank") {
            close();
            return;
          }
          e.preventDefault();
          close();
          setTimeout(() => {
            window.location.href = href;
          }, 850);
        });
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.body.classList.contains("menu-pushed")) close();
      });
    }

    initMenu();
  </script>
