<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Noema — Files</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="A private file library inside Noema.">
  <script>
    (() => {
      try {
        const manual = localStorage.getItem("noema-theme-manual");
        const hour = new Date().getHours();
        document.documentElement.dataset.theme = manual === "dark" || manual === "light" ? manual : (hour >= 19 || hour < 7 ? "dark" : "light");
      } catch {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f7f3ec;--paper-2:#fbf8f2;--paper-3:#fff;--ink:#1a1a1f;--ink-2:#3d3d44;--ink-3:#6b6b73;--ink-4:#9b958a;--line:rgba(26,26,31,.1);--line-2:rgba(26,26,31,.18);--beacon:#b87333;--beacon-2:#9c6029;--beacon-soft:rgba(184,115,51,.08);--ember:#c0563b;--display:'Fraunces',Georgia,serif;--sans:'Geist',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--maxw:1100px;--gut:clamp(1.25rem,4vw,2.5rem);color-scheme:light}
    html[data-theme="dark"]{--paper:#0a0a0c;--paper-2:#0f0f12;--paper-3:#16161b;--ink:#f4efe6;--ink-2:#d8d2c4;--ink-3:#9b958a;--ink-4:#5c574f;--line:rgba(244,239,230,.08);--line-2:rgba(244,239,230,.14);--beacon:#e8b07d;--beacon-2:#d4a574;--beacon-soft:rgba(232,176,125,.1);--ember:#d97757;color-scheme:dark}
    *{box-sizing:border-box;margin:0;padding:0}html{background:var(--paper);-webkit-font-smoothing:antialiased}body{min-height:100vh;background:var(--paper);color:var(--ink-2);font:16px/1.6 var(--sans)}button,input,textarea{font:inherit}.wrap{max-width:var(--maxw);margin:auto;padding:var(--gut)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:clamp(1.4rem,4vw,2.2rem);padding-right:3.5rem}.back{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .7rem;border:1px solid var(--line);border-radius:8px;color:var(--ink-3);font:.78rem var(--mono);text-decoration:none}.back:hover{color:var(--beacon);border-color:var(--line-2)}h1{color:var(--ink);font:300 clamp(1.4rem,4vw,2rem) var(--display)}
    .grid{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr);gap:1.5rem;align-items:start}.column{display:flex;min-height:520px;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--paper-2)}.column.detail{border-color:var(--line-2);box-shadow:0 8px 32px -20px rgba(184,115,51,.35)}.column.detail:before{content:"";height:3px;background:linear-gradient(90deg,var(--beacon-2),var(--beacon),var(--beacon-2))}
    .head{padding:1.2rem 1.5rem .85rem;border-bottom:1px solid var(--line)}.head h2{color:var(--ink);font:500 1.5rem/1 var(--display)}.head p{margin-top:.45rem;color:var(--ink-3);font:.72rem var(--mono)}.count{display:inline-flex;margin-top:.6rem;padding:.25rem .6rem;border-radius:99px;background:var(--paper-3);color:var(--ink-3);font:.68rem var(--mono)}.count b{margin-right:.35rem;color:var(--ink)}
    .search{padding:.8rem 1.5rem 0}.input,.textarea{width:100%;padding:.65rem .8rem;border:1px solid var(--line-2);border-radius:9px;outline:0;background:var(--paper);color:var(--ink)}.input:focus,.textarea:focus{border-color:var(--beacon);box-shadow:0 0 0 3px var(--beacon-soft)}.textarea{min-height:190px;resize:vertical;line-height:1.6}.list{display:flex;flex-direction:column;gap:.35rem;padding:.85rem 1.5rem;list-style:none}.item{display:flex;align-items:center;justify-content:space-between;gap:.65rem;padding:.62rem .75rem;border:1px solid transparent;border-radius:8px;cursor:pointer;color:var(--ink-2)}.item:hover{border-color:var(--line);background:var(--paper-3)}.item.active{border-color:color-mix(in srgb,var(--beacon) 30%,transparent);background:var(--beacon-soft);color:var(--beacon-2)}.item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-size{flex:none;color:var(--ink-4);font:.62rem var(--mono)}
    .side-actions{margin-top:auto;padding:1rem 1.5rem 1.3rem;border-top:1px solid var(--line)}.content{display:grid;gap:1rem;padding:1.25rem 1.5rem}.label{display:block;margin-bottom:.4rem;color:var(--ink-4);font:600 .62rem var(--mono);letter-spacing:.07em;text-transform:uppercase}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}.meta-card{min-width:0;padding:.72rem .82rem;border:1px solid var(--line);border-radius:9px;background:var(--paper-3)}.meta-key{color:var(--ink-4);font:.6rem var(--mono);letter-spacing:.06em;text-transform:uppercase}.meta-value{margin-top:.2rem;overflow:hidden;color:var(--ink);font-size:.84rem;text-overflow:ellipsis;white-space:nowrap}
    .toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:auto;padding:.8rem 1.5rem 1.2rem;border-top:1px solid var(--line);background:var(--paper-3)}.button{display:inline-flex;align-items:center;justify-content:center;padding:.38rem .72rem;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--ink-2);cursor:pointer;text-decoration:none}.button:hover{border-color:var(--line-2);color:var(--beacon)}.button.primary{border-color:var(--beacon);background:var(--beacon-soft);color:var(--beacon-2);font-weight:500}.button.primary:hover{background:var(--beacon);color:var(--paper)}.button.danger{color:var(--ember)}.button:disabled{opacity:.45;pointer-events:none}.empty{padding:2.5rem 1rem;text-align:center;color:var(--ink-4);font-style:italic}.status{min-height:1.3rem;padding:0 1.5rem .8rem;color:var(--ink-3);font:.7rem var(--mono)}.status.error{color:var(--ember)}.hidden{display:none!important}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.column{min-height:0}.column.detail{min-height:480px}}@media(max-width:560px){.meta{grid-template-columns:1fr}.wrap{padding:1rem}.top{padding-right:3.5rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="back" href="/">← Noema</a><h1>Files</h1><span></span></div>
    <section class="grid" aria-label="File library">
      <aside class="column">
        <header class="head"><h2>Files</h2><p>Private file library</p><span class="count"><b id="count">0</b> files</span></header>
        <div class="search"><input class="input" id="search" type="search" placeholder="Search files…" autocomplete="off"></div>
        <ul class="list" id="list"></ul>
        <div class="empty" id="listEmpty">No files yet.</div>
        <div class="side-actions"><button class="button primary" id="upload" type="button">Upload file</button><input class="hidden" id="uploadInput" type="file"></div>
      </aside>
      <article class="column detail">
        <header class="head"><h2 id="heading">Select a file</h2><p id="subheading">Choose a file from the list or upload a new one.</p></header>
        <div class="empty" id="detailEmpty">File details will appear here.</div>
        <div class="hidden" id="detail">
          <div class="content">
            <label><span class="label">File name</span><input class="input" id="name" maxlength="240"></label>
            <label><span class="label">Description</span><textarea class="textarea" id="description" maxlength="8000" placeholder="Add a short description, project reference, revision, or note…"></textarea></label>
            <div class="meta"><div class="meta-card"><div class="meta-key">Type</div><div class="meta-value" id="type">—</div></div><div class="meta-card"><div class="meta-key">Size</div><div class="meta-value" id="size">—</div></div><div class="meta-card"><div class="meta-key">Updated</div><div class="meta-value" id="updated">—</div></div></div>
          </div>
          <div class="status" id="status"></div>
          <div class="toolbar"><button class="button primary" id="save">Save changes</button><button class="button" id="open">Open</button><button class="button" id="download">Download</button><button class="button" id="copy">Copy link</button><button class="button" id="replace">Replace file</button><button class="button danger" id="remove">Delete</button><input class="hidden" id="replaceInput" type="file"></div>
        </div>
      </article>
    </section>
  </main>
  <script src="/noema-header-footer.js"></script>
  <script>
    (()=>{
      "use strict";
      const state={files:[],selected:"",busy:false};
      const $=id=>document.getElementById(id);
      const els={count:$("count"),search:$("search"),list:$("list"),listEmpty:$("listEmpty"),upload:$("upload"),uploadInput:$("uploadInput"),heading:$("heading"),subheading:$("subheading"),detailEmpty:$("detailEmpty"),detail:$("detail"),name:$("name"),description:$("description"),type:$("type"),size:$("size"),updated:$("updated"),status:$("status"),save:$("save"),open:$("open"),download:$("download"),copy:$("copy"),replace:$("replace"),replaceInput:$("replaceInput"),remove:$("remove")};
      const escape=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
      const selected=()=>state.files.find(file=>file.id===state.selected)||null;
      const formatBytes=bytes=>{const value=Number(bytes)||0;if(value<1024)return `${value} B`;const units=["KB","MB","GB"];let size=value/1024,index=0;while(size>=1024&&index<units.length-1){size/=1024;index++}return `${size>=10?size.toFixed(1):size.toFixed(2)} ${units[index]}`};
      const formatDate=value=>value?new Intl.DateTimeFormat(undefined,{dateStyle:"medium",timeStyle:"short"}).format(new Date(value)):"—";
      function setStatus(message="",error=false){els.status.textContent=message;els.status.classList.toggle("error",error)}
      function setBusy(value){state.busy=value;[els.upload,els.save,els.open,els.download,els.copy,els.replace,els.remove].forEach(button=>button.disabled=value)}
      async function api(path,options={}){const response=await fetch(path,{headers:{Accept:"application/json",...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})},...options});const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw new Error(data.error||`Request failed (${response.status})`);return data}
      function renderList(){const query=els.search.value.trim().toLowerCase();const files=state.files.filter(file=>`${file.name} ${file.description}`.toLowerCase().includes(query));els.count.textContent=state.files.length;els.listEmpty.hidden=files.length>0;els.list.innerHTML=files.map(file=>`<li class="item ${file.id===state.selected?"active":""}" data-id="${escape(file.id)}"><span class="item-name">${escape(file.name)}</span><span class="item-size">${escape(formatBytes(file.size))}</span></li>`).join("")}
      function renderDetail(){const file=selected();els.detailEmpty.hidden=Boolean(file);els.detail.classList.toggle("hidden",!file);if(!file){els.heading.textContent="Select a file";els.subheading.textContent="Choose a file from the list or upload a new one.";return}els.heading.textContent=file.name;els.subheading.textContent=file.description||"Stored in the private Noema file library.";els.name.value=file.name;els.description.value=file.description||"";els.type.textContent=file.mimeType||"application/octet-stream";els.size.textContent=formatBytes(file.size);els.updated.textContent=formatDate(file.updatedAt);setStatus()}
      function select(id){state.selected=id;const url=new URL(location.href);if(id)url.searchParams.set("open",id);else url.searchParams.delete("open");history.replaceState(null,"",url);renderList();renderDetail()}
      async function load(){try{const data=await api("/api/files");state.files=data.files||[];const requested=new URLSearchParams(location.search).get("open");select(state.files.some(file=>file.id===requested)?requested:(state.files[0]?.id||""))}catch(error){els.listEmpty.textContent=error.message;els.listEmpty.hidden=false}}
      function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("The file could not be read."));reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");reader.readAsDataURL(file)})}
      async function uploadFile(file,replace=false){if(!file)return;setBusy(true);setStatus(replace?"Replacing file…":"Uploading file…");try{const data=await fileToBase64(file);const current=selected();const result=await api(replace?`/api/files/${encodeURIComponent(current.id)}/replace`:"/api/files",{method:"POST",body:JSON.stringify({name:file.name,mimeType:file.type||"application/octet-stream",data})});if(replace)state.files=state.files.map(item=>item.id===result.file.id?result.file:item);else state.files.unshift(result.file);select(result.file.id);setStatus(replace?"File replaced.":"File uploaded.")}catch(error){setStatus(error.message,true)}finally{setBusy(false);els.uploadInput.value="";els.replaceInput.value=""}}
      els.search.addEventListener("input",renderList);els.list.addEventListener("click",event=>{const item=event.target.closest("[data-id]");if(item)select(item.dataset.id)});els.upload.addEventListener("click",()=>els.uploadInput.click());els.uploadInput.addEventListener("change",()=>uploadFile(els.uploadInput.files[0]));els.replace.addEventListener("click",()=>els.replaceInput.click());els.replaceInput.addEventListener("change",()=>uploadFile(els.replaceInput.files[0],true));
      els.save.addEventListener("click",async()=>{const file=selected();if(!file)return;setBusy(true);try{const result=await api(`/api/files/${encodeURIComponent(file.id)}`,{method:"PATCH",body:JSON.stringify({name:els.name.value,description:els.description.value})});state.files=state.files.map(item=>item.id===result.file.id?result.file:item);select(result.file.id);setStatus("Changes saved.")}catch(error){setStatus(error.message,true)}finally{setBusy(false)}});
      els.open.addEventListener("click",()=>{const file=selected();if(file)window.open(`/api/files/${encodeURIComponent(file.id)}/content`,"_blank","noopener")});els.download.addEventListener("click",()=>{const file=selected();if(file)location.href=`/api/files/${encodeURIComponent(file.id)}/content?download=1`});els.copy.addEventListener("click",async()=>{const file=selected();if(!file)return;const url=new URL(location.href);url.searchParams.set("open",file.id);try{await navigator.clipboard.writeText(url.href);setStatus("Link copied.")}catch{setStatus("Copy the URL from the address bar.",true)}});
      els.remove.addEventListener("click",async()=>{const file=selected();if(!file||!confirm(`Delete “${file.name}”?`))return;setBusy(true);try{await api(`/api/files/${encodeURIComponent(file.id)}`,{method:"DELETE"});state.files=state.files.filter(item=>item.id!==file.id);select(state.files[0]?.id||"")}catch(error){setStatus(error.message,true)}finally{setBusy(false)}});
      load();
    })();
  </script>
</body>
</html>
