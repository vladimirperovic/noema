<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noema — Notes</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Noema bilješke — kratki zapisi, naslov i sadržaj.">

  <!-- Tema prije paint-a (ista logika kao na početnoj). -->
  <script>
    (function () {
      try {
        var manual = localStorage.getItem("noema-theme-manual");
        var hour = new Date().getHours();
        var autoTheme = (hour >= 19 || hour < 7) ? "dark" : "light";
        var t = (manual === "dark" || manual === "light") ? manual : autoTheme;
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f7f3ec; --paper-2: #fbf8f2; --paper-3: #ffffff;
      --ink-line: rgba(26,26,31,0.10); --ink-line-2: rgba(26,26,31,0.18);
      --ink: #1a1a1f; --ink-2: #3d3d44; --ink-3: #6b6b73; --ink-4: #9b958a;
      --beacon: #b87333; --beacon-2: #9c6029; --beacon-glow: rgba(184,115,51,0.16); --beacon-soft: rgba(184,115,51,0.08);
      --signal: #4a7a5e; --ember: #c0563b; --azure: #3a6ea5;
      --font-display: 'Fraunces', Georgia, serif;
      --font-sans: 'Geist', -apple-system, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ocm-ease: cubic-bezier(.15, .2, .1, 1);
      --maxw: 1100px;
      --gut: clamp(1.25rem, 4vw, 2.5rem);
    }
    html[data-theme="dark"] {
      --paper: #0a0a0c; --paper-2: #0f0f12; --paper-3: #16161b;
      --ink-line: rgba(244,239,230,0.08); --ink-line-2: rgba(244,239,230,0.14);
      --ink: #f4efe6; --ink-2: #d8d2c4; --ink-3: #9b958a; --ink-4: #5c574f;
      --beacon: #e8b07d; --beacon-2: #d4a574; --beacon-glow: rgba(232,176,125,0.22); --beacon-soft: rgba(232,176,125,0.10);
      --signal: #8ab4a1; --ember: #d97757; --azure: #7fa7d9;
    }
    :root { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    html { background: var(--paper); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
      color: var(--ink-2); background: var(--paper); min-height: 100vh;
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
      opacity: 0;
      animation: pageFadeIn 0.6s var(--ocm-ease) forwards;
    }
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::selection { background: var(--beacon); color: var(--paper); }

    .wrap { max-width: var(--maxw); margin: 0 auto; padding: clamp(1.25rem,4vw,2.5rem); }

    /* Top bar */
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      margin-bottom: clamp(1.4rem,4vw,2.2rem);
    }
    .back {
      display: inline-flex; align-items: center; gap: 0.5em; text-decoration: none;
      color: var(--ink-3); font-family: var(--font-mono); font-size: 0.78rem;
      letter-spacing: 0.04em; padding: 0.4rem 0.7rem 0.4rem 0.5rem; border-radius: 8px;
      border: 1px solid var(--ink-line); transition: color 0.2s, border-color 0.2s;
    }
    .back:hover { color: var(--beacon-2); border-color: var(--ink-line-2); }
    .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .top-title { font-family: var(--font-display); font-weight: 300; font-size: clamp(1.4rem,4vw,2rem); color: var(--ink); }
    /* burger-clearance: reserve room for the fixed burger so the title never sits under it. */
    @media (max-width: 1160px) { .top { padding-right: 3.5rem; } }
    .theme-toggle {
      background: var(--paper-3); border: 1px solid var(--ink-line-2); color: var(--ink-3);
      width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 1.05rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .theme-toggle:hover { color: var(--beacon-2); border-color: var(--beacon); }

    /* Layout: lista naslova (1/3) | checklist (2/3) */
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .column {
      display: flex; flex-direction: column;
      background: var(--paper-2); border: 1px solid var(--ink-line);
      border-radius: 18px; overflow: hidden;
    }
    .column.is-feature { border-color: var(--ink-line-2); box-shadow: 0 8px 32px -16px var(--beacon-glow); }
    .column.is-feature::before {
      content: ''; display: block; height: 3px;
      background: linear-gradient(90deg, var(--beacon-2), var(--beacon), var(--beacon-2));
    }
    .column-head { padding: 1.2rem 1.5rem 0.85rem; border-bottom: 1px solid var(--ink-line); }
    .col-title {
      font-family: var(--font-display); font-weight: 500; font-size: 1.5rem;
      color: var(--ink); letter-spacing: -0.01em; line-height: 1; outline: none;
    }
    .col-sub { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-3); margin-top: 0.45rem; }
    .col-count {
      margin-top: 0.6rem; display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-3);
      background: rgba(26,26,31,0.04); padding: 0.25rem 0.6rem; border-radius: 100px;
    }
    html[data-theme="dark"] .col-count { background: rgba(244,239,230,0.05); }
    .col-count .num { color: var(--ink); font-weight: 600; }

    /* Dugmad i inputi */
    .field-label {
      font-family: var(--font-mono); font-size: 0.64rem; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 0.4rem;
    }
    .note-input {
      width: 100%; border: 1px solid var(--ink-line-2); border-radius: 9px;
      padding: 0.6rem 0.8rem; font-family: var(--font-sans); font-size: 0.95rem;
      color: var(--ink); background: var(--paper); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .note-input::placeholder { color: var(--ink-4); }
    .note-input:focus { border-color: var(--beacon); box-shadow: 0 0 0 3px var(--beacon-soft); }
    .note-submit {
      align-self: flex-start;
      border: 1px solid var(--beacon); background: var(--beacon-soft); color: var(--beacon-2);
      border-radius: 9px; padding: 0.6rem 1.1rem; font-family: var(--font-sans); font-weight: 600;
      font-size: 0.9rem; cursor: pointer; white-space: nowrap;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.1s;
    }
    .note-submit:hover { background: var(--beacon); color: var(--paper); }
    .note-submit:active { transform: scale(0.97); }
    .note-submit:disabled { opacity: 0.5; cursor: default; }

    /* Lista sa lijeve strane (Naslovi) */
    .sidebar-list { list-style: none; padding: 0.9rem 1.5rem 0.5rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .sidebar-item {
      padding: 0.6rem 0.8rem; border-radius: 8px; cursor: pointer;
      font-family: var(--font-sans); font-size: 0.95rem; color: var(--ink-2);
      border: 1px solid transparent; transition: background 0.2s, color 0.2s, border-color 0.2s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .sidebar-item:hover { background: var(--paper-3); border-color: var(--ink-line); color: var(--ink); }
    .sidebar-item.active { background: var(--beacon-soft); color: var(--beacon-2); border-color: rgba(184,115,51,0.2); font-weight: 500; }
    html[data-theme="dark"] .sidebar-item.active { border-color: rgba(232,176,125,0.2); }

    /* Checklist desno */
    .checklist-form { display: flex; gap: 0.6rem; padding: 1.1rem 1.5rem; }
    .checklist-list { list-style: none; padding: 0 1.5rem 1.4rem; display: flex; flex-direction: column; gap: 0.5rem; }
    
    .checklist-item {
      display: flex; gap: 0.8rem; align-items: flex-start;
      padding: 0.8rem 1rem; background: var(--paper-3);
      border: 1px solid var(--ink-line); border-radius: 9px;
      transition: border-color 0.2s;
    }
    .checklist-item:hover { border-color: var(--ink-line-2); }
    .checklist-item.completed { opacity: 0.6; }
    .checklist-item.completed .item-text { text-decoration: line-through; color: var(--ink-3); }
    
    .item-checkbox {
      margin-top: 0.25rem; width: 16px; height: 16px; cursor: pointer; accent-color: var(--beacon);
    }
    .item-content { flex: 1; display: flex; flex-direction: column; }
    .item-text { color: var(--ink); font-size: 0.95rem; outline: none; }
    .item-text[contenteditable="true"]:empty::before { content: "Item..."; color: var(--ink-4); }
    .item-subtext { color: var(--ink-3); font-size: 0.76rem; font-family: var(--font-mono); margin-top: 0.2rem; outline: none; }
    .item-subtext[contenteditable="true"]:empty::before { content: "Details..."; color: var(--ink-4); }
    
    .item-delete {
      background: none; border: none; color: var(--ink-line-2); cursor: pointer;
      font-size: 1.2rem; line-height: 1; padding: 0 0.2rem; transition: color 0.2s;
    }
    .checklist-item:hover .item-delete { color: var(--ember); opacity: 0.6; }
    .item-delete:hover { opacity: 1 !important; }

    .note-delete-btn {
      display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0;
      font-family: var(--font-mono); font-size: 1.1rem; font-weight: 600; line-height: 1;
      color: var(--ember); background: rgba(192,86,59,0.06); border: 1px solid rgba(192,86,59,0.25); border-radius: 8px;
      cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }
    .note-delete-btn:hover { background: rgba(192,86,59,0.16); border-color: rgba(192,86,59,0.45); }
    .note-delete-btn:active { transform: scale(0.9); }

    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--ink-4); font-style: italic; font-size: 0.9rem; }

    /* Search (pretraga) — uklapa se u note-input jezik, sa ikonom i clear dugmetom. */
    .search-wrap { position: relative; padding: 0 1.5rem; margin-top: 0.7rem; }
    .search-input {
      width: 100%; border: 1px solid var(--ink-line-2); border-radius: 9px;
      padding: 0.55rem 2rem 0.55rem 2.3rem;
      font-family: var(--font-sans); font-size: 0.9rem; color: var(--ink);
      background: var(--paper); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input::placeholder { color: var(--ink-4); }
    .search-input:focus { border-color: var(--beacon); box-shadow: 0 0 0 3px var(--beacon-soft); }
    .search-icon {
      position: absolute; left: calc(1.5rem + 0.7rem); top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 1.9;
      pointer-events: none; transition: stroke 0.2s;
    }
    .search-input:focus ~ .search-icon { stroke: var(--beacon-2); }
    .search-clear {
      position: absolute; right: calc(1.5rem + 0.55rem); top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; padding: 0;
      display: grid; place-items: center;
      background: var(--paper-3); border: 1px solid var(--ink-line); border-radius: 50%;
      color: var(--ink-3); font-size: 0.7rem; line-height: 1; cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .search-clear:hover { color: var(--ember); border-color: var(--ember); }
    .search-clear[hidden] { display: none; }
    /* Meta: fiksna min-visina — rezerviše prostor da input/lista ne "skaču" pri kucanju. */
    .search-meta {
      padding: 0 1.5rem; min-height: 1.4rem;
      font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.04em;
      color: var(--ink-4); line-height: 1.4rem;
    }
    .sidebar-empty { padding: 1.4rem 1rem; text-align: center; color: var(--ink-4); font-style: italic; font-size: 0.86rem; }

    /* Sidebar item sa preview-om matching stavki. */
    .sidebar-item { display: block; }
    .si-top { display: flex; align-items: center; gap: 0.5rem; }
    .si-top > svg { flex: none; }
    .si-title { flex: 1; min-width: 0; }
    .si-badge {
      flex: none; font-family: var(--font-mono); font-size: 0.56rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.1rem 0.4rem; border-radius: 4px; border: 1px solid;
    }
    .si-badge.title { color: var(--azure); background: rgba(58,110,165,0.08); border-color: rgba(58,110,165,0.25); }
    .si-badge.item { color: var(--beacon-2); background: var(--beacon-soft); border-color: rgba(184,115,51,0.25); }
    html[data-theme="dark"] .si-badge.item { border-color: rgba(232,176,125,0.25); }
    .si-items { margin: 0.45rem 0 0.15rem 1.3rem; padding: 0; list-style: none;
      display: flex; flex-direction: column; gap: 0.15rem; }
    .si-item {
      font-family: var(--font-sans); font-size: 0.8rem; color: var(--ink-3); line-height: 1.4;
      padding-left: 0.75rem; position: relative;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .si-item::before {
      content: ''; position: absolute; left: 0; top: 0.55em;
      width: 4px; height: 1px; background: var(--ink-line-2);
    }
    .si-more { font-family: var(--font-mono); font-size: 0.66rem; color: var(--ink-4);
      margin: 0.1rem 0 0 2.05rem; }

    /* Highlight match-a u naslovu stavke. */
    mark.hl {
      background: var(--beacon-soft); color: var(--beacon-2); border-radius: 3px;
      padding: 0 1px; -webkit-user-select: none; user-select: none;
    }
    html[data-theme="dark"] mark.hl { color: var(--beacon); }

    /* FOOTER (slim) */
    .footer {
      max-width: var(--maxw); margin: 0 auto; padding: 1.75rem clamp(1.25rem, 4vw, 2.5rem) 3rem;
      border-top: 1px solid var(--ink-line);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-4);
    }
    .footer code {
      color: var(--beacon-2); background: var(--beacon-soft);
      padding: 0.08rem 0.35rem; border-radius: 4px;
    }
    .footer em { font-family: var(--font-display); font-style: italic; color: var(--beacon); }
    .footer-left { display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .footer .sys-sep { color: var(--ink-line-2); }
    .footer .sys-stats { color: var(--ink-4); letter-spacing: 0.01em; }
    .footer .sys-stats b { color: var(--beacon-2); font-weight: 600; }
    .footer .gw-status { display: inline-flex; align-items: center; gap: 0.4rem; }
    .footer .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .footer .on { color: var(--signal); }
    .footer .off { color: var(--ink-4); }

    .footer-theme {
      background: none; border: 1px solid var(--ink-line); cursor: pointer; color: var(--ink-4);
      font-family: var(--font-mono); font-size: 1rem; line-height: 1;
      display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 8px;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease);
    }
    .footer-theme:hover { color: var(--beacon); border-color: var(--beacon); background: var(--beacon-soft); }
  /* HAMBURGER — plutajući taster gore desno (otvara push-meni). */
    .burger {
      position: fixed; top: 1rem; right: 1rem; z-index: 1001;
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px;
      width: 46px; height: 46px; padding: 11px 9px;
      background: var(--paper-3); border: 1px solid var(--ink-line-2); border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 18px -8px rgba(0,0,0,0.30);
      transition: border-color 0.2s var(--ease), background 0.3s var(--ease);
    }
    .burger:hover { border-color: var(--beacon); }
    .burger span { display: block; width: 24px; height: 2px; background: var(--ink); border-radius: 2px; transition: all 0.3s var(--ocm-ease); }
    .burger span:last-child { width: 16px; }

    /* PUSH MENU — page card se gurne lijevo + 3D rotira, otkriva tamni meni
       (port iz the original portfolio "Salient reveal"). */
    #shell {
      position: relative; z-index: 2; min-height: 100vh; background: var(--paper);
      transform-origin: center center;
      transition: transform .8s var(--ocm-ease), border-radius .8s var(--ocm-ease), box-shadow .8s var(--ocm-ease);
    }
    body.menu-fixed { overflow: hidden; }
    body.menu-fixed #shell {
      position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100dvh;
      overflow: hidden; border-radius: 18px;
    }
    body.menu-pushed #shell {
      transform: perspective(1400px) translateX(-50vw) rotateY(11deg) scale(.84);
      box-shadow: 0 0 90px rgba(0,0,0,.55), 0 30px 60px rgba(0,0,0,.4);
      will-change: transform;
    }
    .shell-scrim {
      position: absolute; inset: 0; background: rgba(14,14,16,.30);
      opacity: 0; visibility: hidden;
      transition: opacity .8s var(--ocm-ease), visibility .8s var(--ocm-ease);
      z-index: 50000; cursor: pointer;
    }
    body.menu-pushed .shell-scrim { opacity: 1; visibility: visible; }

    .menu-overlay {
      box-sizing: border-box; position: fixed; inset: 0; z-index: 1;
      background: #0e0e10; color: #f5f1ea;
      display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
      text-align: right; padding: clamp(70px,11vh,110px) clamp(24px,7vw,48px);
    }
    .menu-close {
      position: absolute; top: 30px; right: 26px; background: none; border: none;
      color: #f5f1ea; cursor: pointer; padding: 10px; opacity: 0;
      transform: translateX(20px) rotate(-90deg);
      transition: opacity .8s var(--ocm-ease) .15s, transform .8s var(--ocm-ease) .15s;
    }
    .menu-overlay.is-open .menu-close { opacity: .6; transform: translateX(0) rotate(0); }
    .menu-close:hover { opacity: 1 !important; transform: rotate(90deg); }
    .menu-close svg { width: 28px; height: 28px; stroke-width: 1.5; }

    .menu-eyebrow {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .38em; text-transform: uppercase;
      color: #d7b584; margin-bottom: clamp(16px,3.5vh,26px);
      opacity: 0; transform: translateX(40px);
      transition: opacity .8s var(--ocm-ease), transform .8s var(--ocm-ease);
    }
    .menu-overlay.is-open .menu-eyebrow { opacity: 1; transform: translateX(0); }

    .menu-nav { display: flex; flex-direction: column; align-items: flex-end; gap: clamp(3px,1.1vh,10px); }
    .menu-link {
      font-family: var(--font-display); font-size: clamp(16px,3vw,20px); font-weight: 300; line-height: 1.1;
      color: #f5f1ea; text-decoration: none; opacity: 0; transform: translateX(40px);
      transition: opacity .8s var(--ocm-ease), transform .8s var(--ocm-ease), color .25s;
    }
    .menu-link .ml-tag { color: #6f6a62; font-family: var(--font-mono); font-size: 0.42em; letter-spacing: 0.1em; text-transform: uppercase; margin-left: 0.7em; }
    .menu-link:hover { color: #d7b584; }
    .menu-overlay.is-open .menu-link { opacity: 1; transform: translateX(0); }
    .menu-link:nth-child(1){transition-delay:.10s}
    .menu-link:nth-child(2){transition-delay:.14s}
    .menu-link:nth-child(3){transition-delay:.18s}
    .menu-link:nth-child(4){transition-delay:.22s}
    .menu-link:nth-child(5){transition-delay:.26s}
    .menu-link:nth-child(6){transition-delay:.30s}
    .menu-link:nth-child(7){transition-delay:.34s}
    .menu-link:nth-child(8){transition-delay:.38s}
    .menu-link:nth-child(9){transition-delay:.42s}
    .menu-archive {
      margin-top: clamp(14px,3.5vh,26px); display: inline-flex; align-items: center; gap: 0.55em;
      align-self: flex-end; font-family: var(--font-display); font-size: clamp(15px,2.5vw,17px);
      font-weight: 300; color: #d7b584; text-decoration: none; padding-bottom: 4px;
      border-bottom: 1px solid rgba(215,181,132,.3);
      opacity: 0; transform: translateX(40px);
      transition: opacity .8s var(--ocm-ease) .46s, transform .8s var(--ocm-ease) .46s, color .25s;
    }
    .menu-archive svg { width: 0.85em; height: 0.85em; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .menu-archive:hover { color: #ecc998; }
    .menu-overlay.is-open .menu-archive { opacity: 1; transform: translateX(0); }
    .menu-notes { margin-top: clamp(8px,1.6vh,12px);

</head>

    <div class="wrap">

        Noema
      </a>
      <div class="top-title">Notes</div>
    </div>

    <div class="grid">
      <!-- LIJEVA KOLONA: Lista naslova (1/3) -->
      <section class="column">
        <div class="column-head">
          <div class="col-title">Notes</div>
          <div class="col-count"><span class="num" id="noteCount">0</span> total</div>
        </div>
        <div class="search-wrap">
          <input class="search-input" id="searchInput" type="search" placeholder="Search notes..." autocomplete="off" aria-label="Pretraga bilješki" />
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
          <button class="search-clear" id="searchClear" title="Clear search" hidden>×</button>
        </div>
        <div class="search-meta" id="searchMeta"></div>
        <ul class="sidebar-list" id="sidebarList"></ul>

        </div>

      <!-- DESNA KOLONA: Sadržaj izabrane bilješke (2/3) -->
      <section class="column is-feature" id="detailCol" style="display: none;">
        <div class="column-head" style="display: flex; justify-content: space-between; align-items: flex-start;">

            <div class="col-title" id="detailTitle" contenteditable="true" spellcheck="false"></div>

          <!-- Toolbar (Labele i akcije) -->

             <button id="pinNoteBtn" class="note-action-btn" title="Pin note">📌 Pin</button>
             <button id="archiveNoteBtn" class="note-action-btn" title="Arhiviraj bilješku">📦 Arhiviraj</button>
             <button id="previewNoteBtn" class="note-action-btn" title="Toggle preview">👁 Preview</button>
             <input type="text" id="noteLabels" class="note-labels-input" placeholder="Tags (comma separated)..." />

          <div id="notePreview" class="note-preview" style="display: none; flex: 1; width: 100%; padding: 0 1.5rem 1.5rem; font-family: var(--font-sans); font-size: 1rem; color: var(--ink); line-height: 1.6; min-height: 300px; overflow-y: auto;"></div>

        <span id="ftIcon">☾</span>
      </button>
    </div>
  </footer>

  <script>
    "use strict";

    let notes = [];
    let activeId = null;
    let query = "";            // aktivna pretraga (mala slova, trimovano)

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    /** Esc za regex meta-karaktere — koristi se kad se query ugrađuje u RegExp. */
    function escRe(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    /** Vraća true ako bilješka sadrži query (naslov ili bilo koja stavka). */
    function matchesSearch(note, q) {
      if (!q) return true;
      return searchResult(note, q) !== null;
    }

    function searchResult(note, q) {
      if (!q) return null;
      const inTitle = (note.title || "").toLowerCase().includes(q);
      const inBody = (note.body || "").toLowerCase().includes(q);
      
      let badgeHit = null;
      if (inTitle) badgeHit = "naslov";
      else if (inBody) badgeHit = "tijelo";
      
      if (!inTitle && !inBody) return null;
      return { inTitle, inBody, badgeHit };
    }

    /** highlight(text, q) — escaped HTML sa <mark> oko match-ova query-ja. */
    function hl(text, q) {
      const safe = esc(text || "");
      if (!q) return safe;
      try {
        const re = new RegExp(`(${escRe(q)})`, "gi");
        return safe.replace(re, '<mark class="hl">$1</mark>');
      } catch {
        return safe;
      }
    }

    function fmtDate(ts) {
      const d = new Date(ts);
      if (isNaN(d.getTime())) return "";
      const months = ["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${d.getDate()}. ${months[d.getMonth()]} ${d.getFullYear()} · ${hh}:${mm}`;
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch { /* not json */ }
      if (!res.ok) throw new Error((json && json.error) || `HTTP ${res.status}`);
      return json;
    }

    const els = {
      sidebar: document.getElementById('sidebarList'),
      count: document.getElementById('noteCount'),
      newBtn: document.getElementById('newNoteBtn'),
      detailCol: document.getElementById('detailCol'),
      emptyCol: document.getElementById('emptyCol'),
      title: document.getElementById('detailTitle'),
      date: document.getElementById('detailDate'),
      delBtn: document.getElementById('deleteNoteBtn'),
      body: document.getElementById('noteBody'),
      preview: document.getElementById('notePreview'),
      pinBtn: document.getElementById('pinNoteBtn'),
      archiveBtn: document.getElementById('archiveNoteBtn'),
      previewBtn: document.getElementById('previewNoteBtn'),
      labelsInput: document.getElementById('noteLabels'),
      searchInput: document.getElementById('searchInput'),
      searchClear: document.getElementById('searchClear'),
      searchMeta: document.getElementById('searchMeta')
    };

    function renderSidebar() {
      const q = query;
      // Brojač uvijek pokazuje total — da korisnik ne izgubi orijentaciju tokom pretrage.
      els.count.textContent = notes.length;
      // Search meta: koliko je match-ova pronađeno (uvijek zauzima prostor da input ne "skače").
      els.searchMeta.textContent = q
        ? (notes.length ? "Search..." : "")
        : "";
      els.searchClear.hidden = !q;

      const visible = q ? notes.filter((n) => matchesSearch(n, q)) : notes;
      els.sidebar.innerHTML = '';
      if (!visible.length) {
        const li = document.createElement('li');
        li.className = "sidebar-empty";
        li.textContent = q ? "Nema resulta za „" + q + "“." : "No notes found.";
        els.sidebar.appendChild(li);
        // Još jednom ažuriraj meta sa stvarnim brojem.
        if (q) els.searchMeta.textContent = "0 resulta";
        return;
      }
      if (q) {
        els.searchMeta.textContent = `${visible.length} ${visible.length === 1 ? "result" : "resulta"}`;
      }
      visible.forEach(note => {
        const li = document.createElement('li');
        li.className = `sidebar-item ${note.id === activeId ? 'active' : ''}`;
        const res = q ? searchResult(note, q) : null;
        if (res) {
          if (res.badgeHit) {
            badge = `<span class="si-badge ${res.badgeHit === 'naslov' ? 'title' : 'item'}">${res.badgeHit}</span>`;
          }
        }
        
        let previewHtml = "";
        if (res && res.inBody && !res.inTitle && note.body) {
           const idx = note.body.toLowerCase().indexOf(q);
           const start = Math.max(0, idx - 20);
           const snippet = (start > 0 ? "..." : "") + note.body.substring(start, idx + 40) + "...";
           previewHtml = `<div class="si-items" style="font-size: 0.8rem; color: var(--ink-4); padding: 0.3rem 0.6rem;">${hl(snippet, q)}</div>`;
        }

        li.innerHTML = `
          <div class="si-top">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="${note.pinned ? 'var(--beacon)' : 'currentColor'}" fill="${note.pinned ? 'var(--beacon)' : 'none'}" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="si-title">${hl(note.title || 'New note', q)}</span>
            ${badge}
          </div>
          ${previewHtml}
        `;
        li.onclick = () => selectNote(note.id);
        els.sidebar.appendChild(li);
      });
    }

    function selectNote(id) {
      activeId = id;
      renderSidebar();
      renderDetail();
    }

    function renderDetail() {
      const note = notes.find(n => n.id === activeId);
      if (!note) {
        els.detailCol.style.display = 'none';
        els.emptyCol.style.display = 'flex';
        return;
      }
      els.detailCol.style.display = 'flex';
      els.emptyCol.style.display = 'none';
      
      els.title.textContent = note.title;
      els.date.textContent = fmtDate(note.updatedAt || note.createdAt);
      els.body.value = note.body || "";
      els.labelsInput.value = (note.labels || []).join(", ");
      
      els.pinBtn.textContent = note.pinned ? "📌 Unpin" : "📌 Pin";
      els.pinBtn.style.color = note.pinned ? "var(--beacon)" : "";
      
      els.archiveBtn.textContent = note.archived ? "📦 Restore" : "📦 Arhiviraj";
      
      // Reset preview state on note change
      els.body.style.display = "block";
      els.preview.style.display = "none";
      els.previewBtn.style.background = "";
    }

    // Auto-save logic
    let saveTimeout = null;
    function scheduleSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveNoteData, 500);
    }
    
    // Markdown/Wiki link parser
    function renderMarkdown(text) {
      let html = esc(text);
      // Wiki links [[Naslov]]
      html = html.replace(/\[\[(.*?)\]\]/g, (match, p1) => {
        const title = p1.trim();
        const found = notes.find(n => n.title.toLowerCase() === title.toLowerCase());
        if (found) {
           return `<a href="#" onclick="event.preventDefault(); selectNote('${found.id}');" style="color:var(--azure); text-decoration:none; font-weight:500;">${esc(title)}</a>`;
        }
        return `<span style="color:var(--ink-4); border-bottom:1px dashed currentColor;" title="Nepostojeća bilješka">${esc(title)}</span>`;
      });
      // Bold
      html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      // Italics
      html = html.replace(/\*(.*?)\*/g, '<i>$1</i>');
      // Checklists
      html = html.replace(/^- \[(x| )\] (.*)$/gm, (match, state, txt) => {
         return `<div style="display:flex; gap:0.5rem; align-items:center;"><input type="checkbox" disabled ${state==='x'?'checked':''}> <span style="${state==='x'?'text-decoration:line-through; color:var(--ink-4)':''}">${txt}</span></div>`;
      });
      // Newlines
      html = html.replace(/\n/g, '<br>');
      return html;
    }
    
    els.previewBtn.onclick = () => {
       const isPreview = els.preview.style.display === "block";
       if (isPreview) {
         els.preview.style.display = "none";
         els.body.style.display = "block";
         els.previewBtn.style.background = "";
         els.body.focus();
       } else {
         let html = renderMarkdown(els.body.value);
         
         const currentTitle = els.title.textContent.trim().toLowerCase();
         if (currentTitle && currentTitle !== 'nova bilješka') {
            const backlinks = notes.filter(n => n.id !== activeId && n.body && n.body.toLowerCase().includes(`[[${currentTitle}]]`));
            if (backlinks.length > 0) {
              html += `<div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px dashed var(--ink-line-2);">`;
              html += `<div style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-4); margin-bottom: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase;">Povezano iz:</div>`;
              html += `<div style="display: flex; flex-direction: column; gap: 0.5rem;">`;
              backlinks.forEach(bl => {
                 html += `<a href="#" onclick="event.preventDefault(); selectNote('${bl.id}');" style="color: var(--azure); text-decoration: none; font-weight: 500; font-size: 0.95rem;">↳ ${esc(bl.title)}</a>`;
              });
              html += `</div></div>`;
            }
         }
         
         els.preview.innerHTML = html;
         els.body.style.display = "none";
         els.preview.style.display = "block";
         els.previewBtn.style.background = "var(--beacon-soft)";
       }
    };
    
    async function saveNoteData() {
      const note = notes.find(n => n.id === activeId);
      if (!note) return;
      
      const newBody = els.body.value;
      const labelsStr = els.labelsInput.value;
      const newLabels = labelsStr.split(",").map(s => s.trim()).filter(s => s);
      
      if (newBody === note.body && JSON.stringify(newLabels) === JSON.stringify(note.labels)) return;
      
      note.body = newBody;
      note.labels = newLabels;
      
      try {
        const res = await api(`/api/notes/${note.id}`, {
          method: "PATCH",
          body: JSON.stringify({ body: newBody, labels: newLabels })
        });
        Object.assign(note, res.note);
      } catch (e) {
        console.error("Save error:", e);
      }
    }
    
    els.body.addEventListener("input", scheduleSave);
    els.labelsInput.addEventListener("input", scheduleSave);
    
    // Pin and Archive toggles
    els.pinBtn.onclick = async () => {
      const note = notes.find(n => n.id === activeId);
      if (!note) return;
      note.pinned = !note.pinned;
      renderDetail();
      renderSidebar();
      try {
        await api(`/api/notes/${note.id}`, { method: "PATCH", body: JSON.stringify({ pinned: note.pinned }) });
      } catch (e) {
        alert("Greška: " + e.message);
      }
    };
    
    els.archiveBtn.onclick = async () => {
      const note = notes.find(n => n.id === activeId);
      if (!note) return;
      note.archived = !note.archived;
      renderDetail();
      try {
        await api(`/api/notes/${note.id}`, { method: "PATCH", body: JSON.stringify({ archived: note.archived }) });
      } catch (e) {
        alert("Greška: " + e.message);
      }
    };

    // Dodavanje nove liste
    els.newBtn.onclick = async () => {
      try {
        const res = await api("/api/notes", {
          method: "POST",
          body: JSON.stringify({ title: "New note", items: [] })
        });
        notes.unshift(res.note);
        // Clear search da nova bilješka bude vidljiva u sidebar-u.
        if (query) {
          els.searchInput.value = '';
          query = '';
        }
        selectNote(res.note.id);
        setTimeout(() => els.title.focus(), 50);
      } catch (e) {
        alert("Greška: " + e.message);
      }
    };

    // Brisanje bilješke
    els.delBtn.onclick = async () => {
      try {
        await api(`/api/notes/${activeId}`, { method: "DELETE" });
        notes = notes.filter(n => n.id !== activeId);
        activeId = notes.length ? notes[0].id : null;
        renderSidebar();
        renderDetail();
      } catch (e) {
        alert("Greška: " + e.message);
      }
    };

    // Promena naslova
    els.title.onblur = async () => {
      const note = notes.find(n => n.id === activeId);
      if (!note) return;
      const newTitle = els.title.textContent.trim() || "Untitled";
      if (newTitle !== note.title) {
        try {
          const res = await api(`/api/notes/${note.id}`, {
            method: "PATCH",
            body: JSON.stringify({ title: newTitle })
          });
          note.title = res.note.title;
          renderSidebar();
        } catch (e) {
          console.error("Title save error:", e);
        }
      }
    };

    // ── Pretraga ──
    els.searchInput.addEventListener('input', () => {
      query = els.searchInput.value.trim().toLowerCase();
      renderSidebar();
    });
    els.searchClear.addEventListener('click', () => {
      els.searchInput.value = '';
      query = '';
      renderSidebar();
      els.searchInput.focus();
    });
    // Escape u search polju odmah čisti pretragu.
    els.searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && query) {
        els.searchInput.value = '';
        query = '';
        renderSidebar();
      }
    });
    // "/" fokusira pretragu (ako korisnik ne uređuje neki input).
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' &&
          document.activeElement.isContentEditable !== true) {
        e.preventDefault();
        els.searchInput.focus();
      }
    });

    // ── Theme toggle ──
    function getStoredTheme() {
      try { return localStorage.getItem("noema-theme"); } catch (e) { return null; }
    }
    function storeTheme(t) {
      try { localStorage.setItem("noema-theme", t); } catch (e) {}
    }
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      const icon = document.getElementById("ftIcon");
      if (icon) icon.textContent = t === "dark" ? "☀" : "☾";
    }
    applyTheme(getStoredTheme() || "dark");
    const themeBtn = document.getElementById("footerTheme");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
        storeTheme(next);
      });
    }

    // ── Font Scale ──
    let fontScale = Number(localStorage.getItem("noema-font-scale")) || 1;
    function applyFontScale(scale) {
      document.documentElement.style.fontSize = (16 * scale) + "px";
      document.body.style.fontSize = (16 * scale) + "px";
    }
    function initFontScale() {
      applyFontScale(fontScale);
      const decBtn = document.getElementById("fontDec");
      const incBtn = document.getElementById("fontInc");
      const resBtn = document.getElementById("fontReset");
      if (decBtn) decBtn.addEventListener("click", () => {
        fontScale = Math.max(0.4, fontScale - 0.3);
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
      if (incBtn) incBtn.addEventListener("click", () => {
        fontScale = Math.min(2.5, fontScale + 0.3);
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
      if (resBtn) resBtn.addEventListener("click", () => {
        fontScale = 1;
        localStorage.setItem("noema-font-scale", fontScale);
        applyFontScale(fontScale);
      });
    }
    initFontScale();

    // ── Sistemski resursi servera (CPU/RAM/Disk) u futeru ──
    function fmtGB(bytes) { return (bytes / 1073741824).toFixed(1); }
    async function loadSystem() {
      const el = document.getElementById("sysStats");
      if (!el) return;
      try {
        const res = await fetch("/api/system");
        if (!res.ok) throw new Error();
        const data = await res.json();
        const cpu = data.cpu ? `${data.cpu.percent}%` : "—";
        const ram = data.mem ? `${data.mem.percent}%` : "—";
        const disk = data.disk ? `${data.disk.percent}%` : "—";
        el.innerHTML = `CPU: <b>${cpu}</b> · RAM: <b>${ram}</b> · Disk: <b>${disk}</b>`;
        const parts = [];
        if (data.cpu) parts.push(`CPU ${data.cpu.cores} jezgara`);
        if (data.mem) parts.push(`RAM ${fmtGB(data.mem.used)}/${fmtGB(data.mem.total)} GB`);
        if (data.disk) parts.push(`Disk ${fmtGB(data.disk.used)}/${fmtGB(data.disk.total)} GB`);
        el.title = parts.join(" · ") || "Resursi servera";
      } catch (err) {
        el.innerHTML = `<span style="font-style:italic">sistem nedostupan</span>`;
      }
    }
    loadSystem();
    setInterval(loadSystem, 5000);

    async function load() {
      try {
        const res = await api("/api/notes");
        notes = (res && res.notes) || [];
        renderSidebar();
        if (notes.length > 0) {
          selectNote(notes[0].id);
        }
      } catch (err) {
        notes = [];
        renderSidebar();
      }
    }

    load();
  // ── Push-meni (port "Salient reveal" iz the original portfolio) ──
    function initMenu() {
      const burger = document.getElementById("mobileBurger");
      const overlay = document.getElementById("mobileMenu");
      const closeBtn = document.getElementById("closeMobile");
      if (!burger || !overlay) return;

      // Umotaj cijelu stranicu u #shell (karticu); meni izvuci IZA kartice.
      const shell = document.createElement("div");
      shell.id = "shell";
      const inner = document.createElement("div");
      inner.id = "shell-inner";
      while (document.body.firstChild) inner.appendChild(document.body.firstChild);
      shell.appendChild(inner);
      const scrim = document.createElement("div");
      scrim.className = "shell-scrim";
      scrim.setAttribute("aria-hidden", "true");
      shell.appendChild(scrim);
      document.body.appendChild(shell);
      document.body.appendChild(overlay); // meni iza kartice (niži z-index)

      let sy = 0, unfixTimer = null;
      const setExpanded = (o) => burger.setAttribute("aria-expanded", o ? "true" : "false");

      function open() {
        if (unfixTimer) { clearTimeout(unfixTimer); unfixTimer = null; }
        if (!document.body.classList.contains("menu-fixed")) {
          sy = window.scrollY || window.pageYOffset || 0;
          inner.style.transform = "translateY(" + (-sy) + "px)";
          document.body.classList.add("menu-fixed");
          void shell.offsetWidth; // reflow da se .8s transform animira iz mira
        }
        requestAnimationFrame(() => {
          document.body.classList.add("menu-pushed");
          overlay.classList.add("is-open");
        });
        setExpanded(true);
      }
      function close() {
        overlay.classList.remove("is-open");
        document.body.classList.remove("menu-pushed");
        setExpanded(false);
        if (unfixTimer) clearTimeout(unfixTimer);
        unfixTimer = setTimeout(() => {
          document.body.classList.remove("menu-fixed");
          inner.style.transform = "";
          window.scrollTo(0, sy);
          unfixTimer = null;
        }, 850);
      }

      burger.addEventListener("click", open);
      closeBtn.addEventListener("click", close);
      scrim.addEventListener("click", close);
      overlay.querySelectorAll("a").forEach((l) => {
        l.addEventListener("click", (e) => {
          const href = l.getAttribute("href");
          const target = l.getAttribute("target");
          if (!href || href === "#" || target === "_blank") {
            close();
            return;
          }
          e.preventDefault();
          close();
          setTimeout(() => {
            window.location.href = href;
          }, 850);
        });
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.body.classList.contains("menu-pushed")) close();
      });
    }

        initMenu();
  </script>
