name: One-time legacy auth refactor

on:
  push:
    branches:
      - agent/p0-p1-p2-hardening

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[p0-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-p1-p2-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove legacy inner auth
        run: node scripts/refactor-legacy-auth.mjs
      - name: Validate refactor
        run: |
          node --check src/server.js
          ! grep -q "WWW-Authenticate\|checkUiPassword\|createSessionToken\|verifySessionToken\|ipRequestCounts" src/server.js
      - name: Commit refactor and remove migration helper
        run: |
          rm scripts/refactor-legacy-auth.mjs .github/workflows/one-time-p0-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy inner auth [p0-refactor]"
          git push
