name: Apply audit fixes

on:
  push:
    branches: [agent/fix-audit-findings]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: noema-apply-audit-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/fix-audit-findings')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings
          fetch-depth: 0

      - name: Repair nested template literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-audit-fixes.mjs')
          s = p.read_text()
          replacements = {
              'path: `${url.pathname}${url.search}`,': 'path: url.pathname + url.search,',
              'reject(new Error(`Response exceeds the ${maxBytes}-byte limit.`));': 'reject(new Error("Response exceeds the " + maxBytes + "-byte limit."));',
              'response.destroy(new Error(`Response exceeds the ${maxBytes}-byte limit.`));': 'response.destroy(new Error("Response exceeds the " + maxBytes + "-byte limit."));',
              'throw new Error(`Remote server returned HTTP ${response.status}.`);': 'throw new Error("Remote server returned HTTP " + response.status + ".");',
              'throw new Error(`Unable to resolve weekday for timezone ${timeZone}.`);': 'throw new Error("Unable to resolve weekday for timezone " + timeZone + ".");',
              'throw new Error(`Server exited with ${child.exitCode}`);': 'throw new Error("Server exited with " + child.exitCode);',
              'const base = `http://127.0.0.1:${port}`;': 'const base = "http://127.0.0.1:" + port;',
              'await waitFor(`${base}/healthz`, child);': 'await waitFor(base + "/healthz", child);',
              'fetch(`${base}/auth/google`,': 'fetch(base + "/auth/google",',
              'fetch(`${base}/auth/google/callback?error=access_denied`,': 'fetch(base + "/auth/google/callback?error=access_denied",',
              'fetch(`${base}/noema-i18n.js`)': 'fetch(base + "/noema-i18n.js")',
              'fetch(`${base}/`,': 'fetch(base + "/",',
              'fetch(`${base}/api/backup/snapshot`,': 'fetch(base + "/api/backup/snapshot",',
              'fetch(`${base}/api/backup/restore-snapshot`,': 'fetch(base + "/api/backup/restore-snapshot",',
              'Authorization: `Bearer ${token}`': 'Authorization: "Bearer " + token',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing migration fragment: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Apply reviewed fixes
        run: node scripts/apply-audit-fixes.mjs

      - name: Validate generated JavaScript
        run: |
          node --check src/server.js
          node --check src/core/outbound.js
          node --check src/store/links.js
          node --check src/store/todos.js
          node --check public/noema-i18n.js

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix application audit findings"
          git push origin HEAD:agent/fix-audit-findings
