name: Unify data directory

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fix-audit-findings'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings
          fetch-depth: 0

      - name: Leave CI workflow for owner commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/unify-data-dir.py')
          text = p.read_text()
          start = text.index('ci = ROOT / ".github" / "workflows" / "ci.yml"')
          end = text.index('env_example = ROOT / ".env.example"')
          p.write_text(text[:start] + text[end:])
          PY

      - name: Apply data directory migration
        run: python3 scripts/unify-data-dir.py

      - name: Validate application
        run: |
          node --check src/config.js
          node --check src/server.js
          node --check src/store/crypto.js
          node --check src/store/todos.js
          node --check src/store/notes.js
          node --check src/store/documents.js
          node --check src/store/links.js
          node --check src/store/inspirations.js
          node --check src/store/buildingsites.js
          node --check src/store/calendar.js
          npm run check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use one configurable data directory"
          git push origin HEAD:agent/fix-audit-findings
