name: CI

on:
  push:
    branches: [main, agent/prepare-public-release, agent/sqlite-store-refactor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run project checks
        run: npm run check

      - name: Smoke-test server and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          export HOST=127.0.0.1
          export PORT=3999
          export PUBLIC_BASE_URL=http://127.0.0.1:3999
          export NOEMA_TIMEZONE=UTC
          export ENCRYPTION_KEY=ci-only-encryption-key
          smoke_dir="$(mktemp -d)"
          export NOEMA_DATA_DIR="$smoke_dir/data"
          (
            cd "$smoke_dir"
            exec node "$GITHUB_WORKSPACE/src/index.js"
          ) > /tmp/noema-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$smoke_dir"' EXIT

          for attempt in {1..40}; do
            if node -e "const r=await fetch('http://127.0.0.1:3999/healthz'); if(!r.ok) process.exit(1)" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/noema-ci.log
              exit 1
            fi
            sleep 0.25
          done

          node -e "const r=await fetch('http://127.0.0.1:3999/healthz');const j=await r.json();if(!r.ok||!j.ok)process.exit(1)"
          node -e "const r=await fetch('http://127.0.0.1:3999/openapi.json');const j=await r.json();if(j.openapi!=='3.1.0')process.exit(1)"
          node -e "const r=await fetch('http://127.0.0.1:3999/api/calendar?day=banana');if(r.status!==400)process.exit(1)"
          node -e "const r=await fetch('http://127.0.0.1:3999/');if(!r.ok||!(await r.text()).includes('Noema'))process.exit(1)"
          test -s "$NOEMA_DATA_DIR/noema.sqlite"

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --tag noema-ci .

      - name: Verify runtime tools
        run: docker run --rm --entrypoint sh noema-ci -c 'command -v zip >/dev/null && node -e "import(\"node:sqlite\")"'

      - name: Smoke-test container and ZIP backup
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name noema-ci-app \
            -p 3998:3000 \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e PUBLIC_BASE_URL=http://127.0.0.1:3998 \
            -e NOEMA_TIMEZONE=UTC \
            -e ENCRYPTION_KEY=ci-only-encryption-key \
            noema-ci
          trap 'docker logs noema-ci-app 2>/dev/null || true; docker rm -f noema-ci-app 2>/dev/null || true' EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3998/healthz >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' noema-ci-app 2>/dev/null | grep -q true; then
              exit 1
            fi
            sleep 0.5
          done

          curl --fail --silent --show-error \
            --output /tmp/noema-backup.zip \
            http://127.0.0.1:3998/api/backup/download
          test -s /tmp/noema-backup.zip
          unzip -t /tmp/noema-backup.zip
