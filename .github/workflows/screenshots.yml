name: Generate screenshots

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/**"
      - "src/**"
      - "scripts/capture-screenshots.mjs"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noema-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: 22

      - name: Run project checks
        run: npm run check

      - name: Install screenshot tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Generate neutral screenshots
        run: node scripts/capture-screenshots.mjs

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned
        with:
          name: noema-public-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated screenshots
        shell: bash
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git commit -m "docs: update public screenshots"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
