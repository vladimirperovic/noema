name: Security and recovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: 24

      - name: Scan committed secrets
        run: npm run scan:secrets

      - name: Generate deterministic SPDX SBOM
        run: npm run sbom -- /tmp/noema.spdx.json

      - name: Run complete regression and backup tests
        run: npm run check

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4

      - name: Build runtime image
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t noema-security:${{ github.sha }} .

      - name: Scan runtime image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned
        with:
          image-ref: noema-security:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
