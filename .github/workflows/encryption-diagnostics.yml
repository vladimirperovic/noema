name: Encryption diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        shell: bash
        run: |
          files="$(find test -maxdepth 1 -type f -name '*.test.js' -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  each-test:
    needs: discover
    name: test (${{ matrix.file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test "test/${{ matrix.file }}"

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node --check src/index.js
          node --check src/server.js
          node --check src/file-library.js
          node --check src/gallery-downloads.js
          node --check src/link-thumbnails.js
          node --check src/private-asset-gateway.js
          node --check src/security-gateway.js
          node --check src/security/auth-routes.js
          node --check src/store/crypto.js
          node --check src/store/files.js
          node --check src/store/private-assets.js

  full-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm run check
