name: Feature request
description: Propose a focused improvement to the reference application
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Noema is a customization base, so domain-specific behavior may be better implemented in a fork. Explain which reusable problem the proposal solves.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What current limitation or repeated need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior, not only the interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could this be configuration, documentation, or an example fork instead?
  - type: textarea
    id: impact
    attributes:
      label: Data, privacy, and migration impact
      description: Note changes to stored data, routes, authentication, backups, or integrations.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The proposal is useful beyond one private deployment.
          required: true
        - label: I searched existing issues and pull requests.
          required: true
        - label: I have not included secrets or personal data.
          required: true
